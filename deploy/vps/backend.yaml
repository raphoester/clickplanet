httpServer:
  bindAddress: 0.0.0.0:8080
  startupTimeout: 1m
  adminBindAddress: 127.0.0.1:8081
  internalBindAddress: 127.0.0.1:8082
gameMap:
  maxIndex: 262119

database:
  host: postgres
  password: env://POSTGRES_PASSWORD
  port: "5432"
  user: clickplanet
  dbName: clickplanet
  sslMode: disable
  schema: planet
  pool:
    maxOpenConns: 4

tilesStorage:
  flushInterval: 1s

ledger:
  retention: 72h

chargeStorage:
  flushInterval: 1s

ledgerStorage:
  flushInterval: 1s
  maxTakes: 4000000

rateLimiter:
  perSecond: 0.2
  burst: 60
  scopeMultiplier: 10
  guestScopeMultiplier: 1
  linkedMultiplier: 2
  newAccountClicks: 10

toll:
  steps:
    - {share: 0.10, slowdown: 1.5}
    - {share: 0.20, slowdown: 2.5}
    - {share: 0.30, slowdown: 4}

vpnBlocklist:
  enabled: true
  includeDatacenters: true
  allow: []

antiBot:
  enabled: true

  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: antibot
    pool:
      maxOpenConns: 2

  shadowBan:
    enforce: true
    banDurations: [24h, 168h, 26280h]
    reflagInterval: 5m
    saveInterval: 1m

  jury:
    minSuspects: 2
    suspicionWindow: 10m
    trackWindow: 15m
    sweepInterval: 1m

  evidence:
    saveInterval: 1m
    retention: 72h

  retaker:
    enabled: true
    detector:
      reactionWindow: 5s
      minReactions: 20
      maxSpread: 300ms
      maxMedian: 250ms
      minTiles: 15
      roamMedian: 600ms
      certainTiles: 30
      trackWindow: 15m
      sweepInterval: 1m

  sequencer:
    enabled: true
    detector:
      minSteps: 40
      minShare: 0.75
      certainSteps: 200
      certainShare: 0.95
      trackWindow: 15m
      sweepInterval: 1m

  metronome:
    enabled: true
    detector:
      maxGap: 7s
      maxSpread: 400ms
      minClicks: 120
      certainFor: 30m
      certainClicks: 900
      shape:
        maxGap: 10s
        clicks: 500
        certainClicks: 1000
      stamina:
        slice: 10m
        clicks: 40
        window: 6h
        certainBusy: 5h30m
      trackWindow: 15m
      sweepInterval: 1m

  defender:
    enabled: true
    detector:
      retakeWindow: 2m
      minClicks: 40
      minShare: 0.6
      certainClicks: 200
      trackWindow: 10m
      sweepInterval: 1m

  catcher:
    enabled: true
    detector:
      minCatches: 5
      maxMedian: 3s
      certainMedian: 1500ms
      trackWindow: 1h
      sweepInterval: 1m

  cohort:
    enabled: true
    detector:
      startWindow: 5s
      minClicks: 20
      minFlagShare: 0.9
      rateRatio: 1.5
      lengthRatio: 1.2
      quietAfter: 1m
      minMembers: 2
      v4Bits: 24
      v6Bits: 44
      certainCohorts: 3
      certainMembers: 6
      chainWindow: 30m
      trackWindow: 30m
      sweepInterval: 1m

  scraper:
    enabled: true
    detector:
      minMaps: 5
      certainMaps: 15
      trackWindow: 15m
      sweepInterval: 1m

  churner:
    enabled: true
    detector:
      window: 1h
      v6:
        minAccounts: 4
        certainAccounts: 6
      v4:
        minAccounts: 10
        certainAccounts: 20
      relay:
        handoff: 90s
        maxLife: 5m
        minClicks: 20
        minFlagShare: 0.9
        v4Bits: 24
        v6Bits: 32
        minLinks: 3
        certainLinks: 6
      sweepInterval: 1m

bonus:
  minInterval: 4m
  maxInterval: 8m

  missRetry: 2m

  kinds:
    refill: 5
    spread_clicks: 3
    enclose_clicks: 2
    bomb: 1
    shields: 3

  offerTTL: 15s

  spread:
    clicks: 8
    maxPerBox: 4

  bomb:
    rings: 4

  enclose:
    maxTiles: 25
    held: 3
    maxPerBox: 3

  shield:
    held: 12
    maxPerBox: 3
    perTile: 10

  activeWithin: 2m

  forgetAfter: 5m

  maxChargesPerHour: 12

  sweepInterval: 1s

  quiz:
    enabled: true

    minInterval: 4m
    maxInterval: 8m

    missRetry: 2m

    offerTTL: 25s

    answerWindow: 8s

    leaderBias: 1

    maxChargesPerHour: 12

auth:
  enabled: true
  enforce: true
  secret: env://SESSION_SECRET
  ttl: 1h
  rateLimiter:
    perSecond: 0.033
    burst: 10
  turnstile:
    enabled: true
    secret: env://TURNSTILE_SECRET
    # Never add localhost: this is the production widget.
    hostnames:
      - clickplanet.lol
      - www.clickplanet.lol
    action: session
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: auth
    pool:
      maxOpenConns: 2
  signIn:
    enabled: true
    redirectUrl: https://clickplanet.lol/auth/callback
  google:
    clientId: 865499711308-guuo7rdvol1ocjeanar1kbo3bulc4pb6.apps.googleusercontent.com
    clientSecret: env://GOOGLE_CLIENT_SECRET
  discord:
    clientId: "1549822806420885616"
    clientSecret: env://DISCORD_CLIENT_SECRET
  email:
    enabled: true
    delivery: cloudflare
    from: noreply@clickplanet.lol
    fromName: ClickPlanet
    cloudflare:
      accountId: 76f6f3883c3a531ae90d1dc4b96bf810
      apiToken: env://CLOUDFLARE_EMAIL_TOKEN
  prune:
    idleFor: 2160h
    interval: 1h

chat:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: chat
    pool:
      maxOpenConns: 2
  storage:
    historySize: 200
    retention: 720h
  rateLimiter:
    perSecond: 0.33
    burst: 5
  blockedIPs: []

player:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: player
    pool:
      maxOpenConns: 4
  tagSalt: env://CHAT_TAG_SALT

seasons:
  list:
    - number: 0
      endsAt: 2026-10-31T23:00:00Z
      finale: 2h
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: seasons
    pool:
      maxOpenConns: 2
