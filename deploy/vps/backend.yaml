# Production backend config for the VPS stack.
#
# There is no database: the API holds the whole tile map in process and
# snapshots it to /home/app/state, which is the tile_state volume in
# docker-compose.yaml. That file is the only thing worth backing up.

httpServer:
  bindAddress: 0.0.0.0:8080
gameMap:
  maxIndex: 257948 # must match the tile count baked into the frontend coordinates

tilesStorage:
  snapshotPath: /home/app/state/tiles.snapshot
  # Upper bound on what a hard kill (OOM, power loss) can lose. A clean
  # `docker compose down` or a rolling redeploy loses nothing: the API writes a
  # final snapshot on SIGTERM.
  snapshotInterval: 30s

# Per-caller throttle on the Click RPC. Keyed on the address Caddy puts in
# X-Real-IP, which is Cloudflare's Cf-Connecting-Ip — the real visitor — over
# IPv4, and on that address's /64 over IPv6. A v6 subscriber owns every address
# in its own /64, so charging one address would be charging nothing.
rateLimiter:
  perSecond: 1
  burst: 10

# Refuses clicks from known VPN and proxy ranges: the throttle above is keyed on
# an address, and a VPN is the cheap way to get a fresh one. Reads and the
# websocket are untouched, so a VPN user still watches the planet.
vpnBlocklist:
  enabled: true
  # Also refuses datacenter and hosting ranges, which is what catches a
  # self-hosted WireGuard on a VPS. It costs you Apple iCloud Private Relay and
  # Cloudflare WARP users, who egress from those same ranges. Watch
  # blocked_clicks{list="datacenter"} against clicks for what that is worth.
  includeDatacenters: true
  allow: []

# Gates the Click RPC on a token this server minted, which is the one thing an
# address-based defence cannot do: refuse a caller that never proved anything,
# however many addresses it can reach the game from. The blocklist above raises
# the floor; this is what makes clicking cost something to start.
session:
  # On. The widget exists and .env holds SESSION_SECRET and TURNSTILE_SECRET;
  # without that last one the API does not start at all, it does not degrade.
  enabled: true
  # On: a click without a session this server minted is answered 401 and never
  # reaches the map. click_session_checks{verdict="valid"} carried the traffic
  # before this was flipped; "missing" is now a refusal rather than a count.
  enforce: true
  # session.secret and session.turnstile.secret come from the environment —
  # docker-compose.yaml passes them in from .env. Deliberately absent here:
  # this file is in git.
  ttl: 1h
  # Minting costs a siteverify round trip, so it gets its own budget rather than
  # sharing the click one. Ten in hand covers a reload loop; one every thirty
  # seconds is far more than a player needs.
  rateLimiter:
    perSecond: 0.033
    burst: 10
  # What one mint is worth. 1000 clicks is about 17 minutes of clicking at the
  # throttle without a single pause, which is not something a player does and is
  # exactly what a bot does — so this is sized as a signal, not as a brake.
  # Watch click_budget_exhausted: near zero is the healthy reading, and anything
  # sustained is automation holding a genuine session.
  #
  # It deliberately does not slow a bot down. Exhausting a budget costs one more
  # mint, and the throttle above allows ~118 of those an hour; a budget low
  # enough to bite into throughput (~30) would refuse players mid-game. The
  # click rateLimiter is what caps the rate, and it still does.
  #
  # A player who does hit this never sees it: the refusal is the same 401 a
  # lapsed token gets, and the client mints again and retries the click.
  clickBudget:
    clicks: 1000
    sweepInterval: 5m
  turnstile:
    enabled: true
    # Must match the frontend origin the widget is embedded on, and must not
    # include localhost: a production allowlist is not a development one.
    hostnames:
      - clickplanet.lol
      - www.clickplanet.lol
    # Must match the data-action the widget is rendered with, so a token minted
    # for another surface on the same sitekey is not accepted here.
    action: session

# Live chat. Every message is appended to a JSONL log on the same tile_state
# volume as the snapshot, so the droplet's weekly disk backup covers it — with
# a recovery point up to a week old.
#
# The log holds sender IPs alongside message text. Retention is therefore a
# policy, not a cache size: 30 days, applied by an hourly prune.
#
chat:
  enabled: true
  storage:
    logPath: /home/app/state/chat.log
    historySize: 200
    retention: 720h
  service:
    # Salts the per-sender tag. Deliberately empty here: this file is in git, and
    # the salt is what stops a reader of it from recomputing a sender's tag from
    # a guessed address. docker-compose.yaml passes the real one in from
    # CHAT_TAG_SALT in .env, which overrides this. Left empty on both sides the
    # API generates one at boot and warns — every sender's tag then changes on
    # each restart.
    tagSalt: ""
  # One message every three seconds, five in hand. Keyed the same way the click
  # limiter is: the X-Real-IP address over IPv4, its /64 over IPv6.
  rateLimiter:
    perSecond: 0.33
    burst: 5
  # Cut off an abusive sender here, then `docker compose restart backend`.
  # CIDRs, as in vpnBlocklist.allow above: 203.0.113.7/32 for one address,
  # 203.0.113.0/24 for the range someone is cycling through.
  blockedIPs: []
