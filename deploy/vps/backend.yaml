httpServer:
  bindAddress: 0.0.0.0:8080
  startupTimeout: 1m
  consoleBindAddress: 127.0.0.1:8081
  adminBindAddress: 0.0.0.0:8083
  internalBindAddress: 127.0.0.1:8082

gameMap:
  maxIndex: 260503

database:
  host: postgres
  password: env://POSTGRES_PASSWORD
  port: "5432"
  user: clickplanet
  dbName: clickplanet
  sslMode: disable
  schema: planet
  pool:
    maxOpenConns: 4

redis:
  address: redis:6379
  password: env://REDIS_PASSWORD

tilesStorage:
  flushInterval: 1s

ledger:
  retention: 72h

ledgerStorage:
  flushInterval: 1s
  maxTakes: 4000000

vpnBlocklist:
  enabled: true
  includeDatacenters: true
  allow: []

antiBot:
  enabled: true

  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: antibot
    pool:
      maxOpenConns: 2

  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD

  jury:
    trackWindow: 15m
    sweepInterval: 1m

  evidence:
    saveInterval: 1m
    retention: 72h

  retaker:
    trackWindow: 15m
    sweepInterval: 1m

  sequencer:
    trackWindow: 15m
    sweepInterval: 1m

  metronome:
    stamina:
      slice: 10m
    trackWindow: 15m
    sweepInterval: 1m

  defender:
    trackWindow: 10m
    sweepInterval: 1m

  catcher:
    trackWindow: 1h
    sweepInterval: 1m

  cohort:
    v4Bits: 24
    v6Bits: 44
    trackWindow: 30m
    sweepInterval: 1m

  scraper:
    trackWindow: 15m
    sweepInterval: 1m

  churner:
    relay:
      v4Bits: 24
      v6Bits: 32
    sweepInterval: 1m

  hopper:
    trackWindow: 15m
    sweepInterval: 1m

  rotator:
    slot: 5m
    sweepInterval: 1m

# The game's rules are the rule set postgres keeps (planet.rule_sets), edited on the backoffice.
bonus:
  forgetAfter: 5m

  sweepInterval: 1s

auth:
  enabled: true
  enforce: true
  secret: env://SESSION_SECRET
  ttl: 1h
  rateLimiter:
    perSecond: 0.033
    burst: 10
  turnstile:
    enabled: true
    secret: env://TURNSTILE_SECRET
    # Never add localhost: this is the production widget.
    hostnames:
      - clickplanet.lol
      - www.clickplanet.lol
      - crazygames.clickplanet.lol
    action: session
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: auth
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD
  signIn:
    enabled: true
    redirectUrl: https://clickplanet.lol/auth/callback
  google:
    clientId: 865499711308-guuo7rdvol1ocjeanar1kbo3bulc4pb6.apps.googleusercontent.com
    clientSecret: env://GOOGLE_CLIENT_SECRET
  discord:
    clientId: "1549822806420885616"
    clientSecret: env://DISCORD_CLIENT_SECRET
    # Every Discord sign-in also joins the game's Discord server, which the alerts module keeps.
    joinServer: true
  # The origin comes from ADMIN_ORIGIN, through docker-compose.yaml.
  # Claude, as a custom connector: it signs in here once, and the operator lets it in on the admin page's /connect.
  # The issuer comes from API_DOMAIN, through docker-compose.yaml; Claude's callbacks are the default redirects.
  connector:
    enabled: true
  admin:
    redirectUrl: https://backoffice.clickplanet.lol/auth/callback
    google:
      clientId: 865499711308-b1uvtdjiikb9perlhb0t9plm44e2bgh4.apps.googleusercontent.com
      clientSecret: env://ADMIN_GOOGLE_CLIENT_SECRET
  email:
    enabled: true
    delivery: cloudflare
    from: noreply@clickplanet.lol
    fromName: ClickPlanet
    cloudflare:
      accountId: 76f6f3883c3a531ae90d1dc4b96bf810
      apiToken: env://CLOUDFLARE_EMAIL_TOKEN
  prune:
    idleFor: 2160h
    interval: 1h
  deletion:
    grace: 720h
    interval: 1h

chat:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: chat
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD
  storage:
    historySize: 200
    retention: 720h
    # What an operator did to an account (ListModeration) outlives the messages it was about.
    moderationRetention: 2160h
  rateLimiter:
    perSecond: 0.33
    burst: 5
  blockedIPs: []
  # The judge of the reports support tells (docs/moderation.md). Empty, as long as no ANTHROPIC_API_KEY secret is set:
  # then it sends nothing, and every report waits for the operator.
  judge:
    anthropic:
      apiKey: env://ANTHROPIC_API_KEY
    callsPerHour: 6

player:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: player
    pool:
      maxOpenConns: 4
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD
  tagSalt: env://CHAT_TAG_SALT
  # The renames an operator made (ListRenames).
  renameRetention: 2160h

progression:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: progression
    pool:
      maxOpenConns: 4
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD

scoring:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: scoring
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD

gamemaster:
  dailyCutoff: 21h
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: gamemaster
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD

missions:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: missions
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD

support:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: support
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD
  retention: 2160h
  rateLimiter:
    perSecond: 0.0167
    burst: 3
  attachments:
    enabled: true
    maxPerNote: 10
    maxBytes: 52428800
    maxStoredBytes: 9663676416
    bucket:
      endpoint: https://76f6f3883c3a531ae90d1dc4b96bf810.r2.cloudflarestorage.com
      region: auto
      name: clickplanet-media
      accessKeyId: 918067992c114dc8f4fcea4aa7ac7921
      secretAccessKey: env://MEDIA_BUCKET_SECRET

# The numbers of the clips the clips job posted: `clips stats` sends a snapshot a day over ssh, the backoffice reads them.
# And who each clip names: `clips fetch` makes a run's cast, `clips schedule` keeps who each post names.
clips:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: clips
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD
  # The videos the operator posts by hand: the backoffice's Videos page. Same bucket and key as the support files,
  # under clips/videos/.
  videos:
    enabled: true
    maxBytes: 524288000
    bucket:
      endpoint: https://76f6f3883c3a531ae90d1dc4b96bf810.r2.cloudflarestorage.com
      region: auto
      name: clickplanet-media
      accessKeyId: 918067992c114dc8f4fcea4aa7ac7921
      secretAccessKey: env://MEDIA_BUCKET_SECRET

# The game's Discord server: a player's link, its flag's role, and the pings. A player joins it by signing in with
# Discord (auth.discord.joinServer). See deploy/vps/README.md, "Discord pings".
alerts:
  enabled: true
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: alerts
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD
  # The bot of auth.discord's application.
  discord:
    botToken: env://DISCORD_BOT_TOKEN
    guildId: "1310907949106860032"
    alertsChannelId: "1566864909709607044"
    battlesChannelId: "1566864959739011324"

# The squad that flags the swastikas players paint on the map, at Warn in the log and in
# vandalsquad.v1.AdminService/ListGraffiti. It reverts and bans nobody. See apps/backend/docs/vandalsquad.md.
vandalSquad:
  enabled: true
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD

# A battle's teaser: each rule set's cards, over the backgrounds the operator uploads on the backoffice's Promo page.
# Same bucket and key as the support files, under promo/backgrounds/; Cloudflare serves that prefix alone on
# media.clickplanet.lol. See deploy/vps/README.md, "Battle teasers".
promo:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: promo
    pool:
      maxOpenConns: 2
  backgrounds:
    enabled: true
    maxBytes: 2097152
    publicBaseURL: https://media.clickplanet.lol
    bucket:
      endpoint: https://76f6f3883c3a531ae90d1dc4b96bf810.r2.cloudflarestorage.com
      region: auto
      name: clickplanet-media
      accessKeyId: 918067992c114dc8f4fcea4aa7ac7921
      secretAccessKey: env://MEDIA_BUCKET_SECRET

# The connector's MCP endpoint, on the admin listener: every admin method is a tool. The url comes from API_DOMAIN,
# through docker-compose.yaml.
mcp:
  enabled: true
