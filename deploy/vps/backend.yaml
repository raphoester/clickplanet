httpServer:
  bindAddress: 0.0.0.0:8080
  startupTimeout: 1m
  consoleBindAddress: 127.0.0.1:8081
  adminBindAddress: 0.0.0.0:8083
  internalBindAddress: 127.0.0.1:8082

gameMap:
  maxIndex: 262119

database:
  host: postgres
  password: env://POSTGRES_PASSWORD
  port: "5432"
  user: clickplanet
  dbName: clickplanet
  sslMode: disable
  schema: planet
  pool:
    maxOpenConns: 4

redis:
  address: redis:6379
  password: env://REDIS_PASSWORD

tilesStorage:
  flushInterval: 1s

ledger:
  retention: 72h

ledgerStorage:
  flushInterval: 1s
  maxTakes: 4000000

vpnBlocklist:
  enabled: true
  includeDatacenters: true
  allow: []

antiBot:
  enabled: true

  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: antibot
    pool:
      maxOpenConns: 2

  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD

  jury:
    trackWindow: 15m
    sweepInterval: 1m

  evidence:
    saveInterval: 1m
    retention: 72h

  retaker:
    trackWindow: 15m
    sweepInterval: 1m

  sequencer:
    trackWindow: 15m
    sweepInterval: 1m

  metronome:
    stamina:
      slice: 10m
    trackWindow: 15m
    sweepInterval: 1m

  defender:
    trackWindow: 10m
    sweepInterval: 1m

  catcher:
    trackWindow: 1h
    sweepInterval: 1m

  cohort:
    v4Bits: 24
    v6Bits: 44
    trackWindow: 30m
    sweepInterval: 1m

  scraper:
    trackWindow: 15m
    sweepInterval: 1m

  churner:
    relay:
      v4Bits: 24
      v6Bits: 32
    sweepInterval: 1m

  hopper:
    trackWindow: 15m
    sweepInterval: 1m

  rotator:
    slot: 5m
    sweepInterval: 1m

# The game's rules are the rule set postgres keeps (planet.rule_sets), edited on the backoffice.
bonus:
  forgetAfter: 5m

  sweepInterval: 1s

auth:
  enabled: true
  enforce: true
  secret: env://SESSION_SECRET
  ttl: 1h
  rateLimiter:
    perSecond: 0.033
    burst: 10
  turnstile:
    enabled: true
    secret: env://TURNSTILE_SECRET
    # Never add localhost: this is the production widget.
    hostnames:
      - clickplanet.lol
      - www.clickplanet.lol
      - crazygames.clickplanet.lol
    action: session
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: auth
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD
  signIn:
    enabled: true
    redirectUrl: https://clickplanet.lol/auth/callback
  google:
    clientId: 865499711308-guuo7rdvol1ocjeanar1kbo3bulc4pb6.apps.googleusercontent.com
    clientSecret: env://GOOGLE_CLIENT_SECRET
  discord:
    clientId: "1549822806420885616"
    clientSecret: env://DISCORD_CLIENT_SECRET
  # The origin comes from ADMIN_ORIGIN, through docker-compose.yaml.
  admin:
    redirectUrl: https://backoffice.clickplanet.lol/auth/callback
    google:
      clientId: 865499711308-b1uvtdjiikb9perlhb0t9plm44e2bgh4.apps.googleusercontent.com
      clientSecret: env://ADMIN_GOOGLE_CLIENT_SECRET
  email:
    enabled: true
    delivery: cloudflare
    from: noreply@clickplanet.lol
    fromName: ClickPlanet
    cloudflare:
      accountId: 76f6f3883c3a531ae90d1dc4b96bf810
      apiToken: env://CLOUDFLARE_EMAIL_TOKEN
  prune:
    idleFor: 2160h
    interval: 1h

chat:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: chat
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD
  storage:
    historySize: 200
    retention: 720h
  rateLimiter:
    perSecond: 0.33
    burst: 5
  blockedIPs: []

player:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: player
    pool:
      maxOpenConns: 4
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD
  tagSalt: env://CHAT_TAG_SALT

scoring:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: scoring
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD

gamemaster:
  dailyCutoff: 21h
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: gamemaster
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD

missions:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: missions
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD

support:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: support
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD
  retention: 2160h
  rateLimiter:
    perSecond: 0.0167
    burst: 3
  attachments:
    enabled: true
    maxPerNote: 10
    maxBytes: 52428800
    maxStoredBytes: 9663676416
    bucket:
      endpoint: https://76f6f3883c3a531ae90d1dc4b96bf810.r2.cloudflarestorage.com
      region: auto
      name: clickplanet-media
      accessKeyId: 918067992c114dc8f4fcea4aa7ac7921
      secretAccessKey: env://MEDIA_BUCKET_SECRET

# The numbers of the clips the clips job posted: `clips stats` sends a snapshot a day over ssh, the backoffice reads them.
# And who each clip names: `clips fetch` makes a run's cast, `clips schedule` keeps who each post names.
clips:
  database:
    host: postgres
    password: env://POSTGRES_PASSWORD
    port: "5432"
    user: clickplanet
    dbName: clickplanet
    sslMode: disable
    schema: clips
    pool:
      maxOpenConns: 2
  redis:
    address: redis:6379
    password: env://REDIS_PASSWORD
  # The videos the operator posts by hand: the backoffice's Videos page. Same bucket and key as the support files,
  # under clips/videos/.
  videos:
    enabled: true
    maxBytes: 524288000
    bucket:
      endpoint: https://76f6f3883c3a531ae90d1dc4b96bf810.r2.cloudflarestorage.com
      region: auto
      name: clickplanet-media
      accessKeyId: 918067992c114dc8f4fcea4aa7ac7921
      secretAccessKey: env://MEDIA_BUCKET_SECRET
