# Production stack for a single small VPS (DigitalOcean $6 droplet or equivalent).
#
#   docker compose --env-file .env up -d
#
# Caddy terminates TLS (automatic Let's Encrypt certs, issued over DNS-01) and
# reverse-proxies to the Go API. The frontend is NOT served here — it lives on
# Cloudflare Pages. The origin IP stays private: the A record is proxied and
# ufw admits only Cloudflare's ranges on 80/443.
#
# Postgres runs beside the API, reachable only on the compose network. The API
# keeps the tile map in process and writes what changed to postgres every second.
# Chat messages are written there too, one row per message.

services:
  caddy:
    # Caddy with the caddy-dns/cloudflare plugin — the stock image has no DNS
    # provider module and cannot solve the DNS-01 challenge. Built in CI from
    # caddy/Dockerfile and only pulled here: linking it needs more CPU and RAM
    # than a $6 droplet has, and would OOM mid-deploy.
    image: ${CADDY_IMAGE:-ghcr.io/raphoester/clickplanet-caddy:latest}
    container_name: cp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      # The Caddyfile reads this for Access-Control-Allow-Origin. Unset, Caddy
      # substitutes an empty string and every browser call from Pages fails CORS.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in .env}
      # Scoped Cloudflare token (Zone:DNS:Edit + Zone:Zone:Read) Caddy uses to
      # write the ACME TXT record. This is the one real secret on the box.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates — losing this means re-issuing certs
      - caddy_config:/config
      # The JSON access log, rolled and pruned by Caddy itself (14 days; see the
      # Caddyfile). A volume because the container is recreated on every deploy,
      # and on 2026-09-14 that deleted the only record of a bot attack. It holds
      # client IPs, so it is personal data like the chat messages.
      - caddy_logs:/var/log/caddy
    depends_on:
      - backend
    # Caddy writes a ~2 KB access line per request. Unbounded, that filled the
    # disk at ~1 GB a day, so keep 3 × 50 MB and drop the oldest. This is only
    # the live copy for `docker logs`; the caddy_logs volume is the record.
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  postgres:
    # Pinned to a major: a new major cannot read the old one's data directory,
    # so upgrading is a dump and restore, never an image bump.
    image: postgres:16-alpine
    container_name: cp-postgres
    restart: unless-stopped
    # No ports: only the backend reaches it, over the compose network.
    environment:
      POSTGRES_USER: clickplanet
      POSTGRES_DB: clickplanet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
    # Sized for a 1 GB droplet that also holds the tile map in the API's memory.
    command: [ "postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20" ]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U clickplanet -d clickplanet" ]
      interval: 2s
      timeout: 3s
      retries: 15
    logging:
      driver: journald
      options:
        tag: cp-postgres

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/raphoester/clickplanet-backend:latest}
    container_name: cp-backend
    restart: unless-stopped
    expose:
      - "8080"
    # The API migrates and loads the map at boot, and refuses to start without postgres.
    depends_on:
      postgres:
        condition: service_healthy
    # cfgutil loads env vars with "." as the nesting delimiter, so a key like
    # `tilesStorage.flushInterval` can be overridden here without editing
    # backend.yaml.
    environment:
      # Salts the per-sender chat tag. It lives here rather than in backend.yaml
      # because that file is in git: anyone holding the salt can recompute a
      # sender's tag from a guessed address, which is the one thing the tag is
      # supposed to prevent. Changing it renames every sender, so treat it as
      # permanent — bootstrap.sh generates one and never overwrites it.
      chat.service.tagSalt: ${CHAT_TAG_SALT:?set CHAT_TAG_SALT in .env (openssl rand -hex 16)}
      # Signs the session tokens that gate the Click RPC. Here rather than in
      # backend.yaml for the same reason as the salt: that file is in git, and
      # anyone holding this can mint a token the API will accept. Changing it
      # invalidates every session in flight, which costs each player one extra
      # round trip and nothing else.
      # Hard, like the two above, because backend.yaml has session.enabled true
      # and the API now refuses to start without it: the mint and the click
      # check each derive a signer from this string, so one the server invented
      # would differ between them. The box this runs on already needs
      # TURNSTILE_SECRET to start, so it has been set up either way.
      session.secret: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
      # The Turnstile widget's secret key, from the same dashboard page as the
      # sitekey. The sitekey is public and lives in the frontend build; this one
      # never leaves the box.
      # Also soft, and unused while session.turnstile.enabled is false. Once it
      # is true, an empty value fails the boot loudly rather than quietly
      # admitting everyone.
      session.turnstile.secret: ${TURNSTILE_SECRET:-}
      # Hard like the session secret: the API cannot start without postgres.
      database.password: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      # The chat module has its own database block: same postgres, same user, same password.
      chat.database.password: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
    volumes:
      - ./backend.yaml:/home/app/config/config.yaml:ro
      # The ledger, bans and antibot evidence still live here. The old chat log is imported into postgres on
      # the first boot and left beside them as chat.log.imported.
      - tile_state:/home/app/state
    command: [ "./api", "-config", "/home/app/config/config.yaml" ]
    # journald, not the default json-file. json-file is stored per container id,
    # and a deploy pulls a new image and *recreates* the container — so every
    # "antibot ban" line written since the last deploy is deleted along
    # with the old container. journald keeps them on the host instead:
    #
    #   journalctl CONTAINER_NAME=cp-backend --since '2 days ago' | grep "antibot ban"
    #
    # `docker compose logs backend` still works and still shows only the current
    # container, which is usually what you want; journalctl is how you read
    # across a deploy. Needs a persistent journal — check `journalctl
    # --disk-usage`, and if /var/log/journal is missing this buys nothing.
    logging:
      driver: journald
      options:
        tag: cp-backend

  # Scrapes /metrics on a timer and appends it to a volume, because the API's
  # metrics live in its process and a deploy resets every counter and histogram
  # to zero. Not a Prometheus: a real one is 80-150 MB resident next to a 1 GB
  # droplet already holding the tile map, and what this is for is reading two
  # samples a day apart and subtracting them.
  #
  # Counters only ever go up within one container's life, so a block whose
  # values are *lower* than the block above it is where a deploy happened —
  # compare within a run, not across one.
  metrics-poller:
    image: alpine:3
    container_name: cp-metrics-poller
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - metrics_history:/history
    environment:
      # Seconds between scrapes, and days of files to keep. A sample every five
      # minutes is 288 blocks a day, a few hundred KB — the counters are
      # cumulative, so resolution only decides how precisely you can place a
      # change in time, never what you can total.
      POLL_INTERVAL: ${POLL_INTERVAL:-300}
      POLL_RETENTION_DAYS: ${POLL_RETENTION_DAYS:-14}
    # No shell file to mount: the whole job is a loop, and keeping it here means
    # it cannot drift from the compose file that runs it.
    command:
      - sh
      - -c
      - |
        set -eu
        interval=$${POLL_INTERVAL:-300}
        retention=$${POLL_RETENTION_DAYS:-14}
        echo "polling backend:8080/metrics every $${interval}s, keeping $${retention} days"
        while true; do
          stamp=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          file=/history/metrics-$$(date -u +%Y-%m-%d).prom
          if wget -qO- --timeout=10 http://backend:8080/metrics > /tmp/scrape; then
            # `|| true` is load-bearing under `set -e`: grep exits 1 when it
            # matches nothing, which happens the moment a series is switched off
            # (antiBot.enabled false, say), and that would kill the loop into a
            # restart cycle rather than record an honest empty sample.
            # The series are still named shadowban_* though the block that
            # turns them on is now antiBot: the metric names outlived the
            # rename on purpose, so an existing history file stays comparable.
            { echo "# $$stamp"
              grep -E '^(click_reaction_seconds|click_retake_share|shadowban|antibot_opinions|blocked_clicks|click_session_checks)' /tmp/scrape || true
              echo
            } >> "$$file"
          else
            echo "# $$stamp scrape failed" >> "$$file"
          fi
          find /history -name 'metrics-*.prom' -mtime +$$retention -delete 2>/dev/null || true
          sleep "$$interval"
        done
    logging:
      driver: journald
      options:
        tag: cp-metrics-poller

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  pg_data:
  tile_state:
  metrics_history:
