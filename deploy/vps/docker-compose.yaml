services:
  caddy:
    image: ${CADDY_IMAGE:-ghcr.io/raphoester/clickplanet-caddy:latest}
    container_name: cp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env.caddy
    volumes:
      # The directory, not the file: a file bind mount keeps the old inode after git pull.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  postgres:
    # Pinned major: a new major cannot read this data directory; upgrade by dump and restore.
    image: postgres:16-alpine
    container_name: cp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clickplanet
      POSTGRES_DB: clickplanet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
    command: [ "postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20" ]
    ports:
      # Loopback only: a published port skips ufw, so "5432:5432" would put postgres on the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U clickplanet -d clickplanet" ]
      interval: 2s
      timeout: 3s
      retries: 15
    logging:
      driver: journald
      options:
        tag: cp-postgres

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/raphoester/clickplanet-backend:latest}
    container_name: cp-backend
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.backend
    environment:
      httpServer.allowedOrigin: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in env.public}
    volumes:
      - ./backend.yaml:/home/app/config/config.yaml:ro
    command: [ "./api", "-config", "/home/app/config/config.yaml" ]
    logging:
      driver: journald
      options:
        tag: cp-backend

  metrics-poller:
    image: alpine:3
    container_name: cp-metrics-poller
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - metrics_history:/history
    environment:
      POLL_INTERVAL: ${POLL_INTERVAL:-300}
      POLL_RETENTION_DAYS: ${POLL_RETENTION_DAYS:-14}
    command:
      - sh
      - -c
      - |
        set -eu
        interval=$${POLL_INTERVAL:-300}
        retention=$${POLL_RETENTION_DAYS:-14}
        echo "polling backend:8080/metrics every $${interval}s, keeping $${retention} days"
        while true; do
          stamp=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          file=/history/metrics-$$(date -u +%Y-%m-%d).prom
          if wget -qO- --timeout=10 http://backend:8080/metrics > /tmp/scrape; then
            # Keep || true: grep exits 1 on no match, and set -e would kill the loop.
            { echo "# $$stamp"
              grep -E '^(click_reaction_seconds|click_retake_share|click_busy_hours|shadowban|antibot_opinions|blocked_clicks|click_session_checks)' /tmp/scrape || true
              echo
            } >> "$$file"
          else
            echo "# $$stamp scrape failed" >> "$$file"
          fi
          find /history -name 'metrics-*.prom' -mtime +$$retention -delete 2>/dev/null || true
          sleep "$$interval"
        done
    logging:
      driver: journald
      options:
        tag: cp-metrics-poller

  ops-role:
    image: postgres:16-alpine
    container_name: cp-ops-role
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      # Not required: a deploy of the game must not fail on a secret only ops reads.
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:-}
    volumes:
      # The directory, not the file: a file bind mount keeps the old inode after git pull.
      - ./ops/postgres:/ops:ro
    command:
      - sh
      - -c
      - |
        set -eu
        [ -n "$$OPS_DB_PASSWORD" ] || { echo "OPS_DB_PASSWORD is unset: ops_reader is left as it was"; exit 1; }
        exec psql -h postgres -U clickplanet -d clickplanet -v ON_ERROR_STOP=1 -v password="$$OPS_DB_PASSWORD" -f /ops/role.sql
    logging:
      driver: journald
      options:
        tag: cp-ops-role

  ops:
    image: ${OPS_IMAGE:-ghcr.io/raphoester/clickplanet-ops:latest}
    container_name: cp-ops
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      - postgres
    environment:
      OPS_DATABASE_URL: postgres://ops_reader:${OPS_DB_PASSWORD:-}@postgres:5432/clickplanet?sslmode=disable
      OPS_ACCESS_ISSUER: ${OPS_ACCESS_ISSUER:-}
      OPS_ACCESS_AUDIENCE: ${OPS_ACCESS_AUDIENCE:-}
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - caddy_logs:/var/log/caddy:ro
    # Root owns the journal and Caddy's files, so ops runs as root with nothing else root has.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A wide query must cost this container, not the API beside it on 1 GB.
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: journald
      options:
        tag: cp-ops

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  pg_data:
  metrics_history:
