# Production stack for a single small VPS (DigitalOcean $6 droplet or equivalent).
#
#   docker compose --env-file .env up -d
#
# Caddy terminates TLS (automatic Let's Encrypt certs, issued over DNS-01) and
# reverse-proxies to the Go API. The frontend is NOT served here — it lives on
# Cloudflare Pages. The origin IP stays private: the A record is proxied and
# ufw admits only Cloudflare's ranges on 80/443.
#
# There is no database. The API keeps the tile map in process and snapshots it
# to the tile_state volume.

services:
  caddy:
    # Caddy with the caddy-dns/cloudflare plugin — the stock image has no DNS
    # provider module and cannot solve the DNS-01 challenge. Built in CI from
    # caddy/Dockerfile and only pulled here: linking it needs more CPU and RAM
    # than a $6 droplet has, and would OOM mid-deploy.
    image: ${CADDY_IMAGE:-ghcr.io/raphoester/clickplanet-caddy:latest}
    container_name: cp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # The whole file, rather than a line per value: Caddy reads API_DOMAIN,
    # FRONTEND_ORIGIN (Access-Control-Allow-Origin) and CLOUDFLARE_API_TOKEN
    # (the scoped Zone:DNS:Edit token it writes the ACME TXT record with) under
    # exactly the names .env already gives them, so naming each one here only
    # said it twice.
    #
    # What that drops is the ${VAR:?} guard. It was worth having while .env was
    # hand-edited; it is not now — render-env.sh writes the file, the first two
    # come from env.public which is tracked in git, and the third cannot go
    # missing without the render failing first.
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates — losing this means re-issuing certs
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/raphoester/clickplanet-backend:latest}
    container_name: cp-backend
    restart: unless-stopped
    expose:
      - "8080"
    # The API's secrets, and only the API's — Caddy loads .env and never sees
    # these. Its keys are already config keys (`chat.service.tagSalt`, not
    # CHAT_TAG_SALT): render-env.sh does the rename on the way in, because
    # cpconfigs nests on "." and a GitHub secret name cannot contain one.
    # deploy/vps/backend.env.map is where that mapping is written down, and it
    # is the only place in the repository any of these names appears.
    #
    # They are not in backend.yaml because that file is in git. The salt lets a
    # holder recompute a sender's tag from a guessed address, which is the one
    # thing the tag prevents; the session secret lets a holder mint a token the
    # API accepts.
    env_file: .env.backend
    volumes:
      - ./backend.yaml:/home/app/config/config.yaml:ro
      - tile_state:/home/app/state   # snapshot file lives here — back this up
    command: [ "./api", "-config", "/home/app/config/config.yaml" ]
    # journald, not the default json-file. json-file is stored per container id,
    # and a deploy pulls a new image and *recreates* the container — so every
    # "antibot ban" line written since the last deploy is deleted along
    # with the old container. journald keeps them on the host instead:
    #
    #   journalctl CONTAINER_NAME=cp-backend --since '2 days ago' | grep "antibot ban"
    #
    # `docker compose logs backend` still works and still shows only the current
    # container, which is usually what you want; journalctl is how you read
    # across a deploy. Needs a persistent journal — check `journalctl
    # --disk-usage`, and if /var/log/journal is missing this buys nothing.
    logging:
      driver: journald
      options:
        tag: cp-backend

  # Scrapes /metrics on a timer and appends it to a volume, because the API's
  # metrics live in its process and a deploy resets every counter and histogram
  # to zero. Not a Prometheus: a real one is 80-150 MB resident next to a 1 GB
  # droplet already holding the tile map, and what this is for is reading two
  # samples a day apart and subtracting them.
  #
  # Counters only ever go up within one container's life, so a block whose
  # values are *lower* than the block above it is where a deploy happened —
  # compare within a run, not across one.
  metrics-poller:
    image: alpine:3
    container_name: cp-metrics-poller
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - metrics_history:/history
    environment:
      # Seconds between scrapes, and days of files to keep. A sample every five
      # minutes is 288 blocks a day, a few hundred KB — the counters are
      # cumulative, so resolution only decides how precisely you can place a
      # change in time, never what you can total.
      POLL_INTERVAL: ${POLL_INTERVAL:-300}
      POLL_RETENTION_DAYS: ${POLL_RETENTION_DAYS:-14}
    # No shell file to mount: the whole job is a loop, and keeping it here means
    # it cannot drift from the compose file that runs it.
    command:
      - sh
      - -c
      - |
        set -eu
        interval=$${POLL_INTERVAL:-300}
        retention=$${POLL_RETENTION_DAYS:-14}
        echo "polling backend:8080/metrics every $${interval}s, keeping $${retention} days"
        while true; do
          stamp=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          file=/history/metrics-$$(date -u +%Y-%m-%d).prom
          if wget -qO- --timeout=10 http://backend:8080/metrics > /tmp/scrape; then
            # `|| true` is load-bearing under `set -e`: grep exits 1 when it
            # matches nothing, which happens the moment a series is switched off
            # (antiBot.enabled false, say), and that would kill the loop into a
            # restart cycle rather than record an honest empty sample.
            # The series are still named shadowban_* though the block that
            # turns them on is now antiBot: the metric names outlived the
            # rename on purpose, so an existing history file stays comparable.
            { echo "# $$stamp"
              grep -E '^(click_reaction_seconds|shadowban|blocked_clicks|click_session_checks)' /tmp/scrape || true
              echo
            } >> "$$file"
          else
            echo "# $$stamp scrape failed" >> "$$file"
          fi
          find /history -name 'metrics-*.prom' -mtime +$$retention -delete 2>/dev/null || true
          sleep "$$interval"
        done
    logging:
      driver: journald
      options:
        tag: cp-metrics-poller

volumes:
  caddy_data:
  caddy_config:
  tile_state:
  metrics_history:
