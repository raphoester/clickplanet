# Local full stack: frontend, backend and postgres. The backend keeps the tile
# map in process and writes what changed to postgres.
#
#   cd apps/frontend && npm run dBuild
#   cd apps/backend  && make dBuild
#   cd deploy        && docker compose up

services:
  frontend:
    container_name: cp-frontend
    image: clickplanet-front:local
    ports:
      - "80:80"

  postgres:
    image: postgres:16-alpine
    container_name: cp-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    image: clickplanet-back:local
    container_name: cp-backend
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./backend.yaml
        target: /home/app/config/config.yaml
    command: [ "./api", "-config", "/home/app/config/config.yaml" ]

volumes:
  pg_data:
