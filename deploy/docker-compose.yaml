services:
  frontend:
    container_name: cp-frontend
    image: clickplanet-front:local
    ports:
      - "80:80"

  postgres:
    image: postgres:16-alpine
    container_name: cp-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    container_name: cp-redis
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    image: clickplanet-back:local
    container_name: cp-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./backend.yaml
        target: /home/app/config/config.yaml
    command: [ "./api", "-config", "/home/app/config/config.yaml" ]

volumes:
  pg_data:
  redis_data:
