# Local full stack: frontend, backend and postgres. The backend keeps the tile
# map in process and writes what changed to postgres.
#
#   cd apps/frontend && npm run dBuild
#   cd apps/backend  && make dBuild
#   cd deploy        && docker compose up

services:
  frontend:
    container_name: cp-frontend
    image: clickplanet-front:local
    ports:
      - "80:80"

  postgres:
    image: postgres:16-alpine
    container_name: cp-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    image: clickplanet-back:local
    container_name: cp-backend
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./backend.yaml
        target: /home/app/config/config.yaml
      # The ledger, bans and antibot evidence live here, so they survive a container restart.
      # The image creates /home/app/state owned by the app user, which is what
      # makes a fresh named volume writable — a bind mount from the host needs
      # to be chowned to uid 1000 instead.
      - tile_state:/home/app/state
    command: [ "./api", "-config", "/home/app/config/config.yaml" ]

volumes:
  pg_data:
  tile_state:
