httpServer:
  bindAddress: 0.0.0.0:8080
  format: binary
gameMap:
  maxIndex: 1004892

tilesStorage:
  driver: memory
  memory:
    # Backed by the tile_state volume in docker-compose.yaml.
    snapshotPath: /home/app/state/tiles.snapshot
    snapshotInterval: 30s

# --- Rollback to Redis ---------------------------------------------------
# Set driver: redis above, start the redis profile, load the Lua script once
#   docker exec -i cp-redis sh -c "redis-cli -x script load < /static/setAndPublishOnStream.lua"
# and paste the sha1 it prints here:
#
#   tilesStorage:
#     driver: redis
#     redis:
#       setAndPublishOnStreamSha1: "5c24cb40524c6de242838e109f998b147397ea54"
#
#   redis:
#     address: cp-redis:6379
#     username: default
#     password: secret
#     db: 0
#     tls: false
