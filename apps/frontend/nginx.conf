# Serves the built SPA. Mirrors what Cloudflare Pages does in production from
# public/_redirects and public/_headers, so the local full stack behaves like
# the deployed site rather than subtly differently.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The coordinates blob is content-addressed too, so it can outlive the
    # week-long /static/ cache below.
    location ~ ^/static/coordinates-.*\.bin$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Textures, flags and the sprite atlas change only when regenerated.
    location /static/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # The sign-in callback is the game too, with the referrer policy
    # public/_headers gives it. The build writes it as auth/callback.html.
    location ~ ^/auth/callback/?$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Referrer-Policy "no-referrer";
        try_files /auth/callback.html =404;
    }

    # `$uri.html` serves play.html at /play and public/privacy.html at /privacy,
    # as the Workers asset handler does. Anything else falls back to the home
    # page, index.html, like `not_found_handling` does.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
