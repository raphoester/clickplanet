version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: "github.com/raphoester/clickplanet.lol-backend/generated/proto"
inputs:
  - directory: ../../../proto
plugins:
  - local: protoc-gen-go
    out: ../generated/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../generated/proto
    opt: paths=source_relative