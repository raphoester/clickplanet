version: "2"

issues:
  # Report everything: the defaults truncate to 3 of a kind and 50 per linter,
  # which hides the size of a finding while it is being worked through.
  max-same-issues: 0
  max-issues-per-linter: 0

run:
  # Shared test helpers live in ordinary .go files behind this tag, so without it
  # the linters load a tree where those helpers are undefined and report that
  # instead of anything real. Same reason `go vet` needs it.
  build-tags:
    - testing

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - wrapcheck
    - nilnil

    # The logger is log/slog directly, so its call sites are worth checking.
    - sloglint

    # Style
    - revive

    # Error handling - errors.Is/As
    - errorlint

    # Slice allocation - requires make([]T, 0, cap) + append
    - prealloc

    # Testing quality
    - testifylint
    - usetesting

    # Security
    - gosec

    # Code quality
    - unconvert
    - gocritic
    - noctx

  settings:
    unused:
      exported-fields-are-used: false

    revive:
      rules:
        - name: error-return # error should be last return value
        - name: error-naming # error vars should start with Err
        - name: error-strings # error strings: not capitalized, no trailing punctuation
        - name: if-return # simplify redundant if-return patterns
        - name: increment-decrement # use i++ instead of i += 1
        - name: var-naming # Go naming conventions
        - name: receiver-naming # consistent receiver names across methods
        - name: unexported-return # warn on unexported types in exported signatures
        - name: unused-parameter # flag unused function parameters
        - name: range # proper range loop usage
        - name: time-naming # duration fields should not be suffixed with units
        - name: early-return # prefer early returns to reduce nesting

    errorlint:
      errorf: true # check fmt.Errorf wrapping uses %w
      errorf-multi: true # check multi-error wrapping
      asserts: true # check type assertions on errors
      comparison: true # check == comparisons against error values

    wrapcheck:
      extra-ignore-sigs:
        - .Close(
        - .Validate(
        - json.Unmarshal(
        - json.Marshal(

        # Handlers return their domain errors bare on purpose: NewErrorInterceptor
        # maps the sentinels onto Connect codes centrally, and wrapping here would
        # put a second sentence in front of a message it already chose.
        - .HandleClick(
        - .Post(
        - .Create(

        # Pure delegations — an adapter method whose whole body is the call, or a
        # tail call whose callee already names what failed.
        - .Verify(
        - .Mint(
        - .StateBatchDense(
        - .Mount(
        - .Send(
        - cpbootstrap.Run(

        # Generated Connect clients, called from tests.
        - .Click(
        - .SendMessage(
        - .ListenForEvents(
        - .CreateSession(

    usetesting:
      os-setenv: true
      os-temp-dir: true
      context-background: true

    testifylint:
      require-error:
        # do not check ErrorIs or NotErrorIs, which are for checking error wrapping
        fn-pattern: ^(Error|Errorf|NoError|NoErrorf)$

    sloglint:
      # Attributes only: logger.Info("msg", slog.String(...)), never loose k/v pairs.
      attr-only: true

    staticcheck:
      checks: [
          "all",
          "-ST1000",
          "-ST1003",
          "-ST1016",
          "-SA1019",
          "-ST1020",
          "-ST1021",
          "-ST1022",
          "-S1016", # struct conversion vs literal: structs with different reasons to change shouldn't be forced into a type conversion just because their fields happen to match
        ]

    gocritic:
      settings:
        rangeValCopy:
          sizeThreshold: 512
      enabled-checks:
        - boolExprSimplify
        - deferInLoop
        - emptyStringTest
        - rangeValCopy
        - stringXbytes

    gosec:
      excludes:
        - G115 # integer overflow conversion — tile ids are uint32 by contract and bounded by maxIndex

  exclusions:
    generated: lax
    paths:
      - generated/

formatters:
  exclusions:
    generated: lax
