version: "2"

issues:
  max-same-issues: 0
  max-issues-per-linter: 0

run:
  build-tags:
    - testing

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - wrapcheck
    - nilnil

    - sloglint

    - revive

    - errorlint

    - prealloc

    - testifylint
    - usetesting

    - gosec

    - unconvert
    - gocritic
    - noctx

  settings:
    unused:
      exported-fields-are-used: false

    revive:
      rules:
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: receiver-naming
        - name: unexported-return
        - name: unused-parameter
        - name: range
        - name: time-naming
        - name: early-return

    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true

    wrapcheck:
      extra-ignore-sigs:
        - .Close(
        - .Validate(
        - json.Unmarshal(
        - json.Marshal(

        - .Execute(
        - .Post(
        - .Create(

        - .Verify(
        - .Mint(
        - .StateBatchDense(
        - .Mount(
        - evidence.Encode(
        - evidence.Decode(
        - .Send(
        - cpbootstrap.Run(

        - .Click(
        - .GetMap(
        - .SendMessage(
        - .ListenForEvents(
        - .CreateSession(

    usetesting:
      os-setenv: true
      os-temp-dir: true
      context-background: true

    testifylint:
      require-error:
        fn-pattern: ^(Error|Errorf|NoError|NoErrorf)$

    sloglint:
      attr-only: true

    staticcheck:
      checks: [
          "all",
          "-ST1000",
          "-ST1003",
          "-ST1016",
          "-SA1019",
          "-ST1020",
          "-ST1021",
          "-ST1022",
          "-S1016",
        ]

    gocritic:
      settings:
        rangeValCopy:
          sizeThreshold: 512
        ruleguard:
          rules: ${base-path}/tools/ruleguard/*.go
          failOn: all
      enabled-checks:
        - boolExprSimplify
        - deferInLoop
        - ruleguard
        - emptyStringTest
        - rangeValCopy
        - stringXbytes

    gosec:
      excludes:
        - G115

  exclusions:
    generated: lax
    paths:
      - generated/

formatters:
  enable:
    - gofumpt

  exclusions:
    generated: lax
