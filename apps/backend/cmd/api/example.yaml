httpServer:
  bindAddress: 0.0.0.0:8080
gameMap:
  maxIndex: 257948

# The whole tile map lives in this process and is snapshotted to a local file.
# There is no database and no second service to run.
tilesStorage:
  # Where the tile state is persisted. Leave empty to disable durability
  # entirely (state is then lost on restart).
  snapshotPath: ./data/tiles.snapshot
  # How often a modified state is flushed to disk.
  snapshotInterval: 30s
  # Per-websocket-subscriber channel capacity. Updates for a subscriber that
  # cannot keep up are dropped rather than blocking clicks.
  subscriberBuffer: 1024
  # How many recent updates are kept around for the bookkeeper to read, and for
  # how long. Both bounds should sit comfortably above bookkeeper.runner.interval.
  pastUpdatesBuffer: 65536
  pastUpdatesRetention: 24h

# Reports recent activity to X. Used to be the separate cmd/bookkeeper process;
# the recent updates only exist inside this process, so it runs here instead.
# Off by default.
bookkeeper:
  enabled: false
  runner:
    interval: 1h

# Per-IP throttle on the Click RPC. Reads and the websocket are untouched.
# The defaults below are also what applies when this block is absent.
rateLimiter:
  # Sustained clicks per second allowed from one address.
  perSecond: 1
  # Clicks a caller arriving after a quiet spell may spend at once, so that a
  # normal flurry is not refused.
  burst: 10
  # How often the buckets that have refilled completely are forgotten. Only
  # affects memory, never what a caller is allowed.
  sweepInterval: 1m

# Refuses the Click RPC from known VPN and proxy egress ranges, so a player has
# to come from an address the throttle above can actually hold onto: a bucket
# keyed on an address you can change at will is a bucket that does not hold.
# Reads and the websocket are untouched — a VPN user still loads and watches the
# planet, they just cannot paint.
#
# The ranges are vendored from github.com/X4BNet/lists_vpn and embedded in the
# binary. Refresh them with `make vpn-lists`.
vpnBlocklist:
  # Off parses nothing and allocates nothing.
  enabled: true
  # Also refuse datacenter and hosting ranges, which catches a self-hosted
  # WireGuard on a VPS. It also refuses Apple iCloud Private Relay and
  # Cloudflare WARP, which egress from those same ranges and are on by default
  # for a lot of ordinary mobile traffic. Watch blocked_clicks{list="vpn"}
  # against clicks for a sense of the scale before turning this on.
  includeDatacenters: false
  # Never refused, whatever the lists say. Prefixes, so /32 for a single
  # address. Put your own address here.
  allow: []
