httpServer:
  bindAddress: 0.0.0.0:8080
gameMap:
  maxIndex: 257948

# The whole tile map lives in this process and is snapshotted to a local file.
# There is no database and no second service to run.
tilesStorage:
  # Where the tile state is persisted. Leave empty to disable durability
  # entirely (state is then lost on restart).
  snapshotPath: ./data/tiles.snapshot
  # How often a modified state is flushed to disk.
  snapshotInterval: 30s
  # Per-websocket-subscriber channel capacity. Updates for a subscriber that
  # cannot keep up are dropped rather than blocking clicks.
  subscriberBuffer: 1024
  # How many recent updates are kept around for the bookkeeper to read, and for
  # how long. Both bounds should sit comfortably above bookkeeper.runner.interval.
  pastUpdatesBuffer: 65536
  pastUpdatesRetention: 24h

# Reports recent activity to X. Used to be the separate cmd/bookkeeper process;
# the recent updates only exist inside this process, so it runs here instead.
# Off by default.
bookkeeper:
  enabled: false
  runner:
    interval: 1h

# Per-IP throttle on the Click RPC. Reads and the websocket are untouched.
# The defaults below are also what applies when this block is absent.
rateLimiter:
  # Sustained clicks per second allowed from one caller — one address over
  # IPv4, one /64 over IPv6, since a v6 subscriber owns its whole prefix.
  perSecond: 1
  # Clicks a caller arriving after a quiet spell may spend at once, so that a
  # normal flurry is not refused.
  burst: 10
  # How often the buckets that have refilled completely are forgotten. Only
  # affects memory, never what a caller is allowed.
  sweepInterval: 1m

# Refuses the Click RPC from known VPN and proxy egress ranges, so a player has
# to come from an address the throttle above can actually hold onto: a bucket
# keyed on something you can change at will is a bucket that does not hold.
# Reads and the websocket are untouched — a VPN user still loads and watches the
# planet, they just cannot paint.
#
# The ranges are vendored from github.com/X4BNet/lists_vpn and embedded in the
# binary. Refresh them with `make vpn-lists`.
vpnBlocklist:
  # Off parses nothing and allocates nothing.
  enabled: true
  # Also refuse datacenter and hosting ranges, which catches a self-hosted
  # WireGuard on a VPS. It also refuses Apple iCloud Private Relay and
  # Cloudflare WARP, which egress from those same ranges and are on by default
  # for a lot of ordinary mobile traffic. Watch blocked_clicks{list="vpn"}
  # against clicks for a sense of the scale before turning this on.
  includeDatacenters: false
  # Never refused, whatever the lists say. Prefixes, so /32 for a single
  # address. Put your own address here.
  allow: []

# Accepts a bot's clicks and drops them, instead of refusing them and telling it
# which check to route around. What it looks for is not speed — a player in a
# tile war is fast too — but regularity: a caller driven by the update stream
# answers in a band no hand holds.
shadowBan:
  # Off registers nothing and measures nothing.
  enabled: true
  detector:
    # Off measures, flags, logs and counts without dropping anything. Ship in
    # this mode: watch click_reaction_seconds for where the bot band actually
    # sits, check the "shadowban candidate" log lines are not naming you, then
    # set the bounds below from what you saw and turn this on.
    enforce: false
    # How soon after losing a tile a re-take counts as a reaction at all.
    # Anything slower is somebody who happened to click the same tile later.
    # Keep this well above the delays you expect to measure: a reaction past the
    # edge is not missed, it is censored, and the median of what is left reads
    # faster than the caller really is.
    reactionWindow: 5s
    # Reactions needed inside trackWindow before anything is decided. The bound
    # that stops one unlucky exchange from being evidence.
    minReactions: 12
    # Both must hold. maxMedian alone flags a fast human; it is maxSpread, the
    # p90-p10 of the reactions, that no hand produces.
    #
    # These two are the only values here that cannot be defaulted sensibly —
    # they depend on the bot you actually have. 250ms suits one answering off
    # the update stream; one on a ~1s timer sails past it. To find yours, open
    # them right up (maxMedian 2s, maxSpread 1s) while enforce is false: nothing
    # is dropped, candidate lines start printing, and each one carries that
    # caller's real median and spread. Set these from those numbers.
    maxMedian: 250ms
    maxSpread: 120ms
    # How far back reactions count, and how long a flag lasts once the
    # behaviour stops.
    trackWindow: 5m
    banDuration: 1h
    # How soon a caller already flagged can be flagged again. At trackWindow or
    # above, each flag rests on a fresh set of reactions, so flags=6 in the log
    # means six independent windows all read the same way — worth far more than
    # one verdict from one window. Without this a caller goes quiet behind its
    # first ban and you cannot tell whether it kept going.
    reflagInterval: 5m
    sweepInterval: 1m

# Gates the Click RPC on a token this server minted. Off by default: with it
# disabled session.v1.SessionService/ 404s and clicks are judged on address
# alone, exactly as they were before this existed.
session:
  enabled: false
  # Off counts what enforcing would refuse without refusing it — the mode to
  # deploy in, so a client that predates sessions keeps working while
  # click_session_checks shows what turning it on would cost.
  enforce: false
  # Signs the tokens. Empty generates one at boot, which invalidates every
  # session in flight on each restart: fine locally, not in production, where it
  # belongs in the environment rather than in a file that is in git.
  secret: ""
  ttl: 1h
  # Per-IP throttle on minting, separate from the click one: a mint costs a
  # siteverify round trip, a click costs a map write.
  rateLimiter:
    perSecond: 0.033
    burst: 10
    sweepInterval: 1m
  turnstile:
    # Off mints a session for anyone who asks, which is how a local backend
    # works without a widget and a secret. The click path is still exercised —
    # the token is bound and expires — but nothing had to be proved to get one.
    # Never the production choice.
    enabled: false
    secret: ""
    # The frontend origins siteverify must report. Empty refuses every token
    # rather than accepting any, so this cannot be left unset by accident.
    hostnames: []
    # Must match the widget's data-action.
    action: session

# Live chat. Its own bounded context and its own Connect service, sharing this
# process and the transport with the tile game and nothing else. Off by
# default: when disabled nothing is registered, so /chat.v1.ChatService/ and
# /ws/chat both 404 rather than erroring.
chat:
  enabled: true
  storage:
    # Append-only JSONL log of every message, sender IP included. Leave empty
    # to keep chat entirely in memory.
    logPath: ./data/chat.log
    # How many recent messages a joining client is served by GetHistory.
    historySize: 200
    # Messages older than this are dropped on the next prune. This is personal
    # data (IP + text), so the window is a retention policy, not a cache size.
    retention: 720h # 30 days
    # Upper bound on what a hard kill can lose, as with the tile snapshot.
    flushInterval: 5s
    pruneInterval: 1h
    # Per-websocket-subscriber channel capacity. Messages for a subscriber that
    # cannot keep up are dropped rather than blocking senders.
    subscriberBuffer: 256
  service:
    maxTextLength: 280
    maxNameLength: 24
    # Salts the per-sender tag so it cannot be reversed into an IP. Generated
    # randomly at boot when empty, which makes tags change on every restart.
    tagSalt: ""
  # Per-IP throttle on SendMessage. Separate from the click limiter above: a
  # message fans out to every client and lands in a log, so it costs far more
  # than a click. One message every three seconds, five in hand.
  rateLimiter:
    perSecond: 0.33
    burst: 5
    sweepInterval: 1m
  # Refused every chat RPC outright. The way to cut off an abusive sender
  # without a rebuild. Same prefix set as vpnBlocklist above, so these are
  # CIDRs — a single address needs /32, and a whole range is one line. A
  # malformed entry fails the start rather than silently refusing nobody.
  blockedIPs: []
