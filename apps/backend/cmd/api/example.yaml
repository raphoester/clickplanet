httpServer:
  bindAddress: 0.0.0.0:8080
  # Must stay well under Cloudflare's ~125s idle cut, which answers 524.
  streamHeartbeat: 30s
  startupTimeout: 1m
  adminBindAddress: 127.0.0.1:8081
  internalBindAddress: 127.0.0.1:8082
  allowedOrigin: http://localhost:5173
gameMap:
  maxIndex: 262119

database:
  host: localhost
  port: "5432"
  user: postgres
  password: postgres
  dbName: postgres
  sslMode: disable
  schema: planet
  pool:
    maxOpenConns: 4

tilesStorage:
  flushInterval: 1s
  subscriberBuffer: 1024

ledger:
  retention: 72h
  sweepInterval: 5m

chargeStorage:
  flushInterval: 1s

ledgerStorage:
  flushInterval: 1s
  maxTakes: 4000000

rateLimiter:
  perSecond: 0.2
  burst: 60
  scopeMultiplier: 10
  guestScopeMultiplier: 1
  linkedMultiplier: 2
  newAccountClicks: 10
  sweepInterval: 1m

toll:
  steps:
    - {share: 0.10, slowdown: 1.5}
    - {share: 0.20, slowdown: 2.5}
    - {share: 0.30, slowdown: 4}

vpnBlocklist:
  enabled: true
  includeDatacenters: false
  allow: []

bonus:
  minInterval: 4m
  maxInterval: 8m

  missRetry: 2m

  kinds:
    refill: 5
    spread_clicks: 3
    enclose_clicks: 2
    bomb: 1
    shields: 3

  # Must outlast the box's flight on the client, or a late catch is refused.
  offerTTL: 15s

  spread:
    clicks: 8
    maxPerBox: 4

  bomb:
    rings: 4

  enclose:
    maxTiles: 25
    held: 3
    maxPerBox: 3

  shield:
    held: 30
    minPerBox: 5
    maxPerBox: 20
    perTile: 10

  activeWithin: 2m

  forgetAfter: 5m

  maxChargesPerHour: 12

  sweepInterval: 1s

  quiz:
    enabled: true

    minInterval: 4m
    maxInterval: 8m

    missRetry: 2m

    offerTTL: 25s

    answerWindow: 8s

    leaderBias: 1

    maxChargesPerHour: 12

antiBot:
  enabled: true

  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: antibot
    pool:
      maxOpenConns: 2

  shadowBan:
    enforce: false
    banDurations: [24h, 168h, 26280h]
    reflagInterval: 5m

  jury:
    minSuspects: 2
    suspicionWindow: 10m
    trackWindow: 15m
    sweepInterval: 1m

  evidence:
    saveInterval: 1m
    retention: 72h

  retaker:
    enabled: true
    detector:
      reactionWindow: 5s
      minReactions: 12
      maxSpread: 120ms
      maxMedian: 250ms
      minTiles: 15
      roamMedian: 600ms
      certainTiles: 30
      trackWindow: 5m
      sweepInterval: 1m

  sequencer:
    enabled: true
    detector:
      minSteps: 40
      minShare: 0.75
      certainSteps: 200
      certainShare: 0.95
      trackWindow: 15m
      sweepInterval: 1m

  metronome:
    enabled: true
    detector:
      maxGap: 3s
      maxSpread: 120ms
      minClicks: 120
      certainFor: 30m
      certainClicks: 900
      shape:
        maxGap: 10s
        clicks: 500
        certainClicks: 1000
      stamina:
        slice: 10m
        clicks: 40
        window: 6h
        minBusy: 5h30m
      trackWindow: 15m
      sweepInterval: 1m

  defender:
    enabled: true
    detector:
      retakeWindow: 2m
      minClicks: 60
      certainClicks: 200
      trackWindow: 5m
      sweepInterval: 1m

  catcher:
    enabled: true
    detector:
      minCatches: 5
      maxMedian: 3s
      certainMedian: 1500ms
      trackWindow: 1h
      sweepInterval: 1m

  cohort:
    enabled: true
    detector:
      startWindow: 5s
      minClicks: 20
      minFlagShare: 0.9
      rateRatio: 1.5
      lengthRatio: 1.2
      quietAfter: 1m
      minMembers: 2
      v4Bits: 24
      v6Bits: 44
      certainCohorts: 3
      certainMembers: 6
      chainWindow: 30m
      trackWindow: 30m
      sweepInterval: 1m

  scraper:
    enabled: true
    detector:
      minMaps: 5
      certainMaps: 15
      certainOffMap: 2
      trackWindow: 15m
      sweepInterval: 1m

  churner:
    enabled: true
    detector:
      window: 1h
      v6:
        minAccounts: 4
        certainAccounts: 6
      v4:
        minAccounts: 10
        certainAccounts: 20
      relay:
        handoff: 90s
        maxLife: 5m
        minClicks: 20
        minFlagShare: 0.9
        v4Bits: 24
        v6Bits: 32
        minLinks: 3
        certainLinks: 6
      trackWindow: 1h2m
      sweepInterval: 1m

chat:
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: chat
    pool:
      maxOpenConns: 2
  storage:
    historySize: 200
    retention: 720h
    pruneInterval: 1h
    subscriberBuffer: 256
  service:
    maxTextLength: 280
  rateLimiter:
    perSecond: 0.33
    burst: 5
    sweepInterval: 1m
  reactionLimiter:
    perSecond: 1
    burst: 10
  seenLimiter:
    perSecond: 1
    burst: 10
  blockedIPs: []

auth:
  enabled: false
  enforce: false
  secret: ""
  ttl: 1h
  rateLimiter:
    perSecond: 0.033
    burst: 10
    sweepInterval: 1m
  resumeLimiter:
    perSecond: 1
    burst: 10
  turnstile:
    enabled: false
    secret: ""
    hostnames: []
    action: session
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: auth
    pool:
      maxOpenConns: 2
  sessions:
    guestTTL: 2160h
    linkedTTL: 720h
    extendEvery: 24h
  signIn:
    enabled: false
    redirectUrl: http://localhost:5173/auth/callback
  google:
    clientId: ""
    clientSecret: ""
  discord:
    clientId: ""
    clientSecret: ""
  email:
    enabled: false
    delivery: log
    from: noreply@example.com
    fromName: ClickPlanet
    cloudflare:
      accountId: ""
      apiToken: ""
    sendLimiter:
      perSecond: 0.00083
      burst: 3
  prune:
    idleFor: 2160h
    interval: 1h

player:
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: player
    pool:
      maxOpenConns: 2
  tagSalt: ""

seasons:
  list:
    - number: 0
      endsAt: 2026-10-31T23:00:00Z
      finale: 2h
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: seasons
    pool:
      maxOpenConns: 2
