httpServer:
  bindAddress: 0.0.0.0:8080
  # Must stay well under Cloudflare's ~125s idle cut, which answers 524.
  streamHeartbeat: 30s
  startupTimeout: 1m
  consoleBindAddress: 127.0.0.1:8081
  internalBindAddress: 127.0.0.1:8082
  # Behind the admin gate: set, it needs auth.admin.origin.
  adminBindAddress: ""
  allowedOrigin: http://localhost:5173

gameMap:
  maxIndex: 262119

database:
  host: localhost
  port: "5432"
  user: postgres
  password: postgres
  dbName: postgres
  sslMode: disable
  schema: planet
  pool:
    maxOpenConns: 4

redis:
  address: localhost:6379
  password: ""

tilesStorage:
  flushInterval: 1s
  subscriberBuffer: 1024

ledger:
  retention: 72h
  sweepInterval: 5m

ledgerStorage:
  flushInterval: 1s
  maxTakes: 4000000

# The game's rules are the rule set postgres keeps (planet.rule_sets), edited on the backoffice.
rateLimiter:
  sweepInterval: 1m

vpnBlocklist:
  enabled: true
  includeDatacenters: false
  allow: []

bonus:
  forgetAfter: 5m

  sweepInterval: 1s

antiBot:
  enabled: true

  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: antibot
    pool:
      maxOpenConns: 2

  redis:
    address: localhost:6379
    password: ""

  jury:
    trackWindow: 15m
    sweepInterval: 1m

  evidence:
    saveInterval: 1m
    retention: 72h

  retaker:
    trackWindow: 5m
    sweepInterval: 1m

  sequencer:
    trackWindow: 15m
    sweepInterval: 1m

  metronome:
    stamina:
      slice: 10m
    trackWindow: 15m
    sweepInterval: 1m

  defender:
    trackWindow: 5m
    sweepInterval: 1m

  catcher:
    trackWindow: 1h
    sweepInterval: 1m

  cohort:
    v4Bits: 24
    v6Bits: 44
    trackWindow: 30m
    sweepInterval: 1m

  scraper:
    trackWindow: 15m
    sweepInterval: 1m

  churner:
    relay:
      v4Bits: 24
      v6Bits: 32
    trackWindow: 1h2m
    sweepInterval: 1m

  hopper:
    trackWindow: 15m
    sweepInterval: 1m

  rotator:
    slot: 5m
    sweepInterval: 1m

chat:
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: chat
    pool:
      maxOpenConns: 2
  redis:
    address: localhost:6379
    password: ""
  storage:
    historySize: 200
    retention: 720h
    pruneInterval: 1h
    subscriberBuffer: 256
  service:
    maxTextLength: 280
  rateLimiter:
    perSecond: 0.33
    burst: 5
    sweepInterval: 1m
  reactionLimiter:
    perSecond: 1
    burst: 10
  seenLimiter:
    perSecond: 1
    burst: 10
  blockedIPs: []

auth:
  enabled: false
  # The admin page, with auth on: its origin (e.g. http://localhost:5174), its own Google client and callback.
  admin:
    origin: ""
    redirectUrl: http://localhost:5174/auth/callback
    sessionTTL: 12h
  enforce: false
  secret: ""
  ttl: 1h
  rateLimiter:
    perSecond: 0.033
    burst: 10
    sweepInterval: 1m
  resumeLimiter:
    perSecond: 1
    burst: 10
  turnstile:
    enabled: false
    secret: ""
    hostnames: []
    action: session
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: auth
    pool:
      maxOpenConns: 2
  redis:
    address: localhost:6379
    password: ""
  sessions:
    guestTTL: 2160h
    linkedTTL: 720h
    extendEvery: 24h
  signIn:
    enabled: false
    redirectUrl: http://localhost:5173/auth/callback
  google:
    clientId: ""
    clientSecret: ""
  discord:
    clientId: ""
    clientSecret: ""
  email:
    enabled: false
    delivery: log
    from: noreply@example.com
    fromName: ClickPlanet
    cloudflare:
      accountId: ""
      apiToken: ""
    sendLimiter:
      perSecond: 0.00083
      burst: 3
  prune:
    idleFor: 2160h
    interval: 1h

player:
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: player
    pool:
      maxOpenConns: 2
  redis:
    address: localhost:6379
    password: ""
  tagSalt: ""

seasons:
  dailyCutoff: 21h
  list:
    - number: 0
      endsAt: 2026-10-31T23:00:00Z
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: seasons
    pool:
      maxOpenConns: 2
  redis:
    address: localhost:6379
    password: ""

metagame:
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: metagame
    pool:
      maxOpenConns: 2
  redis:
    address: localhost:6379
    password: ""

missions:
  cutoff: 21h
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: missions
    pool:
      maxOpenConns: 2
  redis:
    address: localhost:6379
    password: ""

support:
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: support
    pool:
      maxOpenConns: 2
  redis:
    address: localhost:6379
    password: ""
  retention: 2160h
  pruneInterval: 1h
  rateLimiter:
    perSecond: 0.0167
    burst: 3
    sweepInterval: 1m
  attachments:
    # Off: a note takes no file and the bucket below is not read. On, any S3-compatible bucket does.
    enabled: false
    maxPerNote: 10
    maxBytes: 52428800
    uploadTTL: 10m
    linkTTL: 1h
    bucket:
      endpoint: https://ACCOUNT_ID.r2.cloudflarestorage.com
      region: auto
      name: clickplanet-support
      accessKeyId: ""
      secretAccessKey: ""

# The numbers of the clips the clips job posted: `clips stats` sends a snapshot a day over ssh, the backoffice reads them.
clips:
  database:
    host: localhost
    port: "5432"
    user: postgres
    password: postgres
    dbName: postgres
    sslMode: disable
    schema: clips
    pool:
      maxOpenConns: 2
