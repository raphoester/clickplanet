httpServer:
  bindAddress: 0.0.0.0:8080
  # How often a live stream with nothing to say sends a heartbeat, so a proxy
  # does not mistake a quiet stream for a dead one. Cloudflare cuts a silent
  # response at ~125s with a 524, so this must stay well under that. Empty or
  # zero means 30s.
  streamHeartbeat: 30s
gameMap:
  maxIndex: 257948

# The whole tile map lives in this process and is snapshotted to a local file.
# There is no database and no second service to run.
tilesStorage:
  # Where the tile state is persisted. Leave empty to disable durability
  # entirely (state is then lost on restart).
  snapshotPath: ./data/tiles.snapshot
  # How often a modified state is flushed to disk.
  snapshotInterval: 30s
  # Per-websocket-subscriber channel capacity. Updates for a subscriber that
  # cannot keep up are dropped rather than blocking clicks.
  subscriberBuffer: 1024

# Per-IP throttle on the Click RPC. Reads and the websocket are untouched.
# The defaults below are also what applies when this block is absent.
rateLimiter:
  # Sustained clicks per second allowed from one caller — one address over
  # IPv4, one /64 over IPv6, since a v6 subscriber owns its whole prefix.
  perSecond: 1
  # Clicks a caller arriving after a quiet spell may spend at once, so that a
  # normal flurry is not refused.
  burst: 10
  # How often the buckets that have refilled completely are forgotten. Only
  # affects memory, never what a caller is allowed.
  sweepInterval: 1m

# Refuses the Click RPC from known VPN and proxy egress ranges, so a player has
# to come from an address the throttle above can actually hold onto: a bucket
# keyed on something you can change at will is a bucket that does not hold.
# Reads and the websocket are untouched — a VPN user still loads and watches the
# planet, they just cannot paint.
#
# The ranges are vendored from github.com/X4BNet/lists_vpn and embedded in the
# binary. Refresh them with `make vpn-lists`.
vpnBlocklist:
  # Off parses nothing and allocates nothing.
  enabled: true
  # Also refuse datacenter and hosting ranges, which catches a self-hosted
  # WireGuard on a VPS. It also refuses Apple iCloud Private Relay and
  # Cloudflare WARP, which egress from those same ranges and are on by default
  # for a lot of ordinary mobile traffic. Watch blocked_clicks{list="vpn"}
  # against clicks for a sense of the scale before turning this on.
  includeDatacenters: false
  # Never refused, whatever the lists say. Prefixes, so /32 for a single
  # address. Put your own address here.
  allow: []

# Bonus boxes: a question-mark box flies past the planet, and whoever catches it
# clicks at a multiple of their allowance for a minute.
#
# The server picks who is offered one and sends it down that one stream. It is
# deliberately not a race: broadcast to everyone, a box is always caught by
# whichever client reacts fastest, and that is a script every time.
#
# Each caller is on a schedule of their own. A single server-wide ticker made
# the rate each player saw 1/(interval x players), so the feature got rarer the
# busier the game was.
bonus:
  # Off means no box is ever offered and ClaimBonus answers Unimplemented.
  enabled: false

  # A caller's next box is due this long after the last one, drawn uniformly.
  # The spread is for feel: a script does not predict the schedule, it watches
  # the stream, so nothing here is hidden from one.
  minInterval: 90s
  maxInterval: 210s

  # How soon to try again after a box was not caught. It applies to one miss;
  # a second in a row waits the ordinary window, so a player who is not
  # catching them does not collect a box every 45s all session.
  missRetry: 45s

  # What a box can be worth, as a weight per kind. A kind's chance is its weight
  # over the sum of the weights: 3 and 1 make one box in four a spread. A kind
  # left out, or at 0, is never offered. Empty offers every kind equally.
  #   triple_clicks - the allowance is multiplied by `multiplier`
  #   spread_clicks - every click also takes the tiles touching the one clicked
  #   bomb          - one bomb, dropped anywhere to clear a circle of tiles
  #   enclose_clicks - a click that closes a shape of your tiles takes the inside
  kinds:
    triple_clicks: 5
    spread_clicks: 2
    bomb: 1
    enclose_clicks: 2

  # How long the token stays good. It has to outlast the flight the client
  # draws, or a box caught on its last frame is refused.
  offerTTL: 15s

  # How long a caught bonus runs, and what it multiplies the click allowance by.
  # Both the burst and the refill rate are multiplied, and the client reads them
  # off the answer - so changing these changes the meter with no frontend
  # release, exactly as rateLimiter does. The next box is due a window after the
  # bonus ends, so two can never overlap.
  duration: 20s
  multiplier: 3

  # How long a caught spread_clicks runs. Far shorter than `duration`: a click
  # that takes seven tiles is worth much more than three clicks.
  spreadDuration: 10s

  # How long a caught bomb may be held before it is lost. It counts towards
  # maxBoostPerHour like any bonus, and the next box is due a window after it is
  # dropped.
  bombDuration: 30s

  # The radius of the circle a bomb clears, whoever holds the tiles, in tile
  # spacings: 8 is ~230 tiles inland. The radius in radians is this times the
  # map's own tile spacing, so the client's ring and the clear always agree.
  bombRings: 8

  # enclose_clicks: how long it runs, how many shapes it may close in that time,
  # and the most tiles one shape may hold. A click that takes the last tile of a
  # wall around a pocket of other tiles takes the pocket too. Clicking a tile you
  # already hold closes nothing, so a shape finished before the bonus does not
  # count. A pocket bigger than encloseMaxTiles, or open to the coast, takes
  # nothing and costs no shape - so a triangle of three tiles, which has no
  # inside, is free.
  encloseDuration: 30s
  encloseShapes: 3
  encloseMaxTiles: 15

  # How recently a caller must have clicked to be offered a box. A tab left open
  # overnight is not playing, and a box sent to it is one nobody catches.
  activeWithin: 2m

  # How long a caller's schedule outlives its last stream. Without it, closing
  # the tab and reopening it draws a fresh wait, so a player could reload until
  # they got a short one.
  forgetAfter: 5m

  # The most bonus time one caller may be granted per hour. Nothing here is a
  # race any more, but a script still catches every box it is offered where a
  # person catches some - this bounds what that is worth.
  maxBoostPerHour: 15m

  # One sweep for everybody, rather than a timer per caller.
  sweepInterval: 1s

# Accepts a bot's clicks and drops them, rather than refusing them and naming the
# check it tripped. Three watchdogs read three different behaviours, the jury
# crosses what they say, and the shadow ban is the one sentence they all pass.
antiBot:
  # Off registers nothing and measures nothing.
  enabled: true

  # The sentence, and nothing else: it takes a scope and a clock and runs the
  # ban. It knows nothing about bots, tiles or what earned it.
  shadowBan:
    # Off judges, logs and counts without dropping anything. Ship in this mode:
    # read the "antibot ban" lines, check none of them is naming you, set the
    # bounds below from the numbers those lines carry, then turn this on.
    enforce: false
    banDuration: 1h
    # How soon a caller already serving a ban can be judged again. At or above a
    # watchdog's trackWindow each flag rests on evidence the previous one never
    # saw, so flags=6 on a line is six separate judgements agreeing rather than
    # one verdict repeated. Without this a caller goes quiet behind its first
    # ban and you cannot tell whether it stopped or kept going.
    reflagInterval: 5m
    sweepInterval: 1m

  # How the watchdogs are crossed.
  jury:
    # A watchdog that says "certain" bans on its own. This is how many must say
    # "suspect" instead — the level each of them uses for a reading that would
    # ban real players if it were trusted alone.
    #
    # Crossing only buys confidence when the watchdogs measure different things,
    # and these only half do: a machine sweep is sequential AND regular AND
    # never rests, so two suspicions can be one behaviour counted twice. So can
    # the most obsessed player. Two is the loosest this should be.
    minSuspects: 2
    # How long a suspicion stands while another watchdog catches up. A caller's
    # rules do not all trip on the same click — the sequencer needs a run of
    # steps, the metronome needs a quarter of an hour — but two readings an hour
    # apart are not a caller doing two things at once.
    suspicionWindow: 10m
    # How long a silent caller is remembered. A ban outlives this: it lives in
    # shadowBan above, on its own clock.
    trackWindow: 15m
    sweepInterval: 1m

  # Takes a tile back moments after losing it, over and over. Speed is not the
  # signal — the player clicking back at a bot is the fastest caller on the map.
  # Regularity is.
  retaker:
    enabled: true
    detector:
      # How soon after losing a tile a re-take counts as a reaction at all.
      # Anything slower is somebody who happened to click the same tile later.
      # Keep this well above the delays you expect to measure: a reaction past
      # the edge is not missed, it is censored, and the median of what is left
      # reads faster than the caller really is.
      reactionWindow: 5s
      # Reactions needed inside trackWindow before anything is said. The bound
      # that stops one unlucky exchange from being evidence.
      minReactions: 12
      # The p90-p10 of those reactions. On its own this is "suspect": a caller
      # answering at a steady 1s holds a band no hand holds, and a steady hand
      # at a slow tempo is not impossible. This is the bound that does the work
      # — the bot actually seen in production sat at 138ms across twenty
      # reactions while picking a human-looking delay on purpose.
      maxSpread: 120ms
      # A band this tight that is also faster than a person decides is
      # "certain", and bans on its own. Either bound alone bans real players.
      maxMedian: 250ms
      trackWindow: 5m
      sweepInterval: 1m

  # Walks the tile ids rather than the map: 1, 2, 3, 4, and on until a continent
  # is painted. Tile ids come from the icosahedron's vertex order and not from a
  # grid of latitudes, so filling in a shape by hand does not hold a constant
  # step from one click to the next. A loop over an integer does nothing else.
  sequencer:
    enabled: true
    detector:
      # Steps in hand before anything is said, and how many of them must sit at
      # the same step to read as "suspect". The size of the step says nothing;
      # holding one says everything.
      minSteps: 40
      minShare: 0.75
      # The same reading held long enough that nothing else explains it. Two
      # hundred clicks at a constant step is not a player being tidy.
      certainSteps: 200
      certainShare: 0.95
      trackWindow: 15m
      sweepInterval: 1m

  # Never varies and never stops. A script tuned to sit just under the throttle
  # spends hours at one tempo with no pauses in it.
  metronome:
    enabled: true
    detector:
      # The longest pause a run survives. Anything longer ends the run and the
      # evidence starts again from nothing, which is the point: a person stops
      # to look at the map, and a loop does not.
      maxGap: 3s
      # The p90-p10 of the gaps inside a run, and the bound that does all the
      # work here. The median is deliberately not bounded at all: the claim is
      # not that the caller is fast — a caller pushing past the throttle gets
      # its surviving clicks handed back at exactly the refill rate — it is that
      # the caller is a clock.
      maxSpread: 120ms
      # How long an unbroken run must be to read as "suspect", and what turns it
      # into "certain". Half an hour without once pausing longer than maxGap is
      # not somebody who is very keen.
      minClicks: 120
      certainFor: 30m
      certainClicks: 900
      trackWindow: 15m
      sweepInterval: 1m

# Gates the Click RPC on a token this server minted. Off by default: with it
# disabled session.v1.SessionService/ 404s and clicks are judged on address
# alone, exactly as they were before this existed.
session:
  enabled: false
  # Off counts what enforcing would refuse without refusing it — the mode to
  # deploy in, so a client that predates sessions keeps working while
  # click_session_checks shows what turning it on would cost.
  enforce: false
  # Signs the tokens. Empty generates one at boot, which invalidates every
  # session in flight on each restart: fine locally, not in production, where it
  # belongs in the environment rather than in a file that is in git.
  secret: ""
  ttl: 1h
  # Per-IP throttle on minting, separate from the click one: a mint costs a
  # siteverify round trip, a click costs a map write.
  rateLimiter:
    perSecond: 0.033
    burst: 10
    sweepInterval: 1m
  turnstile:
    # Off mints a session for anyone who asks, which is how a local backend
    # works without a widget and a secret. The click path is still exercised —
    # the token is bound and expires — but nothing had to be proved to get one.
    # Never the production choice.
    enabled: false
    secret: ""
    # The frontend origins siteverify must report. Empty refuses every token
    # rather than accepting any, so this cannot be left unset by accident.
    hostnames: []
    # Must match the widget's data-action.
    action: session

# Live chat. Its own bounded context and its own Connect service, sharing this
# process and the transport with the tile game and nothing else. Off by
# default: when disabled nothing is registered, so /chat.v1.ChatService/ and
# /ws/chat both 404 rather than erroring.
chat:
  enabled: true
  storage:
    # Append-only JSONL log of every message, sender IP included. Leave empty
    # to keep chat entirely in memory.
    logPath: ./data/chat.log
    # How many recent messages a joining client is served by GetHistory.
    historySize: 200
    # Messages older than this are dropped on the next prune. This is personal
    # data (IP + text), so the window is a retention policy, not a cache size.
    retention: 720h # 30 days
    # Upper bound on what a hard kill can lose, as with the tile snapshot.
    flushInterval: 5s
    pruneInterval: 1h
    # Per-websocket-subscriber channel capacity. Messages for a subscriber that
    # cannot keep up are dropped rather than blocking senders.
    subscriberBuffer: 256
  service:
    maxTextLength: 280
    maxNameLength: 24
    # Salts the per-sender tag so it cannot be reversed into an IP. Generated
    # randomly at boot when empty, which makes tags change on every restart.
    tagSalt: ""
  # Per-IP throttle on SendMessage. Separate from the click limiter above: a
  # message fans out to every client and lands in a log, so it costs far more
  # than a click. One message every three seconds, five in hand.
  rateLimiter:
    perSecond: 0.33
    burst: 5
    sweepInterval: 1m
  # Refused every chat RPC outright. The way to cut off an abusive sender
  # without a rebuild. Same prefix set as vpnBlocklist above, so these are
  # CIDRs — a single address needs /32, and a whole range is one line. A
  # malformed entry fails the start rather than silently refusing nobody.
  blockedIPs: []
