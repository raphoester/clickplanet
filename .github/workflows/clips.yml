name: clips

on:
  # Every 2 hours, on a minute nobody else picks: GitHub starts a scheduled run late when many start on the hour.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clips

env:
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      # No npm here: the VPS key is in no job that installs the frontend's dependencies.
      # The race tells the day of the season closed in the replay, and the season who is called up to its Final Battle;
      # the cast, the players who took tiles in it, numbered and named, never an account id (the artifact is public).
      # A backend that does not answer one leaves it out.
      - name: fetch the last 12 hours
        working-directory: apps/backend
        env:
          CLICKPLANET_SSH: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          ssh-add -q - <<< "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          go run ./cmd/clips fetch -hours 12 -out "$GITHUB_WORKSPACE/replay.json" -race "$GITHUB_WORKSPACE/race.json" \
            -season "$GITHUB_WORKSPACE/season.json" -cast "$GITHUB_WORKSPACE/cast.json"

      - uses: actions/upload-artifact@v4
        with:
          name: replay
          path: |
            replay.json
            race.json
            season.json
            cast.json
          retention-days: 1

  findings:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci
        working-directory: apps/frontend

      - uses: actions/download-artifact@v4
        with:
          name: replay
          path: apps/frontend

      # Every front, tour and place of the last 12 hours, measured and not judged, for the editor.
      - name: measure what the replay holds
        working-directory: apps/frontend
        run: |
          race=$([ -f race.json ] && echo "--race race.json" || true)
          season=$([ -f season.json ] && echo "--season season.json" || true)
          cast=$([ -f cast.json ] && echo "--cast cast.json" || true)
          npm run clip -- --replay replay.json $race $season $cast --findings findings.json

      - uses: actions/upload-artifact@v4
        with:
          name: findings
          path: apps/frontend/findings.json
          retention-days: 1

  # Its own job: the Zernio and Anthropic keys are in no job that installs the frontend's dependencies.
  choose:
    needs: findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      picks: ${{ steps.choose.outputs.picks }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: findings

      # Up to 2, within what each platform has left of its trailing day: the model's stories of the findings, each
      # checked against them, with the arm of each experiment its clip is in:
      # [{"pick":1,"story":{"front":3,"kind":"battle",...,"headline":"FRANCE VS TURKEY"},"variants":{"length":"short"}}].
      # What the model's call cost goes to the summary; a model that fails leaves the run its day won alone, and the summary says why.
      - name: choose the clips of the run
        id: choose
        working-directory: apps/backend
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLATFORMS: ${{ vars.CLIPS_PLATFORMS }}
        run: |
          picks=$(go run ./cmd/clips choose -findings "$GITHUB_WORKSPACE/findings.json" -platforms "$PLATFORMS" \
            -summary "$GITHUB_STEP_SUMMARY")
          echo "picks=$picks" >> "$GITHUB_OUTPUT"

      - if: steps.choose.outputs.picks == '[]'
        run: |
          echo "No clip this run: the editor told no story of the last 12 hours, or every platform has posted its day (the log says which)." \
            >> "$GITHUB_STEP_SUMMARY"

  render:
    needs: choose
    if: needs.choose.outputs.picks != '[]'
    name: render ${{ matrix.clip.pick }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        clip: ${{ fromJSON(needs.choose.outputs.picks) }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      # The fighters' names are any script: Rubik draws no CJK.
      - name: install ffmpeg and the CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk

      - uses: actions/download-artifact@v4
        with:
          name: replay
          path: apps/frontend

      # One recorder: with no GPU each one draws every frame, so a second one adds nothing. The generator applies the
      # arms it acts on, and writes every arm into the clip's record for schedule. The model's story, its headline in
      # it, goes through the environment, never into the script: it is the model's text.
      - name: render the clip
        env:
          PICK: ${{ matrix.clip.pick }}
          STORY: ${{ toJSON(matrix.clip.story) }}
          VARIANTS: ${{ toJSON(matrix.clip.variants) }}
        run: |
          race=$([ -f race.json ] && echo "--race race.json" || true)
          season=$([ -f season.json ] && echo "--season season.json" || true)
          cast=$([ -f cast.json ] && echo "--cast cast.json" || true)
          npm run clip -- --replay replay.json $race $season $cast --pick "$PICK" --story "$STORY" --variants "$VARIANTS" \
            --recorders 1

      - uses: actions/upload-artifact@v4
        with:
          name: clip-${{ matrix.clip.pick }}
          path: |
            apps/frontend/clip-${{ matrix.clip.pick }}.mp4
            apps/frontend/clip-${{ matrix.clip.pick }}.json
          if-no-files-found: error
          retention-days: 3

  schedule:
    needs: [ choose, render ]
    # A clip that failed to render fails the run, and the ones that rendered still go out.
    if: ${{ !cancelled() && needs.choose.result == 'success' && needs.choose.outputs.picks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/download-artifact@v4
        with:
          pattern: clip-*
          path: clips
          merge-multiple: true

      # The repository variable CLIPS_PLATFORMS turns a platform off with no commit: "tiktok" alone. Unset is every platform.
      # CLIPS_SOUND_COUNTRY is the country of TikTok's trending chart a clip drawn for a trending track gets one from
      # (the experiment "sound"): two letters, unset is US. A chart that cannot be read sends the clip with its anthem.
      # Then the backend keeps who each post names, over ssh, so the game tells them: no npm in this job either.
      - name: schedule the clips on TikTok and YouTube
        working-directory: apps/backend
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          PLATFORMS: ${{ vars.CLIPS_PLATFORMS }}
          SOUND_COUNTRY: ${{ vars.CLIPS_SOUND_COUNTRY }}
          CLICKPLANET_SSH: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          ssh-add -q - <<< "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          go run ./cmd/clips schedule -clips "$GITHUB_WORKSPACE/clips" -platforms "$PLATFORMS" -sound-country "$SOUND_COUNTRY" \
            -summary "$GITHUB_STEP_SUMMARY"
