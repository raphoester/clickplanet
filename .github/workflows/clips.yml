name: clips

on:
  # Every 2 hours but at night, when no platform posts, on a minute nobody else picks: GitHub starts a scheduled run late
  # when many start on the hour.
  schedule:
    - cron: '17 6-22/2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clips

env:
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      # No npm here: the VPS key is in no job that installs the frontend's dependencies.
      # The race tells the day of the season closed in the replay, and the season who is called up to its Final Battle;
      # the cast, the players who took tiles in it, numbered and named, never an account id (the artifact is public);
      # the history, the map every hour since the season started, which each place's saga is told from; the flag list,
      # which names and draws the flags sold since the build.
      # A backend that does not answer one leaves it out. 72 hours, as much as the ledger keeps: a carousel's fight-the-most
      # counts the last 3 days, and the clips' stories are searched in the last 12 alone.
      - name: fetch the last 12 hours
        working-directory: apps/backend
        env:
          CLICKPLANET_SSH: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          ssh-add -q - <<< "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          go run ./cmd/clips fetch -hours 72 -out "$GITHUB_WORKSPACE/replay.json" -race "$GITHUB_WORKSPACE/race.json" \
            -season "$GITHUB_WORKSPACE/season.json" -cast "$GITHUB_WORKSPACE/cast.json" -history "$GITHUB_WORKSPACE/history.json" \
            -flag-list "$GITHUB_WORKSPACE/flag-list.json"

      - uses: actions/upload-artifact@v6
        with:
          name: replay
          path: |
            replay.json
            race.json
            season.json
            cast.json
            history.json
            flag-list.json
          retention-days: 1

  findings:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci
        working-directory: apps/frontend

      - uses: actions/download-artifact@v7
        with:
          name: replay
          path: apps/frontend

      # Every front, tour and place of the last 12 hours, and each place's saga over the season, measured and not judged,
      # for the editor.
      - name: measure what the replay holds
        working-directory: apps/frontend
        run: |
          race=$([ -f race.json ] && echo "--race race.json" || true)
          season=$([ -f season.json ] && echo "--season season.json" || true)
          cast=$([ -f cast.json ] && echo "--cast cast.json" || true)
          history=$([ -f history.json ] && echo "--history history.json" || true)
          flaglist=$([ -f flag-list.json ] && echo "--flag-list flag-list.json" || true)
          npm run clip -- --replay replay.json $race $season $cast $history $flaglist --findings findings.json

      - uses: actions/upload-artifact@v6
        with:
          name: findings
          path: apps/frontend/findings.json
          # 15 KB a run: kept a month, so the war report's bench can write on any recent moment (docs/video-lab.md).
          retention-days: 30

  # Its own job: the Anthropic key and the VPS's are in no job that installs the frontend's dependencies.
  choose:
    needs: findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      picks: ${{ steps.choose.outputs.picks }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/download-artifact@v7
        with:
          name: findings

      # Up to 2, within what each platform has left of its trailing day, as the backend's publishing module counts it,
      # and what was told, both asked of it over ssh: the model's stories of the findings, each checked against them:
      # [{"pick":1,"story":{"front":3,"kind":"battle",...,"headline":"FRANCE VS TURKEY"}}].
      # What the model's call cost goes to the summary; a model that fails leaves the run its day won alone, and the summary says why.
      # The lab (docs/video-lab.md) may give one pick of the run to an experiment; CLIPS_LAB=off is the control alone.
      - name: choose the clips of the run
        id: choose
        working-directory: apps/backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLATFORMS: ${{ vars.CLIPS_PLATFORMS }}
          LAB: ${{ vars.CLIPS_LAB || 'on' }}
          CLICKPLANET_SSH: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          ssh-add -q - <<< "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          picks=$(go run ./cmd/clips choose -findings "$GITHUB_WORKSPACE/findings.json" -platforms "$PLATFORMS" -lab "$LAB" \
            -summary "$GITHUB_STEP_SUMMARY")
          echo "picks=$picks" >> "$GITHUB_OUTPUT"

      - if: steps.choose.outputs.picks == '[]'
        run: |
          echo "No clip this run: the editor told no story of the last 12 hours, or every platform has posted its day (the log says which)." \
            >> "$GITHUB_STEP_SUMMARY"

  render:
    needs: choose
    if: needs.choose.outputs.picks != '[]'
    name: render ${{ matrix.clip.pick }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        clip: ${{ fromJSON(needs.choose.outputs.picks) }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/frontend/scripts/clip/voice/package-lock.json

      - run: npm ci

      # A war report's voice (docs/video-lab.md): Kokoro, a package of its own, beside the game's dependencies.
      - name: install the voice
        if: matrix.clip.story.script
        working-directory: apps/frontend/scripts/clip/voice
        run: npm ci

      # Kokoro's model, 310 MB that Hugging Face serves on the first call: kept, so a war report does not hang on Hugging
      # Face's limits for anonymous downloads. Restored after npm ci, which empties node_modules.
      - name: keep Kokoro's model
        if: matrix.clip.story.script
        uses: actions/cache@v6
        with:
          path: apps/frontend/scripts/clip/voice/node_modules/@huggingface/transformers/.cache
          key: kokoro-${{ hashFiles('apps/frontend/scripts/clip/voice/voice.mjs', 'apps/frontend/scripts/clip/voice/package-lock.json') }}

      # The writer's lines, said by Adam at 1.15, one sentence at a time, into voice/ with when each is said. The script is
      # the model's text: jq reads it from the environment, never the shell.
      - name: say the war report
        if: matrix.clip.story.script
        working-directory: apps/frontend/scripts/clip/voice
        env:
          PICK: ${{ matrix.clip.pick }}
          STORY: ${{ toJSON(matrix.clip.story) }}
        run: |
          jq -n '{entries: [{id: ("clip-" + env.PICK), lines: (env.STORY | fromjson | .script.lines)}]}' > script.json
          node voice.mjs script.json "$GITHUB_WORKSPACE/apps/frontend/voice"

      # The fighters' names are any script: Rubik draws no CJK.
      - name: install ffmpeg and the CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk

      - uses: actions/download-artifact@v7
        with:
          name: replay
          path: apps/frontend

      # One recorder: with no GPU each one draws every frame, so a second one adds nothing. The model's story, its
      # headline in it, goes through the environment, never into the script: it is the model's text. A carousel's pick
      # renders its photos and their slideshow; a war report's plays its voice and lasts as long, 30 s at most.
      - name: render the clip
        env:
          PICK: ${{ matrix.clip.pick }}
          STORY: ${{ toJSON(matrix.clip.story) }}
        run: |
          race=$([ -f race.json ] && echo "--race race.json" || true)
          season=$([ -f season.json ] && echo "--season season.json" || true)
          cast=$([ -f cast.json ] && echo "--cast cast.json" || true)
          history=$([ -f history.json ] && echo "--history history.json" || true)
          flaglist=$([ -f flag-list.json ] && echo "--flag-list flag-list.json" || true)
          said=$(ls voice/clip-"$PICK"-*.wav 2> /dev/null | head -n 1)
          voice=$([ -n "$said" ] && echo "--voice $said" || true)
          npm run clip -- --replay replay.json $race $season $cast $history $flaglist $voice --pick "$PICK" --story "$STORY" --recorders 1

      - uses: actions/upload-artifact@v6
        with:
          name: clip-${{ matrix.clip.pick }}
          path: |
            apps/frontend/clip-${{ matrix.clip.pick }}.mp4
            apps/frontend/clip-${{ matrix.clip.pick }}.json
            apps/frontend/clip-${{ matrix.clip.pick }}-*.jpg
          if-no-files-found: error
          retention-days: 3

  schedule:
    needs: [ choose, render ]
    # A clip that failed to render fails the run, and the ones that rendered still go out.
    if: ${{ !cancelled() && needs.choose.result == 'success' && needs.choose.outputs.picks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - uses: actions/download-artifact@v7
        with:
          pattern: clip-*
          path: clips
          merge-multiple: true

      # The repository variable CLIPS_PLATFORMS turns a platform off with no commit: "tiktok" alone. Unset is every platform.
      # The backend's publishing module plans and posts each clip, over ssh; the video, and a carousel's photos for
      # TikTok, go straight to the posting service's storage, through a link the backend signs. Then the backend keeps who each post names, so the game
      # tells them: no npm in this job either.
      - name: schedule the clips on TikTok and YouTube
        working-directory: apps/backend
        env:
          PLATFORMS: ${{ vars.CLIPS_PLATFORMS }}
          CLICKPLANET_SSH: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          ssh-add -q - <<< "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          go run ./cmd/clips schedule -clips "$GITHUB_WORKSPACE/clips" -platforms "$PLATFORMS" \
            -summary "$GITHUB_STEP_SUMMARY"
