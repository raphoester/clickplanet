name: check backend

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'proto/**'
      - 'quiz/**'
      - 'docs/moderation.md'
      - 'deploy/**'
      - '.github/workflows/check-backend.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'proto/**'
      - 'quiz/**'
      - 'docs/moderation.md'
      - 'deploy/**'
      - '.github/workflows/check-backend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - run: go build ./...

      - run: go vet -tags testing ./...

      - run: make test

      - run: make deadcode

      - run: make check-quiz

      - run: make check-moderation

      # A pull request's HEAD is its merge commit: HEAD^1 is main as it is now. On main, the deploy checks instead.
      - run: make check-migrations BASE=${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      # version must match GOLANGCI_LINT_VERSION in apps/backend/Makefile.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: apps/backend

      - run: make check-format
        working-directory: apps/backend
