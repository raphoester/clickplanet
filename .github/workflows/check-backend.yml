name: check backend

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'proto/**'
      - '.github/workflows/check-backend.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'proto/**'
      - '.github/workflows/check-backend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - run: go build ./...

      - run: go vet -tags testing ./...

      - run: make test

      - run: make deadcode

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      # version must match GOLANGCI_LINT_VERSION in apps/backend/Makefile.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: apps/backend

      - run: make check-format
        working-directory: apps/backend
