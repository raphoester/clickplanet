name: check mailroom

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/mailroom/**'
      - '.github/workflows/check-mailroom.yml'
  pull_request:
    paths:
      - 'apps/mailroom/**'
      - '.github/workflows/check-mailroom.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/mailroom

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/mailroom/go.mod
          cache-dependency-path: apps/mailroom/go.sum

      - run: make vet

      - run: make test

      - run: make build
