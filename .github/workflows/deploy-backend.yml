name: deploy backend

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'proto/**'
      - 'deploy/vps/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/clickplanet-backend
  CADDY_IMAGE: ghcr.io/${{ github.repository_owner }}/clickplanet-caddy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Caddy is built here, not on the droplet. Linking Caddy with the Cloudflare
  # DNS plugin pulls in certmagic, quic-go, smallstep, otel and the AWS SDK —
  # minutes of CPU and enough memory to OOM a 1 GB box. Same rule as the
  # backend: CI builds, the box only pulls.
  caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/vps/caddy
          push: true
          tags: |
            ${{ env.CADDY_IMAGE }}:latest
            ${{ env.CADDY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every push to main publishes a new :<sha> tag for both images, so versions
  # accumulate without bound. Storage is free for public packages, but the
  # package page becomes unusable after a few hundred. Keeps the newest 20 of
  # each — :latest always points at the newest, so it is never a candidate.
  prune:
    needs: [ build, caddy ]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [ clickplanet-backend, clickplanet-caddy ]
    steps:
      - uses: actions/delete-package-versions@v5
        continue-on-error: true   # retention must never fail a deploy
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 20

  # The droplet's .env is rendered here and never edited by hand. Editing it over
  # ssh meant the only copy of every secret lived on one box: nothing else knew
  # what was set, a rebuild started from a blank file, and a typo was found by
  # the stack failing to come up.
  #
  # Actions secrets are write-only — nothing outside a workflow run can read them
  # back — so this job is the one place able to render the file. That also means
  # they cannot be recovered if lost: keep a copy in a password manager.
  #
  # The whole secret set is handed to the render step as one object, so **no
  # secret is named anywhere in this file**. Adding one is done in the GitHub UI
  # and read as ${THE_NAME} in deploy/vps/docker-compose.yaml; nothing between
  # those two points has to learn about it.
  deploy:
    needs: [ build, caddy ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rendered on the runner rather than over ssh: the logic lives in a script
      # that can be run and tested outside CI (`make env-preview`), and the box
      # receives a finished file instead of a heredoc.
      - name: render the droplet's .env
        working-directory: deploy/vps
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: make env ENV_OUT=rendered.env

      - name: copy it to the VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/vps/rendered.env
          target: /tmp
          strip_components: 2

      - name: ssh to the VPS and roll the container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/clickplanet/deploy/vps
            git -C /opt/clickplanet pull --ff-only

            # Keep the outgoing file: if a secret is ever dropped from the
            # repository, compose refuses to start and names it, but only after
            # this one has been replaced. CHAT_TAG_SALT and SESSION_SECRET are
            # the two that matter — regenerating either is visible to every
            # player — and .env.previous is what gets them back.
            if [ -f .env ]; then
              cp -p .env .env.previous   # gitignored by .env.*
              chown --reference=.env /tmp/rendered.env
            fi
            chmod 600 /tmp/rendered.env
            mv /tmp/rendered.env .env

            docker compose pull
            docker compose up -d
            docker image prune -f
