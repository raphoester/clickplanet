name: deploy backend

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'proto/**'
      - 'deploy/vps/**'
      - '.github/workflows/deploy-backend.yml'
      - '!apps/backend/docs/**'
      - '!apps/backend/*.md'
      - '!deploy/vps/README.md'
  workflow_dispatch:

concurrency:
  group: deploy-backend

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/clickplanet-backend
  CADDY_IMAGE: ghcr.io/${{ github.repository_owner }}/clickplanet-caddy

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: read the revision the VPS runs
        id: running
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          revision=$(ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$VPS_USER@$VPS_HOST" \
            "docker inspect cp-backend --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}'")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: check the migrations against the ones the database ran
        working-directory: apps/backend
        env:
          RUNNING: ${{ steps.running.outputs.revision }}
        run: |
          if [ -z "$RUNNING" ] || [ "$RUNNING" = "<no value>" ]; then
            echo "::warning::cp-backend's image has no revision label: only the names and versions were checked"
            make check-migrations
          else
            echo "the VPS runs $RUNNING"
            make check-migrations BASE="$RUNNING"
          fi

  build:
    needs: [ migrations ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: apps/backend
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  caddy:
    needs: [ migrations ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: deploy/vps/caddy
          push: true
          tags: |
            ${{ env.CADDY_IMAGE }}:latest
            ${{ env.CADDY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prune:
    needs: [ build, caddy ]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [ clickplanet-backend, clickplanet-caddy ]
    steps:
      # What actions/delete-package-versions@v5 did, which has no release on Node 24: the 20 newest versions stay, and
      # a run deletes at most 100 of the others, oldest first.
      - name: delete all but the 20 newest versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: users/${{ github.repository_owner }}/packages/container/${{ matrix.package }}/versions
        run: |
          set -o pipefail
          ids=$(gh api --paginate --slurp "$VERSIONS?per_page=100" |
            jq -r 'add | sort_by(.created_at, .id) | .[:-20] | .[:100] | .[].id')
          for id in $ids; do
            gh api -X DELETE "$VERSIONS/$id"
            echo "deleted version $id"
          done

  deploy:
    needs: [ build, caddy ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: render the droplet's env files
        working-directory: deploy/vps
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: make env ENV_OUT=rendered

      - name: copy them to the VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/vps/rendered/.env,deploy/vps/rendered/.env.caddy,deploy/vps/rendered/.env.backend
          target: /tmp/cp-env
          strip_components: 3

      - name: ssh to the VPS and roll the container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/clickplanet/deploy/vps
            before=$(git -C /opt/clickplanet rev-parse HEAD)
            git -C /opt/clickplanet pull --ff-only

            for f in .env .env.caddy .env.backend; do
              if [ -f "$f" ]; then
                cp -p "$f" "$f.previous"
                chown --reference="$f" "/tmp/cp-env/$f"
              fi
              chmod 600 "/tmp/cp-env/$f"
              mv "/tmp/cp-env/$f" "$f"
            done
            rmdir /tmp/cp-env

            docker compose pull
            docker compose run --rm --no-deps -T caddy \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            # Start cp-backend once: a second recreate kills the first boot mid-migration and leaves schema_migrations dirty.
            recreate=
            if ! git -C /opt/clickplanet diff --quiet "$before" HEAD -- deploy/vps/backend.yaml; then
              recreate=--force-recreate
            fi
            docker compose up -d $recreate backend
            others=$(docker compose config --services | grep -vx backend)
            docker compose up -d --no-deps $others
            # up -d ignores a Caddyfile edit; retry until a new Caddy's admin API listens.
            for i in $(seq 1 15); do
              docker compose exec -T caddy \
                caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile && break
              [ "$i" -eq 15 ] && exit 1
              sleep 2
            done
            docker image prune -f
