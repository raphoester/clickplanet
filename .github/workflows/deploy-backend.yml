name: deploy backend

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'proto/**'
      - 'deploy/vps/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/clickplanet-backend
  CADDY_IMAGE: ghcr.io/${{ github.repository_owner }}/clickplanet-caddy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Caddy is built here, not on the droplet. Linking Caddy with the Cloudflare
  # DNS plugin pulls in certmagic, quic-go, smallstep, otel and the AWS SDK —
  # minutes of CPU and enough memory to OOM a 1 GB box. Same rule as the
  # backend: CI builds, the box only pulls.
  caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/vps/caddy
          push: true
          tags: |
            ${{ env.CADDY_IMAGE }}:latest
            ${{ env.CADDY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every push to main publishes a new :<sha> tag for both images, so versions
  # accumulate without bound. Storage is free for public packages, but the
  # package page becomes unusable after a few hundred. Keeps the newest 20 of
  # each — :latest always points at the newest, so it is never a candidate.
  prune:
    needs: [ build, caddy ]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [ clickplanet-backend, clickplanet-caddy ]
    steps:
      - uses: actions/delete-package-versions@v5
        continue-on-error: true   # retention must never fail a deploy
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 20

  deploy:
    needs: [ build, caddy ]
    runs-on: ubuntu-latest
    steps:
      - name: ssh to the VPS and roll the container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/clickplanet/deploy/vps
            before=$(git -C /opt/clickplanet rev-parse HEAD)
            git -C /opt/clickplanet pull --ff-only
            docker compose pull
            # Check the new Caddyfile with the new image before anything goes
            # live. `run` is a throwaway container with no ports, so it works
            # whether or not cp-caddy is up. A bad file fails the deploy here
            # and the running Caddy keeps its old config.
            docker compose run --rm --no-deps -T caddy \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker compose up -d
            # The backend reads backend.yaml once, at boot, and `up -d` only
            # recreates a container whose image or compose settings changed. So a
            # merge that only edits the file would be pulled and never read:
            # recreate the backend when the file moved.
            if ! git -C /opt/clickplanet diff --quiet "$before" HEAD -- deploy/vps/backend.yaml; then
              docker compose up -d --force-recreate --no-deps backend
            fi
            # `up -d` does not recreate Caddy for a Caddyfile edit, so load it
            # in place. A reload keeps open connections, and is a no-op when the
            # config did not change. The retry covers a Caddy that `up` has just
            # recreated and whose admin API is not listening yet.
            for i in $(seq 1 15); do
              docker compose exec -T caddy \
                caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile && break
              [ "$i" -eq 15 ] && exit 1
              sleep 2
            done
            docker image prune -f
