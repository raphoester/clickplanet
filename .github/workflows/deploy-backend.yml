name: deploy backend

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'proto/**'
      - 'deploy/vps/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/clickplanet-backend
  CADDY_IMAGE: ghcr.io/${{ github.repository_owner }}/clickplanet-caddy
  OPS_IMAGE: ghcr.io/${{ github.repository_owner }}/clickplanet-ops

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/vps/caddy
          push: true
          tags: |
            ${{ env.CADDY_IMAGE }}:latest
            ${{ env.CADDY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ops:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/vps/ops
          push: true
          tags: |
            ${{ env.OPS_IMAGE }}:latest
            ${{ env.OPS_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prune:
    needs: [ build, caddy, ops ]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [ clickplanet-backend, clickplanet-caddy, clickplanet-ops ]
    steps:
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 20

  deploy:
    needs: [ build, caddy, ops ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: render the droplet's env files
        working-directory: deploy/vps
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: make env ENV_OUT=rendered

      - name: copy them to the VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/vps/rendered/.env,deploy/vps/rendered/.env.caddy,deploy/vps/rendered/.env.backend
          target: /tmp/cp-env
          strip_components: 3

      - name: ssh to the VPS and roll the container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/clickplanet/deploy/vps
            before=$(git -C /opt/clickplanet rev-parse HEAD)
            git -C /opt/clickplanet pull --ff-only

            for f in .env .env.caddy .env.backend; do
              if [ -f "$f" ]; then
                cp -p "$f" "$f.previous"
                chown --reference="$f" "/tmp/cp-env/$f"
              fi
              chmod 600 "/tmp/cp-env/$f"
              mv "/tmp/cp-env/$f" "$f"
            done
            rmdir /tmp/cp-env

            docker compose pull
            docker compose run --rm --no-deps -T caddy \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker compose up -d
            if ! git -C /opt/clickplanet diff --quiet "$before" HEAD -- deploy/vps/backend.yaml; then
              docker compose up -d --force-recreate --no-deps backend
            fi
            # up -d ignores a Caddyfile edit; retry until a new Caddy's admin API listens.
            for i in $(seq 1 15); do
              docker compose exec -T caddy \
                caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile && break
              [ "$i" -eq 15 ] && exit 1
              sleep 2
            done
            docker image prune -f
