name: check admin

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/admin/**'
      - 'proto/**'
      - '.github/workflows/check-admin.yml'
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'proto/**'
      - '.github/workflows/check-admin.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/admin

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test
