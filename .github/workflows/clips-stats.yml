name: clips stats

# Once a day, a snapshot of the numbers of every post of the clips job, kept in a private repository: the metrics TikTok
# gives a business account come 24 to 48 hours after a post and only for posts active in the last 7 days, so a day
# missed is lost for good. Never in this repository, its artifacts or its logs: they are public.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'The day of the first post read, as 2026-10-13 (the first post of the job): empty is the last 4 weeks'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: clips-stats

jobs:
  # One job: it holds the Zernio key and the key to the private repository, and runs no npm.
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: check where the snapshots are kept
        env:
          REPOSITORY: ${{ vars.CLIPS_STATS_REPO }}
          KEYED: ${{ secrets.CLIPS_STATS_DEPLOY_KEY != '' }}
        run: |
          if [ -z "$REPOSITORY" ]; then
            echo "::error::Set the repository variable CLIPS_STATS_REPO to the private repository the snapshots are kept in (owner/name)."
            exit 1
          fi
          if [ "$KEYED" != "true" ]; then
            echo "::error::Set the secret CLIPS_STATS_DEPLOY_KEY to the private key of a deploy key of $REPOSITORY with write access."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CLIPS_STATS_REPO }}
          ssh-key: ${{ secrets.CLIPS_STATS_DEPLOY_KEY }}
          path: clips-stats

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      # It keeps what it read even when a post could not be read, then fails: the next step still keeps it.
      - name: take the snapshot
        id: snapshot
        working-directory: apps/backend
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          SINCE: ${{ inputs.since }}
        run: |
          since=()
          if [ -n "$SINCE" ]; then since=(-since "$SINCE"); fi
          go run ./cmd/clips stats -out "$GITHUB_WORKSPACE/clips-stats" "${since[@]}" -summary "$GITHUB_STEP_SUMMARY"

      - name: keep it in the private repository
        if: ${{ !cancelled() && steps.snapshot.outcome != 'skipped' }}
        working-directory: clips-stats
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Nothing to keep." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="clips stats" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore: snapshot of $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet
