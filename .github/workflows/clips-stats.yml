name: clips stats

# Once a day, a snapshot of the numbers of every post of the clips job, kept in the backend's postgres and read from
# the backoffice: the metrics TikTok gives a business account come 24 to 48 hours after a post and only for posts
# active in the last 7 days, so a day missed is lost for good. Never in this repository, its artifacts or its logs:
# they are public, and some of the numbers are not.
#
# At 08:23 UTC: just after midnight Pacific, 01:23 under PDT and 00:23 under PST (from 2026-11-01), when YouTube's
# analytics quota is fresh. It is a Pacific day's: at 05:41 UTC, 22:41 Pacific, the run of 2026-10-25 fell in the
# same Pacific day as the backfill of the afternoon, and found it spent. A run by hand spends the same day's quota.
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'The day of the first post read, as 2026-10-13 (the first post of the job): empty is the last 4 weeks'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: clips-stats

jobs:
  # One job: it holds the Zernio key and the key to the VPS, and runs no npm.
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      # It keeps what it read even when a post could not be read, then fails. A retention curve missing fails nothing:
      # the row is kept without it, the log warns, and the next run asks for it again.
      - name: take the snapshot
        working-directory: apps/backend
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          CLICKPLANET_SSH: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SINCE: ${{ inputs.since }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          ssh-add -q - <<< "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          since=()
          if [ -n "$SINCE" ]; then since=(-since "$SINCE"); fi
          go run ./cmd/clips stats "${since[@]}"
