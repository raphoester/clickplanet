syntax = "proto3";

package scoring.v1;

import "player/v1/color.proto";
import "player/v1/title.proto";

// The books and their rounds, read by the ids the gamemaster's timeline names. Scoring knows no season, day or battle.
service ScoringService {
  // A book's top 10 players, of every flag or of one.
  rpc GetBoard(GetBoardRequest) returns (GetBoardResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The caller's tally in a book.
  rpc GetMyTally(GetMyTallyRequest) returns (GetMyTallyResponse);

  // A round: its live standings while open, its results once scored.
  rpc GetRound(GetRoundRequest) returns (GetRoundResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // A book's countries, by points.
  rpc GetScores(GetScoresRequest) returns (GetScoresResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // A book's board and scores, and the rounds asked for, then each change; a heartbeat meanwhile.
  rpc ListenForEvents(ListenForEventsRequest) returns (stream ScoringEvent);
}

message GetBoardRequest {
  string book_id = 1;
  string country_id = 2;
}

message GetBoardResponse {
  repeated Standing standings = 1;
}

message Standing {
  uint32 rank = 1;
  string name = 2;
  player.v1.NameColor color = 3;
  string country_id = 4;
  uint64 tiles = 5;
  player.v1.Title worn_title = 6;
  string account_id = 7;
}

message GetMyTallyRequest {
  string book_id = 1;
  string country_id = 2;
}

message GetMyTallyResponse {
  string country_id = 1;
  uint64 tiles = 2;
  uint32 global_rank = 3;
  // country_tiles and country_rank are on the board of the request's country_id, not of the main flag.
  uint32 country_rank = 4;
  player.v1.Title worn_title = 5;
  uint64 country_tiles = 6;
}

message GetRoundRequest {
  string round_id = 1;
}

// NotFound for a round never opened.
message GetRoundResponse {
  Round round = 1;
}

message Round {
  string round_id = 1;
  string book_id = 2;
  uint32 times = 3;
  int64 started_at_unix_ms = 4;
  // 0 while it runs.
  int64 ended_at_unix_ms = 5;
  // While it runs, each country's share of the map now and the points it would score; once scored, its results.
  repeated RoundStanding standings = 6;
  // The tiles each country's players took during the round, most first.
  repeated RoundTakes takes = 7;
  // The top 10 signed-in players of the round by the tiles they took during it, each under the flag it took the most
  // for.
  repeated Standing players = 8;
  // The book's scores before and after the round; empty while it runs.
  repeated Score before = 9;
  repeated Score after = 10;
}

message RoundStanding {
  uint32 rank = 1;
  string country_id = 2;
  double share = 3;
  uint32 points = 4;
}

message RoundTakes {
  string country_id = 1;
  uint64 tiles = 2;
}

message GetScoresRequest {
  string book_id = 1;
}

message GetScoresResponse {
  Scores scores = 1;
}

message Scores {
  string book_id = 1;
  // Best first, every country with points.
  repeated Score scores = 2;
}

message Score {
  uint32 rank = 1;
  string country_id = 2;
  uint32 points = 3;
  uint32 rounds_won = 4;
}

// A closed book's place: the tiebreak too.
message TablePlace {
  string country_id = 1;
  uint32 rank = 2;
  uint32 points = 3;
  uint32 rounds_won = 4;
  uint32 tiebreak_points = 5;
}

message ListenForEventsRequest {
  string book_id = 1;
  string country_id = 2;
  repeated string round_ids = 3;
}

message ScoringEvent {
  oneof event {
    Board board = 1;
    Heartbeat heartbeat = 2;
    Scores scores = 3;
    Round round = 4;
  }
}

message Board {
  string book_id = 1;
  repeated Standing standings = 2;
}

message Heartbeat {}
