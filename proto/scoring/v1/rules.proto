syntax = "proto3";

package scoring.v1;

// Every value of a season rule set, all written: none falls back to another set or to a default. Postgres keeps it as
// protojson (scoring.rule_sets.rules).
message Rules {
  OwnRoundRules own_round = 1;
}

// While the set plays, the window of the schedule entry that plays it is a round of its own: scored from the map at
// its end, as a day is, and worth `times` times a day's points.
message OwnRoundRules {
  bool enabled = 1;
  // How many times a day's points the round scores, 1 to 10. Written when the round is off too.
  uint32 times = 2;
}
