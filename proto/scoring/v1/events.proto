syntax = "proto3";

package scoring.v1;

import "google/protobuf/timestamp.proto";

// A round was scored.
message RoundScored {
  string round_id = 1;
  string book_id = 2;
  google.protobuf.Timestamp ended_at = 3;
  reserved 4;
  reserved "results";
}

// A book was closed.
message BookClosed {
  string book_id = 1;
  google.protobuf.Timestamp ended_at = 2;
  reserved 3;
  reserved "table";
}
