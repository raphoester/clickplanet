syntax = "proto3";

package support.v1;

service SupportService {
  rpc SuggestFeature(SuggestFeatureRequest) returns (SuggestFeatureResponse);

  rpc ReportBug(ReportBugRequest) returns (ReportBugResponse);

  rpc GetAttachmentRules(GetAttachmentRulesRequest) returns (GetAttachmentRulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message SuggestFeatureRequest {
  string text = 1;
  PageContext context = 2;
  repeated Attachment attachments = 3;
}

message SuggestFeatureResponse {
  // One per attachment of the request, in its order.
  repeated Upload uploads = 1;
}

message ReportBugRequest {
  string text = 1;
  PageContext context = 2;
  repeated Attachment attachments = 3;
}

message ReportBugResponse {
  // One per attachment of the request, in its order.
  repeated Upload uploads = 1;
}

// A photo or a video the page uploads once its note is kept.
message Attachment {
  string content_type = 1;
  uint64 size_bytes = 2;
}

message Upload {
  // Takes one PUT of the file, with the Content-Type and the size the attachment was declared with.
  string url = 1;
}

message GetAttachmentRulesRequest {}

message GetAttachmentRulesResponse {
  // 0: this server takes no attachment.
  uint32 max_per_note = 1;
  uint64 max_bytes = 2;
  repeated string content_types = 3;
}

// What the page knows about itself and its device when a note is sent. The server adds the user agent.
message PageContext {
  // The bundle the page runs.
  string build = 1;
  uint32 viewport_width = 2;
  uint32 viewport_height = 3;
  // The page had lost the server when the note was written.
  bool connection_down = 4;
  // Device pixels per CSS pixel.
  double pixel_ratio = 5;
  // The graphics card as WebGL names it; a page cannot read chrome://gpu.
  string gpu_vendor = 6;
  string gpu_renderer = 7;
  string webgl_version = 8;
  uint32 max_texture_size = 9;
  // The globe had lost its WebGL context when the note was written.
  bool context_lost = 10;
  // Logical processors, as the browser reports them.
  uint32 cores = 11;
  // Device memory in GiB, as the browser reports it; 0 where it does not.
  double memory_gb = 12;
}
