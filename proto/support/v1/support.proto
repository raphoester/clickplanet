syntax = "proto3";

package support.v1;

service SupportService {
  rpc SuggestFeature(SuggestFeatureRequest) returns (SuggestFeatureResponse);

  rpc ReportBug(ReportBugRequest) returns (ReportBugResponse);

  rpc ReportPlayer(ReportPlayerRequest) returns (ReportPlayerResponse);

  // A drawing on the map, by a tile of it: the operator reads it and may put the area back as it was.
  rpc ReportPlace(ReportPlaceRequest) returns (ReportPlaceResponse);

  rpc GetAttachmentRules(GetAttachmentRulesRequest) returns (GetAttachmentRulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);
}

message SuggestFeatureRequest {
  string text = 1;
  PageContext context = 2;
  // Each one from CreateUpload, and uploaded before the note is sent.
  repeated string attachment_ids = 3;
}

message SuggestFeatureResponse {}

message ReportBugRequest {
  string text = 1;
  PageContext context = 2;
  // Each one from CreateUpload, and uploaded before the note is sent.
  repeated string attachment_ids = 3;
}

message ReportBugResponse {}

message CreateUploadRequest {
  string content_type = 1;
  uint64 size_bytes = 2;
}

message CreateUploadResponse {
  // What a note names the file by.
  string attachment_id = 1;
  // Takes one PUT of the file, with the Content-Type and the size the request declared.
  string url = 2;
}

message GetAttachmentRulesRequest {}

message GetAttachmentRulesResponse {
  // 0: this server takes no attachment.
  uint32 max_per_note = 1;
  uint64 max_bytes = 2;
  repeated string content_types = 3;
}

// What the page knows about itself and its device when a note is sent. The server adds the user agent.
message PageContext {
  // The bundle the page runs.
  string build = 1;
  uint32 viewport_width = 2;
  uint32 viewport_height = 3;
  // The page had lost the server when the note was written.
  bool connection_down = 4;
  // Device pixels per CSS pixel.
  double pixel_ratio = 5;
  // The graphics card as WebGL names it; a page cannot read chrome://gpu.
  string gpu_vendor = 6;
  string gpu_renderer = 7;
  string webgl_version = 8;
  uint32 max_texture_size = 9;
  // The globe had lost its WebGL context when the note was written.
  bool context_lost = 10;
  // Logical processors, as the browser reports them.
  uint32 cores = 11;
  // Device memory in GiB, as the browser reports it; 0 where it does not.
  double memory_gb = 12;
}

enum ReportReason {
  REPORT_REASON_UNSPECIFIED = 0;
  REPORT_REASON_CHEATING = 1;
  REPORT_REASON_CHAT_ABUSE = 2;
  REPORT_REASON_BAD_NAME = 3;
  REPORT_REASON_OTHER = 4;
}

message ReportPlayerRequest {
  reserved 1;
  reserved "name";
  ReportReason reason = 2;
  // Optional.
  string text = 3;
  // Optional: the chat message the report is about.
  string message_id = 4;
  // The account reported, as a chat message, a roster line or a standing carries it.
  string account_id = 5;
}

message ReportPlayerResponse {}

enum PlaceReportReason {
  PLACE_REPORT_REASON_UNSPECIFIED = 0;
  // A hateful symbol or hateful words.
  PLACE_REPORT_REASON_HATE = 1;
  PLACE_REPORT_REASON_SEXUAL = 2;
  PLACE_REPORT_REASON_OTHER = 3;
}

message ReportPlaceRequest {
  // A tile of the drawing, the one the reporter picked.
  uint32 tile_id = 1;
  PlaceReportReason reason = 2;
  // Optional.
  string text = 3;
}

message ReportPlaceResponse {}
