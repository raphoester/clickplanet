syntax = "proto3";

package support.v1;

service SupportService {
  rpc SuggestFeature(SuggestFeatureRequest) returns (SuggestFeatureResponse);

  rpc ReportBug(ReportBugRequest) returns (ReportBugResponse);

  rpc ReportPlayer(ReportPlayerRequest) returns (ReportPlayerResponse);
}

message SuggestFeatureRequest {
  string text = 1;
}

message SuggestFeatureResponse {}

message ReportBugRequest {
  string text = 1;
  BugContext context = 2;
}

message ReportBugResponse {}

// What the page knows about itself when a bug is reported. The server adds the user agent.
message BugContext {
  // The bundle the page runs.
  string build = 1;
  uint32 viewport_width = 2;
  uint32 viewport_height = 3;
  // The page had lost the server when the report was written.
  bool connection_down = 4;
}

enum ReportReason {
  REPORT_REASON_UNSPECIFIED = 0;
  REPORT_REASON_CHEATING = 1;
  REPORT_REASON_CHAT_ABUSE = 2;
  REPORT_REASON_BAD_NAME = 3;
  REPORT_REASON_OTHER = 4;
}

message ReportPlayerRequest {
  // The name the game shows for the player: its username, or guest_ and its guest code.
  string name = 1;
  ReportReason reason = 2;
  // Optional.
  string text = 3;
  // Optional: the chat message the report is about.
  string message_id = 4;
}

message ReportPlayerResponse {}
