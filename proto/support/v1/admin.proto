syntax = "proto3";

package support.v1;

import "google/protobuf/timestamp.proto";
import "support/v1/support.proto";

// No authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the public router.
service AdminService {
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);

  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);

  // Closes a report with what the operator did about it. A report decided again keeps the last decision. NotFound for a report no longer kept.
  rpc DecideReport(DecideReportRequest) returns (DecideReportResponse);
}

enum NoteKind {
  NOTE_KIND_UNSPECIFIED = 0;
  NOTE_KIND_SUGGESTION = 1;
  NOTE_KIND_BUG = 2;
}

message ListNotesRequest {
  // Unset is every note kept.
  google.protobuf.Timestamp since = 1;
  // Unset is 100; at most 500.
  uint32 limit = 2;
  // Unset is every kind.
  NoteKind kind = 3;
}

message ListNotesResponse {
  repeated Note notes = 1;
}

message Note {
  string id = 1;
  NoteKind kind = 2;
  // Empty once the note is anonymized: its account was deleted, or the note is past the retention.
  string account_id = 3;
  string text = 4;
  google.protobuf.Timestamp submitted_at = 5;
  // What the page said of itself. Every note has one; a note sent before they were kept has an empty one.
  PageContext context = 6;
  string user_agent = 7;
}

message ListReportsRequest {
  // Unset is every report kept.
  google.protobuf.Timestamp since = 1;
  // Unset is 100; at most 500.
  uint32 limit = 2;
  // Only the reports nobody decided yet.
  bool open_only = 3;
}

message ListReportsResponse {
  repeated Report reports = 1;
}

message Report {
  string id = 1;
  string reporter_account_id = 2;
  string reported_account_id = 3;
  ReportReason reason = 4;
  string text = 5;
  string message_id = 6;
  google.protobuf.Timestamp created_at = 7;
  // The name the game shows for each account now; empty for one it can no longer name.
  string reporter_name = 8;
  string reported_name = 9;
  // Unset while the report is open.
  ReportDecision decision = 10;
}

enum ReportOutcome {
  REPORT_OUTCOME_UNSPECIFIED = 0;
  // The operator acted: a message removed, a mute or a ban.
  REPORT_OUTCOME_ACTED = 1;
  // Nothing to act on.
  REPORT_OUTCOME_DISMISSED = 2;
}

message ReportDecision {
  ReportOutcome outcome = 1;
  // Optional: why, in the operator's words.
  string comment = 2;
  google.protobuf.Timestamp decided_at = 3;
}

message DecideReportRequest {
  string report_id = 1;
  ReportOutcome outcome = 2;
  // Optional: why, in the operator's words.
  string comment = 3;
}

message DecideReportResponse {
  google.protobuf.Timestamp decided_at = 1;
}
