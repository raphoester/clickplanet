syntax = "proto3";

package antibot.v1;

import "antibot/v1/rules.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// The operator's bans and the rules the antibot judges with. No authentication of its own: served on the console listener, and on the admin listener behind
// its gate. Never the public router. Each message reads on the wire as the planet.v1 one of the same name, which
// served these calls until the antibot was a module of its own.
service AdminService {
  // A shadow ban: the caller's clicks and bombs are answered OK and dropped, so it learns nothing. Takes a scope or
  // an account_id, never both; an account is banned alone, a scope bans everybody behind it. It counts as an offence,
  // and an unset duration takes the next step of the ladder. Ban before planet's RevertPlayer, or the player repaints
  // behind the revert.
  rpc BanPlayer(BanPlayerRequest) returns (BanPlayerResponse);

  // Lifts a caller's latest ban, for a false positive, and forgets that offence. The evidence stays: a watchdog that
  // still reads certain bans the caller again on its next click, so fix the rule that misfired first. A guest the jury
  // banned is banned on its account and its scope: two calls. NotFound when no offence is left.
  rpc UnbanPlayer(UnbanPlayerRequest) returns (UnbanPlayerResponse);

  // What the antibot holds on one caller now, and how close it is to a ban: any running ban, each watchdog's level
  // and evidence, the suspects against how many make a ban, and whether the jury would ban on a click now. An account
  // is read on the scope of its latest take.
  rpc InspectPlayer(InspectPlayerRequest) returns (InspectPlayerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Every rule set the antibot keeps, and the one it judges with now. SaveRuleSet changes one.
  rpc GetRules(GetRulesRequest) returns (GetRulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Makes a set, or replaces its values. A save of the set that plays now takes over at once.
  rpc SaveRuleSet(SaveRuleSetRequest) returns (SaveRuleSetResponse);
}

message GetRulesRequest {}

message GetRulesResponse {
  // Every set postgres keeps, "default" first.
  repeated RuleSet sets = 1;
  // The set the antibot judges with now: the one the schedule played last, or "default".
  string playing = 2;
}

message RuleSet {
  string name = 1;
  Rules rules = 2;
}

message SaveRuleSetRequest {
  RuleSet set = 1;
}

message SaveRuleSetResponse {}

message BanPlayerRequest {
  // An address, banned as its scope. Never with account_id.
  string scope = 1;
  // Never with scope.
  string account_id = 3;
  // Unset is the ladder's step for this offence.
  google.protobuf.Duration duration = 2;
}

message BanPlayerResponse {
  string scope = 1;
  string account_id = 5;
  uint32 offence = 2;
  google.protobuf.Timestamp banned_until = 3;
  bool enforced = 4;
}

message UnbanPlayerRequest {
  // An address, read as its scope. Never with account_id.
  string scope = 1;
  // Never with scope.
  string account_id = 2;
}

// The ban that was lifted. Its offence no longer counts.
message UnbanPlayerResponse {
  string scope = 1;
  string account_id = 2;
  uint32 offence = 3;
  google.protobuf.Timestamp banned_until = 4;
  google.protobuf.Timestamp pardoned_until = 5;
}

message InspectPlayerRequest {
  // An address, read as its scope. Never with account_id.
  string scope = 1;
  // Never with scope.
  string account_id = 2;
}

message InspectPlayerResponse {
  string scope = 1;
  string account_id = 17;

  optional bool tracked = 2;

  optional bool banned = 3;
  google.protobuf.Timestamp banned_until = 4;
  uint32 offence = 5;
  uint32 flags = 6;
  google.protobuf.Timestamp pardoned_until = 18;

  repeated WatchdogReading readings = 7;

  uint32 suspects = 8;
  uint32 min_suspects = 9;
  optional bool guilty = 10;

  uint32 clicks = 11;
  google.protobuf.Duration active_for = 12;
  google.protobuf.Duration longest_gap = 13;
  google.protobuf.Timestamp last_click_at = 14;
  string top_country = 15;
  uint32 top_country_clicks = 16;
}

message WatchdogReading {
  string watchdog = 1;
  string level = 2;
  string evidence = 3;
  google.protobuf.Timestamp at = 4;
}
