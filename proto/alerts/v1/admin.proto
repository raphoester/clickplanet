syntax = "proto3";

package alerts.v1;

// The operator's view of a player's Discord link.
service AdminService {
  rpc GetPlayerLink(GetPlayerLinkRequest) returns (GetPlayerLinkResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Forgets the link and takes the flag's role off the Discord user, who stays in the server: the game offers that
  // account to connect Discord again, and its next Discord sign-in joins it again.
  rpc UnlinkPlayer(UnlinkPlayerRequest) returns (UnlinkPlayerResponse);

  // Links every account signed in with Discord that has no link and whose Discord user is in the server already: it
  // joined by the invite, or signed in before the sign-in asked to join. The bot grants it its flag's role. A user not
  // in the server is left as it is: only its own Discord sign-in can add it. A second run links nobody twice.
  rpc LinkMembers(LinkMembersRequest) returns (LinkMembersResponse);
}

message GetPlayerLinkRequest {
  string account_id = 1;
}

message GetPlayerLinkResponse {
  // Unset: the account is not linked.
  DiscordLink link = 1;
}

message DiscordLink {
  string discord_user_id = 1;
  // The flag whose role the user holds, empty when the account never pledged one.
  string country_id = 2;
  int64 linked_at_unix_ms = 3;
}

message UnlinkPlayerRequest {
  string account_id = 1;
}

message UnlinkPlayerResponse {
  // False: the account was not linked, and nothing changed.
  bool unlinked = 1;
}

message LinkMembersRequest {}

message LinkMembersResponse {
  // In the server, and linked now with its flag's role.
  uint32 linked = 1;
  // Not in the server: the game offers them to join Discord, and their own sign-in joins them.
  uint32 outside = 2;
  // Discord or the game could not be asked: a run again tries them again.
  uint32 failed = 3;
}
