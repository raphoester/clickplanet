syntax = "proto3";

package auth.v1;

service AuthService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  rpc GetMe(GetMeRequest) returns (GetMeResponse);

  rpc GetSignInOptions(GetSignInOptionsRequest) returns (GetSignInOptionsResponse);

  rpc StartSignIn(StartSignInRequest) returns (StartSignInResponse);

  rpc CompleteSignIn(CompleteSignInRequest) returns (CompleteSignInResponse);

  // Answers the same whether or not the address has an account.
  rpc StartEmailSignIn(StartEmailSignInRequest) returns (StartEmailSignInResponse);

  rpc CompleteEmailSignIn(CompleteEmailSignInRequest) returns (CompleteEmailSignInResponse);

  rpc SignOut(SignOutRequest) returns (SignOutResponse);

  rpc SignOutEverywhere(SignOutEverywhereRequest) returns (SignOutEverywhereResponse);

  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
}

message CreateSessionRequest {
  string attestation_token = 1;
}

message CreateSessionResponse {
  string token = 1;

  int64 expires_at_unix_ms = 2;
}

message GetMeRequest {}

message GetMeResponse {
  string account_id = 1;

  AccountKind kind = 2;

  repeated Provider providers = 3;
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_GOOGLE = 1;
  PROVIDER_DISCORD = 2;
  PROVIDER_EMAIL = 3;
}

enum AccountKind {
  ACCOUNT_KIND_UNSPECIFIED = 0;
  ACCOUNT_KIND_GUEST = 1;
  ACCOUNT_KIND_LINKED = 2;
}

message GetSignInOptionsRequest {}

message GetSignInOptionsResponse {
  repeated Provider providers = 1;
}

message StartSignInRequest {
  Provider provider = 1;

  SignInIntent intent = 2;
}

enum SignInIntent {
  SIGN_IN_INTENT_UNSPECIFIED = 0;
  SIGN_IN_INTENT_SIGN_IN = 1;
  SIGN_IN_INTENT_LINK = 2;
}

message StartSignInResponse {
  string authorization_url = 1;
}

message CompleteSignInRequest {
  string code = 1;
  string state = 2;
}

enum SignInOutcome {
  SIGN_IN_OUTCOME_UNSPECIFIED = 0;
  SIGN_IN_OUTCOME_SIGNED_IN = 1;
  SIGN_IN_OUTCOME_LINKED = 2;
  SIGN_IN_OUTCOME_CREATED = 3;
}

message CompleteSignInResponse {
  string account_id = 1;

  SignInOutcome outcome = 2;
}

message LinkRefusal {
  LinkRefusalReason reason = 1;
}

enum LinkRefusalReason {
  LINK_REFUSAL_REASON_UNSPECIFIED = 0;
  LINK_REFUSAL_REASON_IDENTITY_LINKED_ELSEWHERE = 1;
  LINK_REFUSAL_REASON_PROVIDER_ALREADY_LINKED = 2;
}

message StartEmailSignInRequest {
  string email = 1;

  SignInIntent intent = 2;

  string attestation_token = 3;
}

message StartEmailSignInResponse {}

message CompleteEmailSignInRequest {
  string code = 1;
}

message CompleteEmailSignInResponse {
  string account_id = 1;

  SignInOutcome outcome = 2;
}

message EmailRefusal {
  EmailRefusalReason reason = 1;
}

enum EmailRefusalReason {
  EMAIL_REFUSAL_REASON_UNSPECIFIED = 0;
  EMAIL_REFUSAL_REASON_INVALID = 1;
  EMAIL_REFUSAL_REASON_DISPOSABLE = 2;
}

message SignOutRequest {}

message SignOutResponse {}

message SignOutEverywhereRequest {}

message SignOutEverywhereResponse {}

message DeleteAccountRequest {}

message DeleteAccountResponse {}
