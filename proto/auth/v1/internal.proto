syntax = "proto3";

package auth.v1;

service InternalService {
  rpc GetVerifyingKey(GetVerifyingKeyRequest) returns (GetVerifyingKeyResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);

  rpc GetAccounts(GetAccountsRequest) returns (GetAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Not NO_SIDE_EFFECTS: a GET would put the session cookie in the URL.
  rpc GetCaller(GetCallerRequest) returns (GetCallerResponse);
}

message GetCallerRequest {
  string cookie = 1;
}

message GetCallerResponse {
  string account_id = 1;
}

message GetVerifyingKeyRequest {}

message GetVerifyingKeyResponse {
  string public_key = 1;
}

message GetAccountRequest {
  string account_id = 1;
}

message GetAccountResponse {
  bool linked = 1;
  int64 created_at_unix_ms = 2;
}

message GetAccountsRequest {
  repeated string account_ids = 1;
}

message GetAccountsResponse {
  repeated Account accounts = 1;
}

message Account {
  string account_id = 1;
  bool linked = 2;
  int64 created_at_unix_ms = 3;
}
