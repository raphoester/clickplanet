syntax = "proto3";

package auth.v1;

// What other modules of the backend ask the auth module. Served only on the
// backend's loopback internal listener (httpServer.internalBindAddress), never
// on the public router: a caller here is trusted to pass a browser's cookie on.
service InternalService {
  // The account a browser's cookie belongs to, extending its session when due.
  // With create set, a caller whose cookie gives no account gets a new guest.
  rpc ResolveAccount(ResolveAccountRequest) returns (ResolveAccountResponse);
}

message ResolveAccountRequest {
  // The Cookie header the browser sent, as is. Only the auth module reads it.
  string cookie_header = 1;

  bool create = 2;
}

message ResolveAccountResponse {
  // Empty when the cookie gives no account and none was created.
  string account_id = 1;

  // A Set-Cookie header value to send back to the browser as is. Empty when
  // there is nothing to set.
  string set_cookie = 2;
}
