syntax = "proto3";

package auth.v1;

service InternalService {
  rpc GetVerifyingKey(GetVerifyingKeyRequest) returns (GetVerifyingKeyResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);

  rpc GetAccounts(GetAccountsRequest) returns (GetAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Unauthenticated with no live session in the cookie, PermissionDenied for an account that does not operate.
  rpc GetOperator(GetOperatorRequest) returns (GetOperatorResponse);

  // Whose an access token is, for the admin gate and the connector. Unauthenticated for a token nobody holds or past
  // its lifetime, PermissionDenied for an account that does not operate.
  rpc GetTokenOperator(GetTokenOperatorRequest) returns (GetTokenOperatorResponse);
}

message GetVerifyingKeyRequest {}

message GetVerifyingKeyResponse {
  string public_key = 1;
}

message GetAccountRequest {
  string account_id = 1;
}

message GetAccountResponse {
  bool linked = 1;
  int64 created_at_unix_ms = 2;
}

message GetAccountsRequest {
  repeated string account_ids = 1;
}

message GetAccountsResponse {
  repeated Account accounts = 1;
}

message Account {
  string account_id = 1;
  bool linked = 2;
  int64 created_at_unix_ms = 3;
}

message GetOperatorRequest {
  string cookie = 1;
}

message GetOperatorResponse {
  string account_id = 1;
}

message GetTokenOperatorRequest {
  // As the caller sent it, after "Bearer ".
  string token = 1;
}

message GetTokenOperatorResponse {
  string account_id = 1;
  // The app the token was issued to, as it named itself.
  string client = 2;
}
