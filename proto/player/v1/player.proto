syntax = "proto3";

package player.v1;

import "player/v1/color.proto";

service PlayerService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc SetName(SetNameRequest) returns (SetNameResponse);
  rpc SetColor(SetColorRequest) returns (SetColorResponse);

  rpc Announce(AnnounceRequest) returns (AnnounceResponse);

  rpc Leave(LeaveRequest) returns (LeaveResponse);

  rpc GetRoster(GetRosterRequest) returns (GetRosterResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListenForEvents(ListenForEventsRequest) returns (stream PlayerEvent);

  // Who a player is on its public card. Its stats, titles and fronts are progression.v1's GetProgress.
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message Profile {
  string account_id = 1;
  string name = 2;
  int64 renamable_at_unix_ms = 3;
}

message GetProfileRequest {}

message GetProfileResponse {
  Profile profile = 1;
  NameColor color = 2;
}

message SetNameRequest {
  string name = 1;
}

message SetNameResponse {
  Profile profile = 1;
}

message RenameRefusal {
  int64 renamable_at_unix_ms = 1;
}

message SetColorRequest {
  NameColor color = 1;
}

message SetColorResponse {
  NameColor color = 1;
}

message AnnounceRequest {
  string country_id = 1;
  reserved 2;
  reserved "guest_name";
}

message AnnounceResponse {}

message LeaveRequest {}

message LeaveResponse {}

message GetRosterRequest {}

message GetRosterResponse {
  repeated RosterEntry entries = 1;
}

message RosterEntry {
  string name = 1;
  reserved 2;
  reserved "tag";
  string country_id = 3;
  bool guest = 4;
  bool admin = 5;
  string key = 6;
  NameColor color = 7;
  // The line's badges are GetBadges', by account_id.
  reserved 8, 9;
  reserved "streak", "worn_title";
  string account_id = 10;
}

message ListenForEventsRequest {}

message PlayerEvent {
  oneof event {
    Roster roster = 1;
    RosterEntry entry = 2;
    PlayerLeft left = 3;
    Heartbeat heartbeat = 4;
  }
  // The titles earned are progression.v1's ListenForEvents.
  reserved 5;
  reserved "title_earned";
}

message Roster {
  repeated RosterEntry entries = 1;
}

message PlayerLeft {
  string key = 1;
}

message Heartbeat {}

message GetPlayerRequest {
  reserved 1;
  reserved "name";
  string account_id = 2;
}

message GetPlayerResponse {
  Player player = 1;
}

message Player {
  string name = 1;
  int64 created_at_unix_ms = 3;
  bool admin = 4;
  NameColor color = 5;
  // A player's stats, titles and fronts are progression.v1's GetProgress.
  reserved 2, 6, 7, 8, 9;
  reserved "stats", "titles", "worn_title", "plays_for", "plays_against";
  // A guest is its name alone: every other field is unset.
  bool guest = 10;
}
