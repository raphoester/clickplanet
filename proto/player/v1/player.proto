syntax = "proto3";

package player.v1;

import "planet/v1/planet.proto";
import "player/v1/color.proto";
import "player/v1/title.proto";

service PlayerService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc SetName(SetNameRequest) returns (SetNameResponse);
  rpc SetColor(SetColorRequest) returns (SetColorResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);

  rpc Announce(AnnounceRequest) returns (AnnounceResponse);

  rpc Leave(LeaveRequest) returns (LeaveResponse);

  rpc GetRoster(GetRosterRequest) returns (GetRosterResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListenForEvents(ListenForEventsRequest) returns (stream PlayerEvent);

  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetTitles(GetTitlesRequest) returns (GetTitlesResponse);

  rpc WearTitle(WearTitleRequest) returns (WearTitleResponse);

  rpc GetFronts(GetFrontsRequest) returns (GetFrontsResponse);

  rpc GetMissions(GetMissionsRequest) returns (GetMissionsResponse);

  // A guest is refused: it signs in to collect what it did.
  rpc CollectMission(CollectMissionRequest) returns (CollectMissionResponse);
}

message Profile {
  string account_id = 1;
  string name = 2;
  int64 renamable_at_unix_ms = 3;
}

message GetProfileRequest {}

message GetProfileResponse {
  Profile profile = 1;
  NameColor color = 2;
}

message SetNameRequest {
  string name = 1;
}

message SetNameResponse {
  Profile profile = 1;
}

message RenameRefusal {
  int64 renamable_at_unix_ms = 1;
}

message SetColorRequest {
  NameColor color = 1;
}

message SetColorResponse {
  NameColor color = 1;
}

message Stats {
  uint64 tiles_taken = 1;
  uint32 streak_current = 2;
  uint32 streak_best = 3;
  string streak_last_day = 4;
}

message GetStatsRequest {}

message GetStatsResponse {
  Stats stats = 1;
}

message AnnounceRequest {
  string country_id = 1;
  reserved 2;
  reserved "guest_name";
}

message AnnounceResponse {}

message LeaveRequest {}

message LeaveResponse {}

message GetRosterRequest {}

message GetRosterResponse {
  repeated RosterEntry entries = 1;
}

message RosterEntry {
  string name = 1;
  reserved 2;
  reserved "tag";
  string country_id = 3;
  bool guest = 4;
  bool admin = 5;
  string key = 6;
  NameColor color = 7;
  uint32 streak = 8;
  Title worn_title = 9;
  string account_id = 10;
}

message ListenForEventsRequest {}

message PlayerEvent {
  oneof event {
    Roster roster = 1;
    RosterEntry entry = 2;
    PlayerLeft left = 3;
    Heartbeat heartbeat = 4;
    TitleEarned title_earned = 5;
  }
}

message Roster {
  repeated RosterEntry entries = 1;
}

message PlayerLeft {
  string key = 1;
}

message Heartbeat {}

message GetPlayerRequest {
  reserved 1;
  reserved "name";
  string account_id = 2;
}

message GetPlayerResponse {
  Player player = 1;
}

message Player {
  string name = 1;
  Stats stats = 2;
  int64 created_at_unix_ms = 3;
  bool admin = 4;
  NameColor color = 5;
  repeated Title titles = 6;
  Title worn_title = 7;
  repeated CountryTiles plays_for = 8;
  repeated CountryTiles plays_against = 9;
}

message CountryTiles {
  string country_id = 1;
  uint64 tiles = 2;
}

message GetFrontsRequest {}

message GetFrontsResponse {
  repeated CountryTiles plays_for = 1;
  repeated CountryTiles plays_against = 2;
}

message TitleEarned {
  Title title = 1;
}

message GetTitlesRequest {}

message GetTitlesResponse {
  Title worn = 1;
  repeated Title wearable = 2;
  repeated Track tracks = 3;
}

message Track {
  string id = 1;
  string name = 2;
  uint64 progress = 3;
  repeated Step steps = 4;
}

message Step {
  Title title = 1;
  uint64 threshold = 2;
  bool earned = 3;
}

message WearTitleRequest {
  string title_id = 1;
}

message WearTitleResponse {
  Title worn = 1;
}

message GetMissionsRequest {
  string country_id = 1;
}

// The day's missions are for the flag of the day's first take, and for country_id until then.
message GetMissionsResponse {
  string country_id = 1;
  bool enlisted = 2;
  int64 ends_at_unix_ms = 3;
  repeated Mission missions = 4;
}

message Mission {
  uint32 slot = 1;
  MissionKind kind = 2;
  string target_country_id = 3;
  uint32 goal = 4;
  uint32 progress = 5;
  bool collected = 6;
  planet.v1.BonusKind reward_kind = 7;
  uint32 reward_amount = 8;
}

enum MissionKind {
  MISSION_KIND_UNSPECIFIED = 0;

  // Take goal tiles for target_country_id, the day's flag.
  MISSION_KIND_TAKE_FOR = 1;

  // Take goal tiles that target_country_id held.
  MISSION_KIND_TAKE_FROM = 2;

  // Take goal tiles on target_country_id's ground.
  MISSION_KIND_TAKE_IN = 3;
}

message CollectMissionRequest {
  uint32 slot = 1;
}

message CollectMissionResponse {
  planet.v1.BonusKind kind = 1;
  uint32 amount = 2;
}
