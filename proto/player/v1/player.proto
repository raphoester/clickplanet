syntax = "proto3";

package player.v1;

// A player's profile and stats, and who is playing. Every procedure but
// GetRoster answers for the caller: the account named by the click token in the
// X-Session-Token header. A call with no valid token, or a token with no
// account, is Unauthenticated.
service PlayerService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // Chooses the caller's username: 3 to 20 characters, each an ASCII letter, a
  // digit or an underscore, and not starting with "guest_" in any case — the
  // chat puts that before every guest's name. A name that breaks a rule is
  // InvalidArgument. Usernames are unique ignoring case: one another account
  // holds is AlreadyExists. Only an account signed in with a provider may
  // choose one; a guest is PermissionDenied.
  rpc SetName(SetNameRequest) returns (SetNameResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);

  // Says the caller is playing, under which flag. A client sends it when it
  // gets a click token, when its flag or name changes, and every 30s after. A
  // player that stops sending leaves the roster 90s after its last call. A
  // country that is not one is InvalidArgument.
  rpc Announce(AnnounceRequest) returns (AnnounceResponse);

  // Everyone playing. It needs no token, and a proxy may serve it for 5s.
  rpc GetRoster(GetRosterRequest) returns (GetRosterResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // What anybody may know about a player with a username. Needs no token.
  // A name no account holds is not_found, and so is a guest: it has no name.
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message Profile {
  string account_id = 1;
  // The username, as it was typed. Empty while the player has not chosen one.
  string name = 2;
}

message GetProfileRequest {}

message GetProfileResponse {
  Profile profile = 1;
}

message SetNameRequest {
  string name = 1;
}

message SetNameResponse {
  Profile profile = 1;
}

message Stats {
  // Every tile the account took: clicks, spreads and encloses.
  uint64 tiles_taken = 1;
  // Days in a row, UTC, with at least one take, the last of them today or
  // yesterday. Zero once a whole day went by with no take.
  uint32 streak_current = 2;
  uint32 streak_best = 3;
  // The last UTC day with a take, as YYYY-MM-DD. Empty with no take.
  string streak_last_day = 4;
}

message GetStatsRequest {}

message GetStatsResponse {
  Stats stats = 1;
}

message AnnounceRequest {
  string country_id = 1;
  // The name a guest typed in the chat. Not read for an account with a
  // username. Empty, or one the server refuses, shows the guest as "guest_" and
  // its tag.
  string guest_name = 2;
}

message AnnounceResponse {}

message GetRosterRequest {}

message GetRosterResponse {
  // Players with a username first, then guests; each group by name, ignoring
  // case.
  repeated RosterEntry entries = 1;
}

message RosterEntry {
  // A username, or "guest_" and the name a guest typed or its tag.
  string name = 1;
  // As on a chat message: a salted hash of the address the player last
  // announced from.
  string tag = 2;
  // The flag the player last announced.
  string country_id = 3;
  bool guest = 4;
  // An admin of the game. Never a guest.
  bool admin = 5;
}

message GetPlayerRequest {
  // A username, in any case.
  string name = 1;
}

message GetPlayerResponse {
  Player player = 1;
}

message Player {
  // The username as its player typed it.
  string name = 1;
  // As of today: a streak that ended before yesterday reads 0.
  Stats stats = 2;
  // When the account was made, as a guest or by a first sign-in.
  int64 created_at_unix_ms = 3;
  // An admin of the game.
  bool admin = 4;
}
