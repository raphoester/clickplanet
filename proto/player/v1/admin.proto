syntax = "proto3";

package player.v1;

import "player/v1/color.proto";
import "player/v1/internal.proto";
import "player/v1/player.proto";
import "player/v1/title.proto";

// No authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the public router.
service AdminService {
  rpc ReconcileTitles(ReconcileTitlesRequest) returns (ReconcileTitlesResponse);

  // Every account's bombs dropped and tiles fortified, set to what planet's ledger holds. Harmless twice.
  rpc RecountStats(RecountStatsRequest) returns (RecountStatsResponse);

  // InternalService/GetAuthors, for the admin page naming a page of players.
  rpc GetAuthors(GetAuthorsRequest) returns (GetAuthorsResponse);

  // Everything the game keeps about one account, a guest's too. NotFound for an account it keeps nothing about.
  rpc GetPlayer(AdminGetPlayerRequest) returns (AdminGetPlayerResponse);

  // PlayerService/GetRoster, for the admin page's home: who is playing now.
  rpc GetRoster(GetRosterRequest) returns (GetRosterResponse);

  // Every account whose username, or guest code until it chooses one, holds the name typed, in any case. InvalidArgument for an empty name.
  rpc SearchPlayers(SearchPlayersRequest) returns (SearchPlayersResponse);
}

message ReconcileTitlesRequest {}

message ReconcileTitlesResponse {
  uint32 granted = 1;
  uint32 revoked = 2;
}

message RecountStatsRequest {}

message RecountStatsResponse {
  uint32 recounted = 1;
}

message SearchPlayersRequest {
  string name = 1;
  uint32 limit = 2;
}

message SearchPlayersResponse {
  repeated PlayerMatch players = 1;
  uint32 total = 2;
}

message PlayerMatch {
  string account_id = 1;
  string name = 2;
  bool guest = 3;
}

message AdminGetPlayerRequest {
  string account_id = 1;
}

message AdminGetPlayerResponse {
  string name = 1;
  bool guest = 2;
  bool linked = 3;
  bool admin = 4;
  NameColor color = 5;
  int64 created_at_unix_ms = 6;
  Stats stats = 7;
  uint64 messages_sent = 8;
  repeated Title titles = 9;
  Title worn_title = 10;
  repeated CountryTiles plays_for = 11;
  repeated CountryTiles plays_against = 12;
}
