syntax = "proto3";

package player.v1;

import "google/protobuf/timestamp.proto";
import "player/v1/color.proto";
import "player/v1/internal.proto";
import "player/v1/player.proto";

// No authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the public router.
service AdminService {
  // InternalService/GetPlayers, for the admin page naming a page of players.
  rpc GetPlayers(GetPlayersRequest) returns (GetPlayersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Who one account is, a guest's too. NotFound for an account with no name and no guest code. Its stats, titles and
  // fronts are progression.v1.AdminService/GetProgress.
  rpc GetPlayer(AdminGetPlayerRequest) returns (AdminGetPlayerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // PlayerService/GetRoster, for the admin page's home: who is playing now.
  rpc GetRoster(GetRosterRequest) returns (GetRosterResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Every account whose username, or guest code until it chooses one, holds the name typed, in any case. InvalidArgument for an empty name.
  rpc SearchPlayers(SearchPlayersRequest) returns (SearchPlayersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Changes an account's username under SetName's rules, during its wait too. Not the player's choice: its next SetName goes at once. NotFound for an account with no username.
  rpc RenamePlayer(RenamePlayerRequest) returns (RenamePlayerResponse);

  // Every rename an operator made, with the old and the new name, the reason given and who made it, newest first.
  // Kept for its own retention (90 days), and forgotten with the account. One account's, or every account's. The
  // chat's mutes and removals are chat.v1.AdminService/ListModeration.
  rpc ListRenames(ListRenamesRequest) returns (ListRenamesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message RenamePlayerRequest {
  string account_id = 1;
  string name = 2;
  // Why, in a few words, kept with the rename (ListRenames). Optional; 500 characters at most.
  string reason = 3;
}

message ListRenamesRequest {
  // Only the renames of this account. Empty is every account's; not a UUID is InvalidArgument.
  string account_id = 1;
  // Only the renames made at this time or after. Unset is every rename kept.
  google.protobuf.Timestamp since = 2;
  // 50 unless asked, 500 at most.
  uint32 limit = 3;
}

message ListRenamesResponse {
  // Newest first. Fewer than the limit: every rename kept since then.
  repeated Rename renames = 1;
}

// A username an operator gave an account.
message Rename {
  string rename_id = 1;
  string account_id = 2;
  google.protobuf.Timestamp renamed_at = 3;
  // The username it held before.
  string old_name = 4;
  string new_name = 5;
  // The reason given. Empty for none.
  string reason = 6;
  // The operator's account. Empty for a call on the console listener, which has no gate.
  string operator_account_id = 7;
  // The app the operator connected that made the call, as it registered: "Claude". Empty for the operator's own page.
  string client = 8;
}

message RenamePlayerResponse {
  string name = 1;
}

message SearchPlayersRequest {
  string name = 1;
  uint32 limit = 2;
}

message SearchPlayersResponse {
  repeated PlayerMatch players = 1;
  uint32 total = 2;
}

message PlayerMatch {
  string account_id = 1;
  string name = 2;
  bool guest = 3;
}

message AdminGetPlayerRequest {
  string account_id = 1;
}

message AdminGetPlayerResponse {
  string name = 1;
  bool guest = 2;
  bool linked = 3;
  bool admin = 4;
  NameColor color = 5;
  int64 created_at_unix_ms = 6;
  // progression.v1.AdminService/GetProgress.
  reserved 7, 8, 9, 10, 11, 12;
  reserved "stats", "messages_sent", "titles", "worn_title", "plays_for", "plays_against";
}
