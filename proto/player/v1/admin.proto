syntax = "proto3";

package player.v1;

import "player/v1/color.proto";
import "player/v1/internal.proto";
import "player/v1/player.proto";

// No authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the public router.
service AdminService {
  // InternalService/GetPlayers, for the admin page naming a page of players.
  rpc GetPlayers(GetPlayersRequest) returns (GetPlayersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Who one account is, a guest's too. NotFound for an account with no name and no guest code. Its stats, titles and
  // fronts are progression.v1.AdminService/GetProgress.
  rpc GetPlayer(AdminGetPlayerRequest) returns (AdminGetPlayerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // PlayerService/GetRoster, for the admin page's home: who is playing now.
  rpc GetRoster(GetRosterRequest) returns (GetRosterResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Every account whose username, or guest code until it chooses one, holds the name typed, in any case. InvalidArgument for an empty name.
  rpc SearchPlayers(SearchPlayersRequest) returns (SearchPlayersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Changes an account's username under SetName's rules, during its wait too. Not the player's choice: its next SetName goes at once. NotFound for an account with no username.
  rpc RenamePlayer(RenamePlayerRequest) returns (RenamePlayerResponse);
}

message RenamePlayerRequest {
  string account_id = 1;
  string name = 2;
}

message RenamePlayerResponse {
  string name = 1;
}

message SearchPlayersRequest {
  string name = 1;
  uint32 limit = 2;
}

message SearchPlayersResponse {
  repeated PlayerMatch players = 1;
  uint32 total = 2;
}

message PlayerMatch {
  string account_id = 1;
  string name = 2;
  bool guest = 3;
}

message AdminGetPlayerRequest {
  string account_id = 1;
}

message AdminGetPlayerResponse {
  string name = 1;
  bool guest = 2;
  bool linked = 3;
  bool admin = 4;
  NameColor color = 5;
  int64 created_at_unix_ms = 6;
  // progression.v1.AdminService/GetProgress.
  reserved 7, 8, 9, 10, 11, 12;
  reserved "stats", "messages_sent", "titles", "worn_title", "plays_for", "plays_against";
}
