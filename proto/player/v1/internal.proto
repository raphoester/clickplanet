syntax = "proto3";

package player.v1;

// What other modules of the backend ask the player module. Served only on the
// backend's loopback internal listener (httpServer.internalBindAddress), never
// on the public router.
service InternalService {
  // Who a caller is to the others: the username its account chose, and the tag
  // of the address it calls from.
  rpc GetAuthor(GetAuthorRequest) returns (GetAuthorResponse);
}

message GetAuthorRequest {
  // Empty, or not an account id, for a caller with no account: the answer then
  // has no username.
  string account_id = 1;
  // The caller's address, as the module that asks observed it.
  string ip = 2;
}

message GetAuthorResponse {
  // Empty when the account chose none.
  string username = 1;
  // A salted hash of the address, 6 hex characters: the same address has the
  // same tag everywhere the game shows one.
  string tag = 2;
  // The account is an admin of the game. False with no username.
  bool admin = 3;
}
