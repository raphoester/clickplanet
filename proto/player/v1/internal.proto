syntax = "proto3";

package player.v1;

import "player/v1/color.proto";

service InternalService {
  rpc GetAuthor(GetAuthorRequest) returns (GetAuthorResponse);

  rpc GetAuthors(GetAuthorsRequest) returns (GetAuthorsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // What auth says of a page of accounts, for a module that must not ask auth: whether each signed in with a
  // provider, and when it was made. An account auth does not answer is left out: read it as not linked, made at 0.
  rpc GetAccounts(GetAccountsRequest) returns (GetAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetAuthorRequest {
  string account_id = 1;
  reserved 2;
  reserved "ip";
}

message GetAuthorResponse {
  string name = 1;
  reserved 2;
  reserved "tag";
  bool admin = 3;
  NameColor color = 4;
  // An author's badges are PlayerService/GetBadges', which the page reads itself.
  reserved 5, 6;
  reserved "streak", "worn_title";
  bool guest = 7;
}

message GetAuthorsRequest {
  repeated string account_ids = 1;
}

message GetAuthorsResponse {
  repeated Author authors = 1;
}

message Author {
  string account_id = 1;
  string name = 2;
  bool admin = 3;
  NameColor color = 4;
  reserved 5, 6;
  reserved "streak", "worn_title";
  bool guest = 7;
}

message GetAccountsRequest {
  repeated string account_ids = 1;
}

message GetAccountsResponse {
  repeated Account accounts = 1;
}

message Account {
  string account_id = 1;
  bool linked = 2;
  int64 created_at_unix_ms = 3;
}
