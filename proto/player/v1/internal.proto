syntax = "proto3";

package player.v1;

// What other modules of the backend ask the player module. Served only on the
// backend's loopback internal listener (httpServer.internalBindAddress), never
// on the public router.
service InternalService {
  // Who an account is to the others: the name the game shows for it.
  rpc GetAuthor(GetAuthorRequest) returns (GetAuthorResponse);
}

message GetAuthorRequest {
  // Required: an empty id, or one that is not an account, is InvalidArgument.
  string account_id = 1;
  // Was the caller's address, which the tag was made from.
  reserved 2;
  reserved "ip";
}

message GetAuthorResponse {
  // The account's username, or "guest_" and its guest code when it chose none:
  // 6 hex characters, drawn the first time the account is asked about and kept
  // until it is deleted. Never empty.
  string name = 1;
  // Was a salted hash of the caller's address.
  reserved 2;
  reserved "tag";
  // The account is an admin of the game. False with no username.
  bool admin = 3;
}
