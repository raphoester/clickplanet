syntax = "proto3";

package bonuses.v1;

import "google/protobuf/timestamp.proto";
import "planet/v1/planet.proto";

// The kinds progression unlocked for an account, all of them, not one change: a box or a right answer may be drawn as
// these, beside the kinds open to everyone, while the set's gates are on. The bonuses module keeps the latest by
// decided_at, so a command told twice, late or out of order changes nothing, and fewer kinds than before are fewer.
message KeepUnlocks {
  string account_id = 1;
  repeated planet.v1.BonusKind kinds = 2;
  google.protobuf.Timestamp decided_at = 3;
}

// A level an account reached by playing: every stack of the kinds the account may be drawn filled to its size. A jump of
// several levels is one; a reconciliation sends none. The bonuses module fills it once per grant_id, which planet keeps
// for good.
message PayLevelUp {
  string grant_id = 1;
  string account_id = 2;
  uint32 level = 3;
  // Every kind the level unlocks, as KeepUnlocks tells them: the fill reads them here, since KeepUnlocks comes on a
  // stream of its own, in no order with this one.
  repeated planet.v1.BonusKind unlocked = 4;
}
