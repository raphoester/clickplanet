syntax = "proto3";

package bonuses.v1;

// What a box caught or a right answer may be and how much it grants, and the sign-in refill. "default" holds every
// value; another set holds the values it changes, and plays default's for every value it leaves unset. Postgres keeps it
// as protojson (bonuses.rule_sets.rules). How much of a charge a hand holds, and what it does, is planet's
// (planet.v1.ChargeRules); when a quiz comes is the quizzes' (quizzes.v1.Rules), when a box comes the boxes'
// (boxes.v1.Rules).
message Rules {
  // The quizzes' own rules since they are a module of their own: quizzes.v1.Rules. A set kept from before still holds
  // it, read no more.
  reserved 10;
  reserved "quiz";
  // The boxes' own rules since they are a module of their own: boxes.v1.Rules. A set kept from before still holds them,
  // read no more.
  reserved 1, 3, 4, 5, 9, 12;
  reserved "boxes", "offer_ttl", "miss_retry", "active_within", "welcome", "frozen";

  KindWeights kinds = 2;
  SpreadRules spread = 6;
  EncloseRules enclose = 7;
  ShieldRules shield = 8;
  // A guest's first sign-in earns a refill, once per account.
  optional bool sign_in_refill = 11;
}

// What a box or a right answer is drawn as: a kind's chance is its weight over the sum of the kinds it may be. A kind
// planet says a hand has no room for is never drawn for it, nor a bomb while planet's bombs are off.
message KindWeights {
  optional double refill = 1;
  optional double spread_clicks = 2;
  optional double enclose_clicks = 3;
  optional double bomb = 4;
  optional double shields = 5;
}

message SpreadRules {
  // What one box or right answer adds to the spread pool at most.
  optional uint32 max_per_box = 1;
}

message EncloseRules {
  optional uint32 max_per_box = 1;
}

message ShieldRules {
  optional uint32 min_per_box = 1;
  optional uint32 max_per_box = 2;
}
