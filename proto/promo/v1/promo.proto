syntax = "proto3";

package promo.v1;

// What the game shows of a battle before it starts: the teaser's cards, a background each and words over it. Never a
// rule set's name.
service PromoService {
  // The teaser's cards of a battle, by the id the gamemaster's timeline names it by: its entry's id, or its round,
  // `season-N/finale`, for a season's finale. Their words are filled from the values the battle's rule set plays at the
  // read, and the battle's points. No cards for a battle whose set has none. NotFound for a battle the schedule does
  // not hold. A cached GET.
  rpc GetTeaser(GetTeaserRequest) returns (GetTeaserResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetTeaserRequest {
  string battle_id = 1;
}

message GetTeaserResponse {
  // In the operator's order. A card whose words no longer fill is left out.
  repeated TeaserCard cards = 1;
}

message TeaserCard {
  // A public image, shown cropped to a 3:4 portrait frame.
  string background_url = 1;
  string headline = 2;
  // May be empty.
  string line = 3;
}
