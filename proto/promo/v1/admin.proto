syntax = "proto3";

package promo.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "promo/v1/promo.proto";

// The operator's teaser cards: a library of backgrounds, and each rule set's cards, written with placeholders that the
// set's values fill.
service AdminService {
  // A link the page sends one background to, straight to the bucket. It is in the library once KeepBackground names it.
  // InvalidArgument for a file that is no JPEG, PNG or WebP, or past the size; FailedPrecondition while backgrounds are
  // off.
  rpc CreateBackgroundUpload(CreateBackgroundUploadRequest) returns (CreateBackgroundUploadResponse);
  // Puts a file sent to CreateBackgroundUpload's link in the library, under a name. FailedPrecondition for a file the
  // bucket does not hold.
  rpc KeepBackground(KeepBackgroundRequest) returns (KeepBackgroundResponse);
  // The library of teaser backgrounds, newest first, each with its public link.
  rpc ListBackgrounds(ListBackgroundsRequest) returns (ListBackgroundsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Deletes a background from the library and the bucket. FailedPrecondition while a set's card shows it, naming
  // the sets.
  rpc RemoveBackground(RemoveBackgroundRequest) returns (RemoveBackgroundResponse);
  // Every set planet keeps, with its cards as written and as players read them now, and the values a placeholder may
  // name.
  rpc GetCards(GetCardsRequest) returns (GetCardsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces a set's cards, in order: none to remove them, at most 5. InvalidArgument for a card the rules refuse;
  // FailedPrecondition for a set planet does not keep, or a background not in the library.
  rpc SaveCards(SaveCardsRequest) returns (SaveCardsResponse);
  // The battles that start within the next `within`, by start, each with its cards as players read them now. A battle
  // whose set has no card is left out, as the game teases nothing of it. InvalidArgument for a window of nothing, or of
  // more than a week.
  rpc ListTeasers(ListTeasersRequest) returns (ListTeasersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The battles whose teaser is due: those that start within 36 hours and that no post teases yet, by start, for the
  // teasers job to render. A post teases its battle whatever became of it: one cancelled in the posting service's
  // dashboard was cancelled on purpose. FailedPrecondition while publishing is off.
  rpc ListDueTeasers(ListDueTeasersRequest) returns (ListDueTeasersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Posts a battle's teaser once the job rendered its cards and uploaded them with publishing's CreateMediaUpload: a
  // photo carousel of the cards on TikTok and their slideshow on YouTube, in promo's words, at the first slot the posting
  // calendar gives from 30 hours before the battle to an hour before it, on both if it can, else on TikTok alone, else
  // on YouTube alone. The answer is what became of it: posted; held, no platform takes it in time; skipped, the battle is
  // no longer due; busy, the posting service asked to be tried later, so call again then; or failed, refused for good.
  // InvalidArgument for no battle, no video, or not one photo a card; FailedPrecondition while publishing is off.
  rpc PostTeaser(PostTeaserRequest) returns (PostTeaserResponse);
}

message CreateBackgroundUploadRequest {
  string content_type = 1;
  uint64 size_bytes = 2;
}

message CreateBackgroundUploadResponse {
  string background_id = 1;
  // A PUT with this content type and this exact size, before it expires.
  string upload_url = 2;
}

message KeepBackgroundRequest {
  string background_id = 1;
  string name = 2;
}

message KeepBackgroundResponse {}

message ListBackgroundsRequest {}

message ListBackgroundsResponse {
  // The newest first.
  repeated Background backgrounds = 1;
}

message Background {
  string background_id = 1;
  string name = 2;
  string content_type = 3;
  uint64 size_bytes = 4;
  google.protobuf.Timestamp kept_at = 5;
  // Public: what a card shows.
  string url = 6;
}

message RemoveBackgroundRequest {
  string background_id = 1;
}

message RemoveBackgroundResponse {}

message GetCardsRequest {}

message GetCardsResponse {
  // Every set planet keeps, by name, each with its cards, none for most.
  repeated SetCards sets = 1;
  // What a placeholder may name of the rules, by path, with default's value.
  repeated Placeholder placeholders = 2;
  // A set plays in no battle of its own: its cards are filled as in this one.
  ExampleBattle example_battle = 3;
}

// The battle a set's cards are filled as, on this page only.
message ExampleBattle {
  uint32 times = 1;
  // What a placeholder may name of the battle, by path, with this battle's value: `battle.times`,
  // `battle.points.first`.
  repeated Placeholder placeholders = 2;
}

message SetCards {
  string rule_set = 1;
  repeated Card cards = 2;
}

message Card {
  CardDraft draft = 1;
  // As players read it now, in the example battle. Unset when a placeholder no longer fills, and `problem` says why.
  TeaserCard filled = 2;
  string problem = 3;
}

// A card as the operator writes it: `{path}` in the headline or the line is a value of the set, by its path in
// planet.v1.Rules as protojson writes it, such as `{clicks.tempo}` or `{bonuses.boxes.minInterval}`, or of the battle
// that plays it, such as `{battle.times}` or `{battle.points.first}`.
message CardDraft {
  string background_id = 1;
  // 1 to 40 characters, as written.
  string headline = 2;
  // 120 characters at most, as written.
  string line = 3;
}

// A number or a duration a card may name, with a value as it reads on a card.
message Placeholder {
  string path = 1;
  string example = 2;
}

message SaveCardsRequest {
  string rule_set = 1;
  repeated CardDraft cards = 2;
}

message SaveCardsResponse {}

message ListTeasersRequest {
  // How far ahead a battle starts, at most a week.
  google.protobuf.Duration within = 1;
}

message ListTeasersResponse {
  // By start.
  repeated Teaser teasers = 1;
}

message Teaser {
  // What GetTeaser takes: the battle's entry's id, or a season's finale's round.
  string battle_id = 1;
  google.protobuf.Timestamp starts_at = 2;
  google.protobuf.Timestamp ends_at = 3;
  // The schedule's words for the players: what its rules are. Empty when the operator wrote none.
  string description = 4;
  // How many times a day's points the battle scores.
  uint32 times = 5;
  // The battle is a season's Final Battle.
  bool ends_season = 6;
  // In the operator's order, at least one.
  repeated TeaserCard cards = 7;
}

message ListDueTeasersRequest {}

message ListDueTeasersResponse {
  // By start.
  repeated Teaser teasers = 1;
}

message PostTeaserRequest {
  // A battle ListDueTeasers listed.
  string battle_id = 1;
  // Its cards as JPEGs, in their order, one a card: the addresses publishing's CreateMediaUpload answered.
  repeated string photo_urls = 2;
  // Their slideshow, an MP4: the address publishing's CreateMediaUpload answered.
  string video_url = 3;
}

message PostTeaserResponse {
  oneof outcome {
    TeaserPosted posted = 1;
    // No platform takes it before its battle: their days are full, or their hours past.
    TeaserNotPosted held = 2;
    // No longer due: teased already, or no longer on the schedule within 36 hours.
    TeaserNotPosted skipped = 3;
    // The posting service asked to be tried later: call again after retry_after.
    TeaserBusy busy = 4;
    // Refused for good.
    TeaserNotPosted failed = 5;
  }
}

message TeaserPosted {
  string post_id = 1;
  // The post's title, in the posting service's dashboard.
  string title = 2;
  google.protobuf.Timestamp at = 3;
  // "tiktok", "youtube".
  repeated string platforms = 4;
  // Each platform that refused it, and why: the post goes out on the others.
  repeated TeaserRefusal refusals = 5;
}

message TeaserRefusal {
  string platform = 1;
  string reason = 2;
}

message TeaserNotPosted {
  string reason = 1;
}

message TeaserBusy {
  string reason = 1;
  // Absent when the service did not say.
  google.protobuf.Duration retry_after = 2;
}
