syntax = "proto3";

package flags.v1;

import "google/protobuf/timestamp.proto";
import "flags/v1/flags.proto";

// What the flags module tells the other modules, over Redis Streams, from its outbox: in the transaction that opens,
// closes, renames or moves a flag, and FlagOpened and FlagClosed again for every flag at each boot. Of one flag, the fact
// with the latest time is the one that holds.

// Players may play for the flag from opened_at.
message FlagOpened {
  string flag = 1;
  // In English.
  string name = 2;
  google.protobuf.Timestamp opened_at = 3;
  // The flag's capital, as it is now.
  Pin pin = 4;
}

// No player may play for the flag from closed_at: its time ended, or the operator removed it. It stays in the catalog:
// history still names it. A flag removed after its end is told closed again.
message FlagClosed {
  string flag = 1;
  google.protobuf.Timestamp closed_at = 2;
}

// The flag's name from renamed_at: the operator's rename. Its code stays. The flags module and the alerts listen (the
// flag's Discord role wears its name).
message FlagRenamed {
  string flag = 1;
  // In English.
  string name = 2;
  google.protobuf.Timestamp renamed_at = 3;
}

// The flag's holder set its anthem, or took it off, at changed_at: the pages read the flag again.
message AnthemChanged {
  string flag = 1;
  google.protobuf.Timestamp changed_at = 2;
}

// The operator approved a submission. One paid for while it waited opens its flag now, with the time paid.
message SubmissionApproved {
  string submission_id = 1;
  google.protobuf.Timestamp approved_at = 2;
}

// The operator rejected a submission. The shop refunds what was paid for it.
message SubmissionRejected {
  string submission_id = 1;
  google.protobuf.Timestamp rejected_at = 2;
}

// A payment the rules refused bought no time: a submission rejected or replaced, a name another flag took since, a
// removed flag, an open flag another account holds, or a flag whose time ended after the order. The shop refunds it.
message TimeRefused {
  string grant_id = 1;
  google.protobuf.Timestamp refused_at = 2;
}

// A submission waits on a person, the operator: its player asked a person to look again at the judge's rejection, or
// the judge was unsure and its time is paid, whichever came first. Told once for each.
message ReviewAsked {
  string submission_id = 1;
  // In English.
  string name = 2;
  ReviewCause cause = 3;
  // What decided the judge, in its words.
  string why = 4;
  google.protobuf.Timestamp asked_at = 5;
}

enum ReviewCause {
  REVIEW_CAUSE_UNSPECIFIED = 0;
  // Its player asked a person to look again at the judge's rejection.
  REVIEW_CAUSE_APPEAL = 1;
  // The judge was unsure, and its time is paid.
  REVIEW_CAUSE_UNSURE = 2;
}
