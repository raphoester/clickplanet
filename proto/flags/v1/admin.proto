syntax = "proto3";

package flags.v1;

import "google/protobuf/timestamp.proto";
import "flags/v1/flags.proto";

// No authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the public router.
service AdminService {
  // Every flag a player may play for or once played for: the ones the game ships with, in their order, then the ones
  // opened since, by name, each with its picture, its end and, once closed, when. A closed flag stays: no player may
  // play for it.
  rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // A link to upload the picture of a flag to open, good for 10 minutes: PUT the file there with its Content-Type.
  // PNG, JPEG or WebP, at most 5 MB. The file stays private: OpenFlag draws it again. FailedPrecondition while the
  // flags' pictures are off.
  rpc CreateFlagUpload(CreateFlagUploadRequest) returns (CreateFlagUploadResponse);

  // Opens a flag for every player, with no land, until its end: its name, the picture uploaded with
  // CreateFlagUpload, and when its time runs out. The picture is drawn again (PNG, fitted inside 768 x 512, no hidden
  // data) and made public; a picture that is no PNG, JPEG or WebP, moves, or is narrower than square or wider than 2
  // wide by 1 high is InvalidArgument, as is a name another flag has, built-in or sold, whatever its case. Every
  // player sees the flag at once, and a closed flag is never deleted: open one only when the owner says so.
  rpc OpenFlag(OpenFlagRequest) returns (OpenFlagResponse);

  // Adds days to a flag opened since the game shipped. An open flag ends that much later. A flag closed less than 30
  // days ago opens again, with the same code, name and picture and the land it still holds, and ends that many days
  // from now; FailedPrecondition past the 30 days.
  rpc AddTime(AddTimeRequest) returns (AddTimeResponse);

  // Closes a flag opened since the game shipped, now: its players must pick another flag, its land stays, and nobody
  // may click for it. While the rules in force lock the flags (a battle), planet keeps it playable until the lock
  // lifts. FailedPrecondition for a flag closed already.
  rpc CloseFlag(CloseFlagRequest) returns (CloseFlagResponse);

  // Renames a flag opened since the game shipped, open or closed: every page shows the new name at once, and its code,
  // picture, land and players stay. A name another flag has, built-in or sold, whatever its case, is
  // InvalidArgument, as is an empty one or one over 40 characters.
  rpc RenameFlag(RenameFlagRequest) returns (RenameFlagResponse);

  // Every submission waiting, the oldest first, then the 500 decided last, the latest first: what each player
  // submitted, its picture as the server drew it, and the verdict.
  rpc ListSubmissions(ListSubmissionsRequest) returns (ListSubmissionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Approves a submission: its picture is made public. A new flag then waits to be paid for, and opens with
  // OpenSubmittedFlag; a change is on its flag at once, for every player. NotFound for an unknown submission;
  // FailedPrecondition for one decided already, a name another flag has (whatever its case), or while the flags'
  // pictures are off.
  rpc ApproveSubmission(ApproveSubmissionRequest) returns (ApproveSubmissionResponse);

  // Rejects a submission, with the reason its player reads. Its picture never becomes public, and is deleted 30 days
  // later. NotFound for an unknown submission; FailedPrecondition for one decided already; InvalidArgument for no
  // reason, or OTHER with no note.
  rpc RejectSubmission(RejectSubmissionRequest) returns (RejectSubmissionResponse);

  // Opens the flag of an approved submission for every player, until its end, at the submission's pin: a flag sold
  // by hand until payments exist. FailedPrecondition for a submission not approved, opened already, or a change, or a
  // name another flag took since; InvalidArgument for an end gone by. A closed flag is never deleted: open one only when the owner says so.
  rpc OpenSubmittedFlag(OpenSubmittedFlagRequest) returns (OpenSubmittedFlagResponse);
}

message CreateFlagUploadRequest {
  // image/png, image/jpeg or image/webp.
  string content_type = 1;
  uint64 size_bytes = 2;
}

message CreateFlagUploadResponse {
  // What OpenFlag takes.
  string upload_id = 1;
  string upload_url = 2;
}

message OpenFlagRequest {
  // 1 to 40 characters, in English: the place's name.
  string name = 1;
  string upload_id = 2;
  // In the future.
  google.protobuf.Timestamp ends_at = 3;
  // Required: where the flag starts in Capital Siege, the place's capital or its middle.
  Pin pin = 4;
}

message OpenFlagResponse {
  Flag flag = 1;
}

message AddTimeRequest {
  // r- and ten letters or digits.
  string code = 1;
  // 1 to 3660.
  uint32 days = 2;
}

message AddTimeResponse {
  Flag flag = 1;
}

message CloseFlagRequest {
  string code = 1;
}

message CloseFlagResponse {
  Flag flag = 1;
}

message RenameFlagRequest {
  string code = 1;
  // 1 to 40 characters, in English.
  string name = 2;
}

message RenameFlagResponse {
  Flag flag = 1;
}

message ListSubmissionsRequest {}

message ListSubmissionsResponse {
  repeated KeptSubmission submissions = 1;
}

// A submission as the operator reviews it.
message KeptSubmission {
  string id = 1;
  // The founder's account.
  string account_id = 2;
  string name = 3;
  Pin pin = 4;
  // A new name or picture for a flag already opened, in place of a new flag.
  bool change = 5;
  // The flag a change is for, or the flag opened from a new one; empty until then.
  string flag = 6;
  SubmissionState state = 7;
  google.protobuf.Timestamp submitted_at = 8;
  // When it took its state: its submission, while it waits.
  google.protobuf.Timestamp decided_at = 9;
  // Only for a rejected one.
  Rejection rejection = 10;
  // The picture as the server drew it: public from its approval, before it a private link good for an hour. Unset
  // once a rejected picture was deleted.
  Picture picture = 11;
  // The share of the picture, in percent, in colours other than its 8 most common, each channel in 16 steps: the
  // game's flags hold 0 to 10, a photo 20 or more.
  uint32 other_colors_percent = 12;
}

message ApproveSubmissionRequest {
  string submission_id = 1;
}

message ApproveSubmissionResponse {
  KeptSubmission submission = 1;
}

message RejectSubmissionRequest {
  string submission_id = 1;
  Rejection rejection = 2;
}

message RejectSubmissionResponse {
  KeptSubmission submission = 1;
}

message OpenSubmittedFlagRequest {
  string submission_id = 1;
  // In the future.
  google.protobuf.Timestamp ends_at = 2;
}

message OpenSubmittedFlagResponse {
  Flag flag = 1;
}
