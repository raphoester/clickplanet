syntax = "proto3";

package flags.v1;

// What paid time goes to: the approved submission of a new flag, whose flag the first payment opens, or a flag opened
// since the game shipped.
message TimeTarget {
  oneof target {
    string submission_id = 1;
    string flag = 2;
  }
}

// How much time a payment buys: a week, a calendar month or a calendar year, from the flag's end, or from the payment
// for a flag it opens.
enum TimePeriod {
  TIME_PERIOD_UNSPECIFIED = 0;
  TIME_PERIOD_WEEK = 1;
  TIME_PERIOD_MONTH = 2;
  TIME_PERIOD_YEAR = 3;
}
