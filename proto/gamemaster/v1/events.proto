syntax = "proto3";

package gamemaster.v1;

import "google/protobuf/timestamp.proto";

// What the gamemaster tells the other modules, in the game's words: a day as it starts, and each moment once scoring
// scored it. The numbers stay scoring's: read them by round_id or book_id (scoring.v1.InternalService).

// The day that runs from starts_at to ends_at. Told as it starts, and again when a moved season end moves ends_at.
message DayStarted {
  uint32 season = 1;
  // The day's place among the season's days.
  uint32 day = 2;
  string round_id = 3;
  string book_id = 4;
  google.protobuf.Timestamp starts_at = 5;
  google.protobuf.Timestamp ends_at = 6;
}

message DayEnded {
  uint32 season = 1;
  // The day's place among the season's days.
  uint32 day = 2;
  string round_id = 3;
  google.protobuf.Timestamp ended_at = 4;
}

message BattleEnded {
  uint32 season = 1;
  // The battle's place among the season's battles.
  uint32 number = 2;
  // Empty for the season's finale, which is the season's and no entry's.
  string entry_id = 3;
  uint32 times = 4;
  // The battle was the season's finale.
  bool ends_season = 5;
  string round_id = 6;
  google.protobuf.Timestamp ended_at = 7;
}

message SeasonEnded {
  uint32 season = 1;
  string book_id = 2;
  google.protobuf.Timestamp ended_at = 3;
  // The season's finale's round, which breaks a tie; empty when the season had no finale.
  string finale_round_id = 4;
  // The season's finale, when it had one: it ended with the season, and the season's debrief replaces its own.
  BattleEnded finale_battle = 5;
}
