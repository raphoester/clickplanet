syntax = "proto3";

package gamemaster.v1;

import "google/protobuf/timestamp.proto";
import "gamemaster/v1/gamemaster.proto";

// The rule schedule: which rule set planet and the antibot play, and when; and the seasons. No authentication of its
// own: served on the console listener, and on the admin listener behind its gate. Never the public router. No call
// changes what plays now: only an entry to come is added, changed or deleted.
service AdminService {
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);

  // Adds an entry that starts later. Its set must be one planet and the antibot keep: FailedPrecondition otherwise.
  rpc AddEntry(AddEntryRequest) returns (AddEntryResponse);

  // Changes an entry that has not started, by the rules of AddEntry. FailedPrecondition once it started.
  rpc EditEntry(EditEntryRequest) returns (EditEntryResponse);

  // Deletes an entry that has not started. FailedPrecondition once it started.
  rpc DeleteEntry(DeleteEntryRequest) returns (DeleteEntryResponse);

  // Every season, by number. Scoring is told each one's start and end once it starts.
  rpc GetSeasons(GetSeasonsRequest) returns (GetSeasonsResponse);

  // Adds a season that starts later, after the end of the last one, under the next number.
  rpc AddSeason(AddSeasonRequest) returns (AddSeasonResponse);

  // Changes a season that has not ended. One that started keeps its start, and its end moves only to a time after now:
  // FailedPrecondition otherwise.
  rpc EditSeason(EditSeasonRequest) returns (EditSeasonResponse);

  // Deletes the last season, when it has not started. FailedPrecondition otherwise.
  rpc DeleteSeason(DeleteSeasonRequest) returns (DeleteSeasonResponse);
}

message GetScheduleRequest {}

message GetScheduleResponse {
  // Every entry, by start, the past ones too.
  repeated Entry entries = 1;
  Playing playing = 2;
}

message Entry {
  string id = 1;
  string rule_set = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  // The higher plays. At one priority, the entry made last plays.
  uint32 priority = 5;
  google.protobuf.Timestamp made_at = 6;
  // What the entry is to the players: the game client reads it from GamemasterService.GetTurn.
  EntryKind kind = 7;
  // For the players, in plain text: what the rules of the entry are ("Triple points. A bonus box every minute.").
  string description = 8;
}

// What the schedule plays now: the running entry with the highest priority, else "default".
message Playing {
  string rule_set = 1;
  // Unset when it has played since before any entry.
  google.protobuf.Timestamp since = 2;
  // The entry that plays; empty when none runs.
  string entry_id = 3;
  // The entry's kind; plain when none runs.
  EntryKind kind = 4;
}

message AddEntryRequest {
  string rule_set = 1;
  google.protobuf.Timestamp starts_at = 2;
  google.protobuf.Timestamp ends_at = 3;
  uint32 priority = 4;
  // Battle or plain: unspecified is InvalidArgument.
  EntryKind kind = 5;
  // At most 300 characters: InvalidArgument past that.
  string description = 6;
}

message AddEntryResponse {
  string id = 1;
}

message EditEntryRequest {
  string id = 1;
  string rule_set = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  uint32 priority = 5;
  EntryKind kind = 6;
  string description = 7;
}

message EditEntryResponse {}

message DeleteEntryRequest {
  string id = 1;
}

message DeleteEntryResponse {}

message GetSeasonsRequest {}

message GetSeasonsResponse {
  repeated Season seasons = 1;
}

message AddSeasonRequest {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
}

message AddSeasonResponse {
  uint32 number = 1;
}

message EditSeasonRequest {
  uint32 number = 1;
  google.protobuf.Timestamp starts_at = 2;
  google.protobuf.Timestamp ends_at = 3;
}

message EditSeasonResponse {}

message DeleteSeasonRequest {
  uint32 number = 1;
}

message DeleteSeasonResponse {}
