syntax = "proto3";

package metrics.v1;

import "google/protobuf/timestamp.proto";

// No authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the public router.
service AdminService {
  // What /metrics says now, for the admin page. A counter counts from `started_at`: two answers with the same
  // `started_at` are subtracted, never two with different ones.
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
}

message GetMetricsRequest {}

message GetMetricsResponse {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp read_at = 2;
  repeated Metric metrics = 3;
}

// One series: a name, its labels and its value.
message Metric {
  string name = 1;
  repeated Label labels = 2;
  oneof value {
    double counter = 3;
    double gauge = 4;
    Histogram histogram = 5;
    Summary summary = 6;
  }
}

message Label {
  string name = 1;
  string value = 2;
}

message Histogram {
  uint64 count = 1;
  double sum = 2;
  // Cumulative, as Prometheus keeps them. The +Inf bucket is `count`.
  repeated Bucket buckets = 3;
}

message Bucket {
  double upper_bound = 1;
  uint64 count = 2;
}

message Summary {
  uint64 count = 1;
  double sum = 2;
  repeated Quantile quantiles = 3;
}

message Quantile {
  double quantile = 1;
  double value = 2;
}
