syntax = "proto3";

package clips.v1;

import "clips/v1/clips.proto";
import "google/protobuf/timestamp.proto";

// The players a clip names: the cast of a run, which the job's `clips fetch` makes, and who each post named, which
// `clips schedule` keeps. The numbers of the posts are publishing's (publishing.v1.AdminService/ListSnapshots). The rest
// of the package is what the frontend's generator hands the job (clips.proto), and what a player reads of the clips
// that name it (appearances.proto). Not public: a cast holds account ids. No
// authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the
// public router.
service AdminService {
  // Numbers each player who took tiles from another flag in a window, at most 72 hours, and keeps which account each
  // number is, for 3 days. The answer holds names and numbers, never an account id.
  rpc MakeCast(MakeCastRequest) returns (MakeCastResponse);

  // Keeps that a post names these players of a cast, so each is told in the game once the post is out. Kept again,
  // the same post and player is kept once. NotFound for a cast forgotten or never made; InvalidArgument for a number
  // it does not have.
  rpc KeepAppearance(KeepAppearanceRequest) returns (KeepAppearanceResponse);

  // A link the page sends one video to, straight to the bucket. The video is listed once KeepVideo names it.
  rpc CreateVideoUpload(CreateVideoUploadRequest) returns (CreateVideoUploadResponse);

  // Lists a video sent to CreateVideoUpload's link, under a name and with the caption to post it with.
  rpc KeepVideo(KeepVideoRequest) returns (KeepVideoResponse);

  // The videos the operator keeps to post by hand, newest first, each with a link to download it.
  rpc ListVideos(ListVideosRequest) returns (ListVideosResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Deletes a video from the list and from the bucket.
  rpc RemoveVideo(RemoveVideoRequest) returns (RemoveVideoResponse);

  // Which players' names the game's posts on TikTok and YouTube may show, as the judge (Claude Haiku) or the operator
  // decided, the newest first. A cast leaves out a name hidden. A name is judged the first time a cast holds it, and
  // again once its player renames. The game itself shows every name.
  rpc ListNameVerdicts(ListNameVerdictsRequest) returns (ListNameVerdictsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The operator's verdict of the name a player was judged under: shown or hidden in the game's posts, until the
  // player renames. NotFound for a player whose name was never judged.
  rpc SetNameVerdict(SetNameVerdictRequest) returns (SetNameVerdictResponse);
}

message MakeCastRequest {
  google.protobuf.Timestamp since = 1;
  // Unset is now.
  google.protobuf.Timestamp until = 2;
}

message MakeCastResponse {
  Cast cast = 1;
}

message KeepAppearanceRequest {
  string cast_id = 1;
  // By their number in the cast.
  repeated uint32 fighters = 2;
  // The Zernio post id.
  string post_id = 3;
  // The clip's headline.
  string title = 4;
  // Those that took the post.
  repeated string platforms = 5;
  google.protobuf.Timestamp scheduled_at = 6;
}

message KeepAppearanceResponse {
  uint32 kept = 1;
}

message CreateVideoUploadRequest {
  string content_type = 1;
  uint64 size_bytes = 2;
}

message CreateVideoUploadResponse {
  string video_id = 1;
  // A PUT with this content type and this exact size, before it expires.
  string upload_url = 2;
}

message KeepVideoRequest {
  string video_id = 1;
  string name = 2;
  // What to post with it, copied by hand.
  string caption = 3;
}

message KeepVideoResponse {}

message ListVideosRequest {}

message ListVideosResponse {
  // The newest first.
  repeated Video videos = 1;
}

message Video {
  string video_id = 1;
  string name = 2;
  string caption = 3;
  string content_type = 4;
  uint64 size_bytes = 5;
  google.protobuf.Timestamp kept_at = 6;
  // Plays in the page.
  string view_url = 7;
  // Saves the file under its name.
  string download_url = 8;
}

message RemoveVideoRequest {
  string video_id = 1;
}

message RemoveVideoResponse {}

enum VerdictBy {
  VERDICT_BY_UNSPECIFIED = 0;
  VERDICT_BY_JUDGE = 1;
  VERDICT_BY_OPERATOR = 2;
}

message NameVerdict {
  string account_id = 1;
  // The name judged: the player's name then.
  string name = 2;
  // Whether the game's posts may show it.
  bool shown = 3;
  // Why it is hidden; empty for a name shown.
  string reason = 4;
  VerdictBy decided_by = 5;
  google.protobuf.Timestamp decided_at = 6;
}

message ListNameVerdictsRequest {
  // Only the names hidden.
  bool hidden_only = 1;
}

message ListNameVerdictsResponse {
  repeated NameVerdict verdicts = 1;
}

message SetNameVerdictRequest {
  string account_id = 1;
  bool shown = 2;
  // Why it is hidden, in a few plain words; dropped for a name shown.
  string reason = 3;
}

message SetNameVerdictResponse {
  NameVerdict verdict = 1;
}
