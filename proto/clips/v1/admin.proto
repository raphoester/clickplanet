syntax = "proto3";

package clips.v1;

import "clips/v1/clips.proto";
import "google/protobuf/timestamp.proto";

// What became of the clips the clips job posts: a snapshot a day of each post's numbers on each platform, sent by the
// job's `clips stats` over ssh and read by the backoffice, which makes the table. And the players a clip names: the
// cast of a run, which the job's `clips fetch` makes, and who each post named, which `clips schedule` keeps. The rest
// of the package is what the frontend's generator hands the job (clips.proto), and what a player reads of the clips
// that name it (appearances.proto). Not public: some of the numbers are not, and a cast holds account ids. No
// authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the
// public router.
service AdminService {
  // Keeps a snapshot's summary and some of its rows: a snapshot is sent in parts, each with the summary. A row kept
  // again (the same snapshot, post and platform) replaces the one kept, and so does a summary, so a part sent twice
  // is kept once. InvalidArgument for a row of another snapshot, or whose document is not a JSON object.
  rpc KeepSnapshot(KeepSnapshotRequest) returns (KeepSnapshotResponse);

  // The summaries of the snapshots taken in a window, the newest first.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

  // The rows of the snapshots taken in a window, the oldest snapshot first, a page at a time.
  rpc ListRows(ListRowsRequest) returns (ListRowsResponse);

  // Numbers each player who took tiles from another flag in a window, at most 72 hours, and keeps which account each
  // number is, for 3 days. The answer holds names and numbers, never an account id.
  rpc MakeCast(MakeCastRequest) returns (MakeCastResponse);

  // Keeps that a post names these players of a cast, so each is told in the game once the post is out. Kept again,
  // the same post and player is kept once. NotFound for a cast forgotten or never made; InvalidArgument for a number
  // it does not have.
  rpc KeepAppearance(KeepAppearanceRequest) returns (KeepAppearanceResponse);

  // A link the page sends one video to, straight to the bucket. The video is listed once KeepVideo names it.
  rpc CreateVideoUpload(CreateVideoUploadRequest) returns (CreateVideoUploadResponse);

  rpc KeepVideo(KeepVideoRequest) returns (KeepVideoResponse);

  rpc ListVideos(ListVideosRequest) returns (ListVideosResponse);

  rpc RemoveVideo(RemoveVideoRequest) returns (RemoveVideoResponse);
}

// What a snapshot read and kept: counts and states, never a metric.
message StatsSnapshot {
  google.protobuf.Timestamp taken_at = 1;
  // The posts read are those scheduled since then.
  google.protobuf.Timestamp since = 2;
  // The posts of the job read, and those of them out on no platform yet.
  uint32 posts = 3;
  uint32 not_out = 4;
  // The rows of the whole snapshot, of every part.
  uint32 rows = 5;
  // Rows of a platform whose numbers Zernio was still fetching.
  uint32 syncing = 6;
  // The YouTube rows with a retention curve.
  uint32 curves = 7;
  repeated TikTokAccount tiktok_accounts = 8;
  // The posts that could not be read whole: their numbers of that day are lost.
  repeated UnreadPost unread = 9;
}

// Whether TikTok's business lane is live on one account.
message TikTokAccount {
  string account_id = 1;
  string username = 2;
  // What TikTok said the account was when it was connected to Zernio: "business", "personal" or "unknown".
  string account_type = 3;
  // Whether the commercial music library answered for it, which it does only through TikTok for Business, and why
  // not when it did not.
  bool commercial_music = 4;
  string commercial_music_refusal = 5;
  // Its rows of the snapshot, and how many of them hold a metric only the business lane gives.
  uint32 rows = 6;
  uint32 business_rows = 7;
  // Whether its lane answers: the music library, or a business metric on a post, whatever account_type says.
  bool live = 8;
}

message UnreadPost {
  string post_id = 1;
  string reason = 2;
}

// One platform of one post at one snapshot.
message StatsRow {
  google.protobuf.Timestamp taken_at = 1;
  // The Zernio post id.
  string post_id = 2;
  string platform = 3;
  // The row as the job wrote it, a JSON object: what Zernio answered, as it came, and the post's metadata. Its key
  // "version" names its shape. Kept as JSON, so a metric Zernio adds is kept with no change here.
  string document = 4;
}

message KeepSnapshotRequest {
  StatsSnapshot snapshot = 1;
  // Each of the snapshot's taken_at. None is a snapshot that kept no row.
  repeated StatsRow rows = 2;
}

message KeepSnapshotResponse {
  // The rows of this part kept.
  uint32 rows = 1;
}

message ListSnapshotsRequest {
  // Unset is every snapshot kept, and now.
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp until = 2;
  // Unset is 100; at most 500.
  uint32 limit = 3;
}

message ListSnapshotsResponse {
  repeated StatsSnapshot snapshots = 1;
}

message ListRowsRequest {
  // The snapshots taken in [since, until). Unset is every snapshot kept, and now.
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp until = 2;
  // Unset is 500; at most 2000.
  uint32 limit = 3;
  // The next_page of the page before; empty is the first.
  string page = 4;
}

message ListRowsResponse {
  repeated StatsRow rows = 1;
  // Empty on the last page.
  string next_page = 2;
}

message MakeCastRequest {
  google.protobuf.Timestamp since = 1;
  // Unset is now.
  google.protobuf.Timestamp until = 2;
}

message MakeCastResponse {
  Cast cast = 1;
}

message KeepAppearanceRequest {
  string cast_id = 1;
  // By their number in the cast.
  repeated uint32 fighters = 2;
  // The Zernio post id.
  string post_id = 3;
  // The clip's headline.
  string title = 4;
  // Those that took the post.
  repeated string platforms = 5;
  google.protobuf.Timestamp scheduled_at = 6;
}

message KeepAppearanceResponse {
  uint32 kept = 1;
}

message CreateVideoUploadRequest {
  string content_type = 1;
  uint64 size_bytes = 2;
}

message CreateVideoUploadResponse {
  string video_id = 1;
  // A PUT with this content type and this exact size, before it expires.
  string upload_url = 2;
}

message KeepVideoRequest {
  string video_id = 1;
  string name = 2;
  // What to post with it, copied by hand.
  string caption = 3;
}

message KeepVideoResponse {}

message ListVideosRequest {}

message ListVideosResponse {
  // The newest first.
  repeated Video videos = 1;
}

message Video {
  string video_id = 1;
  string name = 2;
  string caption = 3;
  string content_type = 4;
  uint64 size_bytes = 5;
  google.protobuf.Timestamp kept_at = 6;
  // Plays in the page.
  string view_url = 7;
  // Saves the file under its name.
  string download_url = 8;
}

message RemoveVideoRequest {
  string video_id = 1;
}

message RemoveVideoResponse {}
