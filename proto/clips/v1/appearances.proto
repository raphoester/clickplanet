syntax = "proto3";

package clips.v1;

import "google/protobuf/timestamp.proto";

// The clips that name the caller, on the public router: each needs the identity token, and acts on the caller's alone.
service ClipsService {
  rpc GetAppearances(GetAppearancesRequest) returns (GetAppearancesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Whether the clips may name the caller.
  rpc SetNameShown(SetNameShownRequest) returns (SetNameShownResponse);
}

message GetAppearancesRequest {}

message GetAppearancesResponse {
  // The posts out in the last 7 days that name the caller, the newest first.
  repeated Appearance appearances = 1;
  // True until the caller turns it off.
  bool name_shown = 2;
}

message SetNameShownRequest {
  bool name_shown = 1;
}

message SetNameShownResponse {
  bool name_shown = 1;
}

message Appearance {
  // The Zernio post id.
  string post_id = 1;
  string title = 2;
  google.protobuf.Timestamp scheduled_at = 3;
  repeated ClipLink links = 4;
}

// A platform the post went to, and its video's address there once a snapshot of the stats read it; empty until then.
message ClipLink {
  string platform = 1;
  string url = 2;
}
