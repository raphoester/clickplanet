syntax = "proto3";

package planet.v1;

import "google/protobuf/timestamp.proto";
import "planet/v1/planet.proto";

// What another module asks of planet, in planet's words, over Redis Streams.

// What does not fit the account's stack is not granted. A grant_id told twice is granted once.
message GrantCharges {
  string grant_id = 1;
  string account_id = 2;
  BonusKind kind = 3;
  uint32 amount = 4;
}

// Refuses the caller's clicks, bombs and shields until a time. Planet keeps the latest decision on each caller by
// decided_at, so a command sent twice, or after a newer one, changes nothing.
message RefuseCaller {
  oneof caller {
    string scope = 1;
    string account_id = 2;
  }
  google.protobuf.Timestamp until = 3;
  google.protobuf.Timestamp decided_at = 4;
}

// Ends the caller's refusal now, by the same rule.
message AdmitCaller {
  oneof caller {
    string scope = 1;
    string account_id = 2;
  }
  google.protobuf.Timestamp decided_at = 3;
}

// Plays the rule set of this name. Planet keeps the latest decision by decided_at, so a command sent twice, or after a
// newer one, changes nothing. A name planet keeps no set of is refused, and planet plays on the set it plays.
message PlayRuleSet {
  string rule_set = 1;
  google.protobuf.Timestamp decided_at = 2;
}

// Wipes the map: every tile goes blank, with no holder and no shield, and every fortify lock goes. The map starts a
// new epoch, so every client reads it again. Planet keeps each reset_id it applied, so a reset told twice, or after a
// restart, wipes once. decided_at is when the reset is due: a replay never reaches before it.
message ResetMap {
  string reset_id = 1;
  google.protobuf.Timestamp decided_at = 2;
}

// One stream for both, handled in order. An arena is the blank map an arena battle is fought on, kept apart from the
// world's map, which plays again when it closes. Each command is idempotent by arena_id.
message ArenaCommand {
  oneof command {
    OpenArena open_arena = 1;
    CloseArena close_arena = 2;
  }
}

// Plays the arena's map, blank, while the world's map stays as it is: a new epoch, so every client reads the map again.
// An arena opens once, never after it closed, and never at or after ends_at; planet tells ArenaOpened when it opens. Every
// play is refused for the rule set's arena.freeze after it opens and before ends_at.
message OpenArena {
  string arena_id = 1;
  google.protobuf.Timestamp ends_at = 2;
}

// Deletes the arena's map and plays the world's again, with a new epoch. An arena never opened closes with the map left
// as it is. Either way planet tells ArenaClosed, once.
message CloseArena {
  string arena_id = 1;
}
