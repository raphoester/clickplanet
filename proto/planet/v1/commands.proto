syntax = "proto3";

package planet.v1;

import "google/protobuf/timestamp.proto";

// What another module asks of planet, in planet's words, over Redis Streams. Planet keeps the latest decision on each
// caller by decided_at, so a command sent twice, or after a newer one, changes nothing.

// Refuses the caller's clicks, bombs and shields until a time.
message RefuseCaller {
  oneof caller {
    string scope = 1;
    string account_id = 2;
  }
  google.protobuf.Timestamp until = 3;
  google.protobuf.Timestamp decided_at = 4;
}

// Ends the caller's refusal now.
message AdmitCaller {
  oneof caller {
    string scope = 1;
    string account_id = 2;
  }
  google.protobuf.Timestamp decided_at = 3;
}
