syntax = "proto3";

package planet.v1;

import "google/protobuf/timestamp.proto";
import "planet/v1/planet.proto";

// What another module asks of planet, in planet's words, over Redis Streams.

// What does not fit the account's stack is not granted. A grant_id told twice is granted once.
message GrantCharges {
  string grant_id = 1;
  string account_id = 2;
  BonusKind kind = 3;
  uint32 amount = 4;
}

// Refuses the caller's clicks, bombs and shields until a time. Planet keeps the latest decision on each caller by
// decided_at, so a command sent twice, or after a newer one, changes nothing.
message RefuseCaller {
  oneof caller {
    string scope = 1;
    string account_id = 2;
  }
  google.protobuf.Timestamp until = 3;
  google.protobuf.Timestamp decided_at = 4;
}

// Ends the caller's refusal now, by the same rule.
message AdmitCaller {
  oneof caller {
    string scope = 1;
    string account_id = 2;
  }
  google.protobuf.Timestamp decided_at = 3;
}

// Plays the rule set of this name. Planet keeps the latest decision by decided_at, so a command sent twice, or after a
// newer one, changes nothing. A name planet keeps no set of is refused, and planet plays on the set it plays.
message PlayRuleSet {
  string rule_set = 1;
  google.protobuf.Timestamp decided_at = 2;
}

// Wipes the map: every tile goes blank, with no holder and no shield, and every fortify lock goes. The map starts a
// new epoch, so every client reads it again. Planet keeps each reset_id it applied, so a reset told twice, or after a
// restart, wipes once. decided_at is when the reset is due: a replay never reaches before it.
message ResetMap {
  string reset_id = 1;
  google.protobuf.Timestamp decided_at = 2;
}
