syntax = "proto3";

package planet.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "planet/v1/history.proto";
import "planet/v1/internal.proto";
import "planet/v1/ledger.proto";
import "planet/v1/planet.proto";
import "planet/v1/rules.proto";

// No authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the public router.
service AdminService {
  // Who took tiles for a flag, on one country's ground or the whole map, within the ledger's last 72 hours: one row
  // per account on a scope, latest take first, with any running ban. A scope is an address over IPv4 and its /64 over
  // IPv6. The scope and the account_id are what RevertPlayer and antibot's BanPlayer, UnbanPlayer and InspectPlayer
  // take.
  rpc FindPlayers(FindPlayersRequest) returns (FindPlayersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Who takes the most tiles, every flag and the whole map, within the ledger's last 72 hours: most takes first, then
  // most tiles held. Many takes and few tiles held is a player painting and being painted over, a bot's usual shape.
  rpc TopPlayers(TopPlayersRequest) returns (TopPlayersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Gives each tile the caller still holds back to what it held before the caller's run on it, then forgets the
  // caller's takes, so a second run does nothing. A scope reverts every account on it; an account reverts its takes
  // from every scope. Only a tile still wearing the caller's flag changes. Within the ledger's last 72 hours.
  rpc RevertPlayer(RevertPlayerRequest) returns (RevertPlayerResponse);

  // Gives one account bonus charges, as a caught box would, each kind up to what a hand holds of it under the rules in
  // force, and none of a kind they turn off. before and after say what fit. The player sees them at once on the page.
  rpc GrantCharges(GrantChargesRequest) returns (GrantChargesResponse);

  // The world's map as it was at since, and every act on it until until, for the clip generator; the acts on an arena's
  // map are left out. Megabytes for a day, so the connector does not offer it.
  rpc GetReplay(GetReplayRequest) returns (GetReplayResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lifts the account's hour of wait, so its next change of flag goes at once. A lock of the rules in force still holds.
  rpc ReleaseAllegiance(ReleaseAllegianceRequest) returns (ReleaseAllegianceResponse);

  // Every change the live stream showed in a window of at most 72 hours, from postgres, and who made it, a page at a
  // time.
  rpc GetLedger(GetLedgerRequest) returns (GetLedgerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // InternalService/GetTerritories, for the admin page: the tiles each country holds now.
  rpc GetTerritories(GetTerritoriesRequest) returns (GetTerritoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Every rule set postgres keeps, and the one the game plays now. SaveRuleSet changes one.
  rpc GetRules(GetRulesRequest) returns (GetRulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Makes a set, or replaces its values. A save of the set that plays now takes over at once.
  rpc SaveRuleSet(SaveRuleSetRequest) returns (SaveRuleSetResponse);

  // Moves the world's map onto another board, its land carried over, once: each tile of the new board takes the flag
  // and holder of the old tile it comes from, each old tile's shields are split across its new tiles, each mine moves
  // to the new tile nearest it, live viruses end and fortify locks are settled again. Then every page reloads onto the
  // new board. No take: nobody gains tiles, XP or a mission's progress. Refused while an arena is open, for a board
  // this build does not carry or has no carry-over to, and for the board the map plays already. Run it with dry_run
  // first: it answers the same counts and changes nothing.
  rpc SwitchBoard(SwitchBoardRequest) returns (SwitchBoardResponse);
}

message SwitchBoardRequest {
  // The map to move: "world", the one map that switches.
  string map = 1;
  // The board to play, as /map/boards names it: "earth-2".
  string board = 2;
  // Counts what the switch would carry, and changes nothing.
  bool dry_run = 3;
}

message SwitchBoardResponse {
  // The board the map played, and the one it plays now (or would, on a dry run).
  string from = 1;
  string to = 2;
  // The new board's tiles: carried are those with an old tile to come from, blank those with none (a new coast or
  // island). carried + blank = tiles.
  uint32 tiles = 3;
  uint32 carried = 4;
  uint32 blank = 5;
  // Tiles held by a flag, on the old board before and on the new one after.
  uint32 held_before = 6;
  uint32 held_after = 7;
  // Old tiles no new tile comes from (a coast the new board draws as sea), and how many of them a flag held.
  uint32 dropped = 8;
  uint32 dropped_held = 9;
  // Every shield on the map before and after: the same, but for the shields of the old tiles dropped.
  uint32 shields_before = 10;
  uint32 shields_after = 11;
  // The mines moved to a new tile, and the ones on an old tile dropped.
  uint32 mines_moved = 12;
  uint32 mines_lost = 13;
  // Live viruses, which end.
  uint32 viruses_ended = 14;
  // Provinces locked on the old board, whose locks are dropped; the new board settles its own.
  uint32 locks_dropped = 15;
  // When the map switched; unset on a dry run.
  google.protobuf.Timestamp switched_at = 16;
}

message GetReplayRequest {
  google.protobuf.Timestamp since = 1;
  // Unset is now.
  google.protobuf.Timestamp until = 2;
}

message GetReplayResponse {
  // The world's map as it was at `since`.
  GetMapResponse opening = 1;
  // What changed on the world's map: no take made on an arena's map.
  repeated ReplayedEvent events = 2;
  google.protobuf.Timestamp since = 3;
  google.protobuf.Timestamp until = 4;
  // Each stretch of the window an arena's map played instead of the world's, whose takes are left out; the world's map
  // came back as it was.
  repeated ReplayAside asides = 5;
  // The eras of the world's map the window covers, oldest first: the one it played at since, then each that started
  // in the window. An event's tile ids are the board of the era in force at its time.
  repeated BoardEra eras = 6;
}

message ReplayAside {
  google.protobuf.Timestamp opened_at = 1;
  // Unset while the arena still plays.
  google.protobuf.Timestamp closed_at = 2;
}

message ReplayedEvent {
  google.protobuf.Timestamp at = 1;
  // A tile update, a bomb, a spread or an enclosure, as the live stream sent it.
  PlanetEvent event = 2;
}

message GrantChargesRequest {
  string account_id = 1;
  reserved 2, 3, 7;
  reserved "refill", "bomb", "virus";

  // Refills, up to what a hand holds.
  uint32 refills = 10;

  // Bombs, up to what a hand holds.
  uint32 bombs = 11;

  uint32 enclosures = 4;
  uint32 spread_clicks = 5;

  uint32 shields = 6;

  // Viruses, up to what a hand holds.
  uint32 viruses = 12;

  // Mines, up to what a hand holds.
  uint32 mines = 8;

  // Rallies, up to what a hand holds.
  uint32 rallies = 9;
}

message GrantChargesResponse {
  string account_id = 1;
  ChargesHeld before = 2;
  ChargesHeld after = 3;
}

message ReleaseAllegianceRequest {
  string account_id = 1;
}

message ReleaseAllegianceResponse {
  // The rules in force lock every flag: the change waits for them to end.
  bool locked = 1;
}

message FindPlayersRequest {
  // A country id: ISO 3166-1 alpha-2 in lower case, "fr".
  string flag_country_id = 1;
  // Empty is the whole map.
  string area_country_id = 2;
  // Unset is every player.
  uint32 limit = 3;
}

message FindPlayersResponse {
  repeated Player players = 1;
  uint32 total = 2;
}

message TopPlayersRequest {
  // Unset is every player.
  uint32 limit = 1;
}

message TopPlayersResponse {
  repeated Player players = 1;
  uint32 total = 2;
}

message Player {
  reserved 7;
  reserved "offence";

  string scope = 1;
  string account_id = 12;
  uint32 tiles = 2;
  google.protobuf.Timestamp first_at = 3;
  google.protobuf.Timestamp last_at = 4;
  optional bool banned = 5;
  google.protobuf.Timestamp banned_until = 6;
  google.protobuf.Duration active_for = 8;
  double tiles_per_minute = 9;
  uint32 takes = 10;
  double takes_per_minute = 11;
  string flag_country_id = 13;
}

message RevertPlayerRequest {
  // An address, read as its scope. Never with account_id.
  string scope = 1;
  // Never with scope.
  string account_id = 3;
  // Counts what would go back, and changes nothing.
  bool dry_run = 2;
}

message RevertPlayerResponse {
  string scope = 1;
  string account_id = 5;
  uint32 touched = 2;
  uint32 held = 3;
  uint32 restored = 4;
}

message GetRulesRequest {}

message GetRulesResponse {
  // Every set postgres keeps, "default" first, as kept: one that cannot play too, so it can be mended.
  repeated RuleSet sets = 1;
  // The set the game plays now.
  string playing = 2;
}

message RuleSet {
  string name = 1;
  Rules rules = 2;
}

message SaveRuleSetRequest {
  RuleSet set = 1;
}

message SaveRuleSetResponse {}
