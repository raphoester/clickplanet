syntax = "proto3";

package planet.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "planet/v1/internal.proto";
import "planet/v1/planet.proto";
import "planet/v1/rules.proto";

// No authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the public router.
service AdminService {
  rpc ReassignCountry(ReassignCountryRequest) returns (ReassignCountryResponse);

  rpc FindPlayers(FindPlayersRequest) returns (FindPlayersResponse);

  rpc TopPlayers(TopPlayersRequest) returns (TopPlayersResponse);

  // Deprecated: antibot.v1.AdminService/BanPlayer, which answers it on this path until the backoffice calls it there.
  rpc BanPlayer(BanPlayerRequest) returns (BanPlayerResponse) {
    option deprecated = true;
  }

  // Deprecated: antibot.v1.AdminService/UnbanPlayer, which answers it on this path until the backoffice calls it there.
  rpc UnbanPlayer(UnbanPlayerRequest) returns (UnbanPlayerResponse) {
    option deprecated = true;
  }

  rpc RevertPlayer(RevertPlayerRequest) returns (RevertPlayerResponse);

  rpc PaintRandomTiles(PaintRandomTilesRequest) returns (PaintRandomTilesResponse);

  // Deprecated: antibot.v1.AdminService/InspectPlayer, which answers it on this path until the backoffice calls it there.
  rpc InspectPlayer(InspectPlayerRequest) returns (InspectPlayerResponse) {
    option deprecated = true;
  }

  rpc GrantCharges(GrantChargesRequest) returns (GrantChargesResponse);

  rpc GetReplay(GetReplayRequest) returns (GetReplayResponse);

  // Every change the live stream showed in a window of at most 72 hours, from postgres, and who made it, a page at a
  // time.
  rpc GetLedger(GetLedgerRequest) returns (GetLedgerResponse);

  // InternalService/GetTerritories, for the admin page: the tiles each country holds now.
  rpc GetTerritories(GetTerritoriesRequest) returns (GetTerritoriesResponse);

  rpc GetRules(GetRulesRequest) returns (GetRulesResponse);

  // Makes a set, or replaces its values. A set that plays now is FailedPrecondition: the rules in force change only
  // through the schedule.
  rpc SaveRuleSet(SaveRuleSetRequest) returns (SaveRuleSetResponse);
}

message GetLedgerRequest {
  google.protobuf.Timestamp since = 1;
  // Unset is now.
  google.protobuf.Timestamp until = 2;
  // The next_page of the page before; empty is the first.
  string page = 3;
}

message GetLedgerResponse {
  // Oldest first: a click that took a tile or struck its shield, a tile a spread, an enclosure or a bomb took or
  // emptied, a shield placed or raised. A shield a bomb struck is left out: it changed no hands.
  repeated LedgerChange changes = 1;
  // Empty on the last page.
  string next_page = 2;
}

message LedgerChange {
  google.protobuf.Timestamp at = 1;
  // As the live stream sent it.
  TileUpdate update = 2;
  // Who made it, to compare and not to read: "account:<id>", or "scope:<address>" for a change with no account.
  string by = 3;
}

message GetReplayRequest {
  google.protobuf.Timestamp since = 1;
  // Unset is now.
  google.protobuf.Timestamp until = 2;
}

message GetReplayResponse {
  // The map as it was at `since`.
  GetMapResponse opening = 1;
  repeated ReplayedEvent events = 2;
  google.protobuf.Timestamp since = 3;
  google.protobuf.Timestamp until = 4;
}

message ReplayedEvent {
  google.protobuf.Timestamp at = 1;
  // A tile update, a bomb, a spread or an enclosure, as the live stream sent it.
  PlanetEvent event = 2;
}

message GrantChargesRequest {
  string account_id = 1;
  bool refill = 2;
  bool bomb = 3;
  uint32 enclosures = 4;
  uint32 spread_clicks = 5;

  uint32 shields = 6;
}

message GrantChargesResponse {
  string account_id = 1;
  ChargesHeld before = 2;
  ChargesHeld after = 3;
}

message PaintRandomTilesRequest {
  string flag_country_id = 1;
  string area_country_id = 2;
  uint32 count = 3;
  double proximity = 4;
  bool dry_run = 5;
}

message PaintRandomTilesResponse {
  uint32 eligible = 1;
  uint32 picked = 2;
  uint32 painted = 3;
  uint32 outside_area = 4;
}

message InspectPlayerRequest {
  string scope = 1;
  string account_id = 2;
}

message InspectPlayerResponse {
  string scope = 1;
  string account_id = 17;

  optional bool tracked = 2;

  optional bool banned = 3;
  google.protobuf.Timestamp banned_until = 4;
  uint32 offence = 5;
  uint32 flags = 6;
  google.protobuf.Timestamp pardoned_until = 18;

  repeated WatchdogReading readings = 7;

  uint32 suspects = 8;
  uint32 min_suspects = 9;
  optional bool guilty = 10;

  uint32 clicks = 11;
  google.protobuf.Duration active_for = 12;
  google.protobuf.Duration longest_gap = 13;
  google.protobuf.Timestamp last_click_at = 14;
  string top_country = 15;
  uint32 top_country_clicks = 16;
}

message WatchdogReading {
  string watchdog = 1;
  string level = 2;
  string evidence = 3;
  google.protobuf.Timestamp at = 4;
}

message FindPlayersRequest {
  string flag_country_id = 1;
  string area_country_id = 2;
  uint32 limit = 3;
}

message FindPlayersResponse {
  repeated Player players = 1;
  uint32 total = 2;
}

message TopPlayersRequest {
  uint32 limit = 1;
}

message TopPlayersResponse {
  repeated Player players = 1;
  uint32 total = 2;
}

message Player {
  string scope = 1;
  string account_id = 12;
  uint32 tiles = 2;
  google.protobuf.Timestamp first_at = 3;
  google.protobuf.Timestamp last_at = 4;
  optional bool banned = 5;
  google.protobuf.Timestamp banned_until = 6;
  // Planet keeps no offence: antibot.v1.AdminService/InspectPlayer says it.
  uint32 offence = 7 [deprecated = true];
  google.protobuf.Duration active_for = 8;
  double tiles_per_minute = 9;
  uint32 takes = 10;
  double takes_per_minute = 11;
  string flag_country_id = 13;
}

message BanPlayerRequest {
  string scope = 1;
  string account_id = 3;
  google.protobuf.Duration duration = 2;
}

message BanPlayerResponse {
  string scope = 1;
  string account_id = 5;
  uint32 offence = 2;
  google.protobuf.Timestamp banned_until = 3;
  bool enforced = 4;
}

message UnbanPlayerRequest {
  string scope = 1;
  string account_id = 2;
}

// The ban that was lifted. Its offence no longer counts.
message UnbanPlayerResponse {
  string scope = 1;
  string account_id = 2;
  uint32 offence = 3;
  google.protobuf.Timestamp banned_until = 4;
  google.protobuf.Timestamp pardoned_until = 5;
}

message RevertPlayerRequest {
  string scope = 1;
  string account_id = 3;
  bool dry_run = 2;
}

message RevertPlayerResponse {
  string scope = 1;
  string account_id = 5;
  uint32 touched = 2;
  uint32 held = 3;
  uint32 restored = 4;
}

message ReassignCountryRequest {
  string from_country_id = 1;
  string to_country_id = 2;
  bool dry_run = 3;
}

message ReassignCountryResponse {
  uint32 from_before = 1;
  uint32 to_before = 2;
  uint32 moved = 3;
  uint32 from_after = 4;
  uint32 to_after = 5;
}

message GetRulesRequest {}

message GetRulesResponse {
  // Every set postgres keeps, "default" first, as kept: one that cannot play too, so it can be mended.
  repeated RuleSet sets = 1;
  // The set the game plays now.
  string playing = 2;
}

message RuleSet {
  string name = 1;
  Rules rules = 2;
}

message SaveRuleSetRequest {
  RuleSet set = 1;
}

message SaveRuleSetResponse {}
