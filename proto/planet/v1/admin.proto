syntax = "proto3";

package planet.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Operator tools. Served only on the backend's loopback admin listener
// (httpServer.adminBindAddress), never on the public router: nothing here is
// authenticated.
service AdminService {
  // Gives every tile one country holds to another, while the game runs. Each
  // tile goes out on the stream as an ordinary TileUpdate. dry_run counts and
  // moves nothing.
  rpc ReassignCountry(ReassignCountryRequest) returns (ReassignCountryResponse);

  // Who took tiles for the flag on the area's ground, held or painted over
  // since, latest take first. Read from the ledger (ledger.retention).
  rpc FindPlayers(FindPlayersRequest) returns (FindPlayersResponse);

  // Who took the most tiles, over every flag and the whole map: most takes
  // first, then most tiles held. Read from the same ledger as FindPlayers.
  rpc TopPlayers(TopPlayersRequest) returns (TopPlayersResponse);

  // The antibot's shadow ban, on a scope a person picked. It counts as an offence.
  rpc BanPlayer(BanPlayerRequest) returns (BanPlayerResponse);

  // Gives back every tile the scope still holds to what it held before the
  // scope's current run on it. dry_run counts and restores nothing.
  rpc RevertPlayer(RevertPlayerRequest) returns (RevertPlayerResponse);

  // Paints count random tiles with a flag, starting on one country's ground.
  // proximity favours tiles that touch the ones already picked, and a patch
  // may grow past the country's border. dry_run picks and paints nothing.
  rpc PaintRandomTiles(PaintRandomTilesRequest) returns (PaintRandomTilesResponse);

  // What the antibot holds on a scope: every watchdog's reading, what the jury
  // would decide now, and any running ban. Reads only.
  rpc InspectPlayer(InspectPlayerRequest) returns (InspectPlayerResponse);
}

message PaintRandomTilesRequest {
  string flag_country_id = 1;
  // The country a fresh draw lands in. A patch grows from there into any
  // tile not wearing the flag, across the border too.
  string area_country_id = 2;
  uint32 count = 3;
  // From 0 to 1. 0 picks anywhere in the area; 1 grows one patch while it can.
  double proximity = 4;
  bool dry_run = 5;
}

message PaintRandomTilesResponse {
  // Tiles of the area that do not wear the flag yet.
  uint32 eligible = 1;
  // Below count only when nothing is left to pick.
  uint32 picked = 2;
  // Picked tiles that nobody took between the pick and the paint.
  uint32 painted = 3;
  // Picked tiles past the area's border.
  uint32 outside_area = 4;
}

message InspectPlayerRequest {
  // A scope, or any address, which is read as its scope.
  string scope = 1;
}

message InspectPlayerResponse {
  string scope = 1;

  // False when the jury has not seen the scope inside antiBot.jury.trackWindow:
  // the readings are then all clear and the click summary is empty.
  optional bool tracked = 2;

  // Running whether or not antiBot.shadowBan.enforce is on.
  optional bool banned = 3;
  google.protobuf.Timestamp banned_until = 4;
  uint32 offence = 5;
  uint32 flags = 6;

  // One per watchdog turned on, in the order the jury asks them.
  repeated WatchdogReading readings = 7;

  // Watchdogs at suspect or certain, inside antiBot.jury.suspicionWindow.
  uint32 suspects = 8;
  uint32 min_suspects = 9;
  // What the jury would decide if the scope clicked now: one certain, or
  // min_suspects suspects. A ban still waits for antiBot.shadowBan.reflagInterval.
  optional bool guilty = 10;

  uint32 clicks = 11;
  // Last click minus first click the jury remembers.
  google.protobuf.Duration active_for = 12;
  google.protobuf.Duration longest_gap = 13;
  google.protobuf.Timestamp last_click_at = 14;
  // Declared by the client: context, never evidence.
  string top_country = 15;
  uint32 top_country_clicks = 16;
}

message WatchdogReading {
  string watchdog = 1;
  // clear, suspect or certain. A verdict older than the suspicion window reads clear.
  string level = 2;
  // The rule and its numbers, as the "antibot ban" log line words them after the level. Empty
  // when the watchdog had nothing to say.
  string evidence = 3;
  // The click the reading was taken on.
  google.protobuf.Timestamp at = 4;
}

message FindPlayersRequest {
  string flag_country_id = 1;
  // The country whose ground the tiles sit on. Empty is the whole map.
  string area_country_id = 2;
  // 20 when unset.
  uint32 limit = 3;
}

message FindPlayersResponse {
  repeated Player players = 1;
  // How many scopes matched, before the limit.
  uint32 total = 2;
}

message TopPlayersRequest {
  // 20 when unset.
  uint32 limit = 1;
}

message TopPlayersResponse {
  repeated Player players = 1;
  // How many scopes took any tile, before the limit.
  uint32 total = 2;
}

message Player {
  // The address for IPv4, the /64 for IPv6: what the throttle and the ban key on.
  string scope = 1;
  // Tiles it still holds: its take is the tile's latest and the paint is still there.
  uint32 tiles = 2;
  google.protobuf.Timestamp first_at = 3;
  google.protobuf.Timestamp last_at = 4;
  // Optional so JSON always carries it: a plain bool is dropped when false.
  optional bool banned = 5;
  google.protobuf.Timestamp banned_until = 6;
  uint32 offence = 7;
  // last_at minus first_at.
  google.protobuf.Duration active_for = 8;
  // tiles over active_for. 0 when active_for is 0.
  double tiles_per_minute = 9;
  // Every take it made, held or painted over since; a tile taken twice counts twice.
  uint32 takes = 10;
  // takes over active_for. 0 when active_for is 0.
  double takes_per_minute = 11;
}

message BanPlayerRequest {
  // A scope, or any address, which is banned as its scope.
  string scope = 1;
  // Unset takes the ladder's step for the offence (antiBot.shadowBan.banDurations).
  google.protobuf.Duration duration = 2;
}

message BanPlayerResponse {
  string scope = 1;
  uint32 offence = 2;
  google.protobuf.Timestamp banned_until = 3;
  // False when antiBot.shadowBan.enforce is off: the ban is kept but drops nothing.
  bool enforced = 4;
}

message RevertPlayerRequest {
  string scope = 1;
  bool dry_run = 2;
}

message RevertPlayerResponse {
  string scope = 1;
  // Tiles the scope took, and those it still holds.
  uint32 touched = 2;
  uint32 held = 3;
  uint32 restored = 4;
}

message ReassignCountryRequest {
  string from_country_id = 1;
  string to_country_id = 2;
  bool dry_run = 3;
}

message ReassignCountryResponse {
  uint32 from_before = 1;
  uint32 to_before = 2;
  uint32 moved = 3;
  // Read again at the end: a caller still clicking can retake tiles behind the scan.
  uint32 from_after = 4;
  uint32 to_after = 5;
}
