syntax = "proto3";

package planet.v1;

import "google/protobuf/timestamp.proto";
import "planet/v1/planet.proto";

// The tiles one ledger event took, in its order: a click's one, a spread's few, an enclose's every tile inside. An event
// that took more than a part holds comes in several parts, each at the event's position, in order.
message TilesTaken {
  string account_id = 1;
  // The flag that took them.
  string country = 2;
  google.protobuf.Timestamp taken_at = 3;
  // The ledger's: a receiver keeps the position and index past the last tile it counted.
  uint64 position = 4;
  repeated TakenTile tiles = 5;
}

message TakenTile {
  uint32 tile_id = 1;
  // Its place among the tiles its ledger event took, across the parts.
  uint32 index = 2;
  // The flag it wore before.
  string previous = 3;
  // The country whose ground it is.
  string ground = 4;
  // Where the tile is on the globe.
  GlobePoint point = 5;
}

message BombLanded {
  string country = 1;
  uint32 tile_id = 2;
  string ground = 3;
  uint32 cleared = 4;
  google.protobuf.Timestamp landed_at = 5;
  string account_id = 6;
  uint64 position = 7;
  uint32 landmass_id = 8;
}

// A flag knocked out of an arena: another flag's take felled its capital, and every other tile it held went blank.
message FlagKnockedOut {
  string country = 1;
  // The flag whose take felled the capital.
  string by = 2;
  // The capital.
  uint32 tile_id = 3;
  string account_id = 4;
  // How many other tiles it held.
  uint32 cleared = 5;
  google.protobuf.Timestamp knocked_out_at = 6;
  uint64 position = 7;
}

message Fortified {
  string country = 1;
  uint32 landmass_id = 2;
  uint32 tiles = 3;
  google.protobuf.Timestamp fortified_at = 4;
  string ground = 5;
  string account_id = 6;
  uint64 position = 7;
}

// A shield a player placed, with the tile's shields after it.
message ShieldPlaced {
  string account_id = 1;
  uint32 tile_id = 2;
  string country = 3;
  uint32 shields = 4;
  google.protobuf.Timestamp placed_at = 5;
  uint64 position = 6;
}

// The shields one ledger event broke, a click's, a spread's, an enclose's or a bomb's: each tile kept its flag, owner,
// and lost one shield. An event that broke more than a part holds comes in several parts, as TilesTaken does.
message ShieldsStruck {
  // Empty for none.
  string account_id = 1;
  // The flag that struck them.
  string country = 2;
  google.protobuf.Timestamp struck_at = 3;
  uint64 position = 4;
  repeated StruckTile tiles = 5;
}

message StruckTile {
  uint32 tile_id = 1;
  // Its place among the shields its ledger event broke, across the parts.
  uint32 index = 2;
  string owner = 3;
}

// Every click a caller tried, whatever came of it. The callers' facts are told in the order they ended, each at a
// later time than the one before: a time names its fact.
message ClickTried {
  string scope = 1;
  string account_id = 2;
  bool linked = 3;
  reserved 4;
  reserved "account_created_at";
  uint32 tile_id = 5;
  string country = 6;
  google.protobuf.Timestamp tried_at = 7;
  ClickOutcome outcome = 8;
  // The flag the tile wore before the try.
  string owner = 9;
  // Unset for a tile off the map.
  GlobePoint position = 10;
  // How many times faster than the plain pace every bucket refilled when the click was tried; 0 is the plain pace.
  double tempo = 11;
  // The click left the caller's bank empty: less than one click in it.
  bool dry = 12;
}

enum ClickOutcome {
  CLICK_OUTCOME_UNSPECIFIED = 0;
  CLICK_OUTCOME_TAKEN = 1;
  // A shield took the click.
  CLICK_OUTCOME_STRUCK = 2;
  // The tile already wore the flag.
  CLICK_OUTCOME_UNCHANGED = 3;
  CLICK_OUTCOME_THROTTLED = 4;
  // The caller is refused.
  CLICK_OUTCOME_REFUSED = 5;
  // Not the flag the account plays for.
  CLICK_OUTCOME_OTHER_FLAG = 6;
  // An unknown flag, a tile off the map, or two bonuses together.
  CLICK_OUTCOME_INVALID = 7;
  CLICK_OUTCOME_FAILED = 8;
  // In an arena, a tile next to none of the flag's land and across none of its waters.
  CLICK_OUTCOME_OUT_OF_REACH = 9;
}

message MapRead {
  string scope = 1;
  // The share of the map the read held.
  double maps = 2;
  // A bound outside the map, which no page load asks for.
  bool off_map = 3;
  google.protobuf.Timestamp read_at = 4;
}

message StreamOpened {
  string scope = 1;
  google.protobuf.Timestamp opened_at = 2;
}

// The flag an account plays for, set or changed by PledgeAllegiance. A pledge of the flag it already plays for tells
// nothing.
message AllegiancePledged {
  string account_id = 1;
  string country = 2;
  // Empty for the account's first flag.
  string previous = 3;
  google.protobuf.Timestamp pledged_at = 4;
}
