syntax = "proto3";

package planet.v1;

import "google/protobuf/duration.proto";
import "planet/v1/planet.proto";

// Every value a player feels. "default" holds every value; another set holds the values it changes, and plays default's
// for every value it leaves unset. Postgres keeps it as protojson (planet.rule_sets.rules).
message Rules {
  ClickRules clicks = 1;
  TollRules toll = 2;
  reserved 3;
  reserved "bonuses";
  // The map takes no play: Click, DropBomb, PlaceShield, UseRefill, UseVirus, LayMine, LayTrap and CallRally are
  // refused, no virus spreads, and GetFreeze answers frozen. The map still loads and streams.
  optional bool frozen = 4;
  // No account changes its flag: PledgeAllegiance refuses another flag to an account that holds one. A first flag is
  // still taken.
  optional bool allegiance_locked = 5;
  ArenaRules arena = 6;
  // How an arena's fresh map starts.
  Seed seed = 7;
  // A take of a flag lands only on its land, on a tile next to it, or at the far end of a bridge from it.
  optional bool reach = 8;
  CapitalRules capitals = 9;
  ChargeRules charges = 10;
}

// A battle played with on is an arena battle: it is fought on a fresh map, and the map from before comes back when it
// ends. Never on in default.
message ArenaRules {
  optional bool on = 1;
  // Every play is refused this long after the fresh map plays and before the battle ends. 0 to 30 s.
  google.protobuf.Duration freeze = 2;
  reserved 3;
  reserved "capital_shields";
  // The board the fresh map plays, as /map/boards names it ("siege-1"): one this server carries and planet keeps a row
  // of, or the arena does not open. Unset or empty: the board the world plays.
  optional string board = 4;
}

// One pattern; a set that holds another pattern than default's plays its own alone.
message Seed {
  oneof pattern {
    CapitalSeed capitals = 1;
  }
}

// Each country's capital, held by its country, with this many shields, past charges.shield.per_tile. 0 to 255.
message CapitalSeed {
  optional uint32 shields = 1;
}

message CapitalRules {
  // A take of a flag's capital by another flag clears every other tile of the flag, and the flag is out.
  optional bool knock_out = 1;
  // No shield is placed on a capital, and a fortify skips it.
  optional bool fixed_shields = 2;
  // A take that cuts a flag's land from its capital clears the land cut off: a flag's tiles hold together through its
  // own tiles and the bridges whose both ends it holds.
  optional bool cut_off = 3;
}

message ClickRules {
  // How many times faster than per_second every bucket refills.
  optional double tempo = 1;
  // One account's refill, a click a second, and its bank.
  optional double per_second = 2;
  optional uint32 burst = 3;
  // The address's bucket, in accounts; an IPv6 /64's has its own.
  optional double scope_multiplier = 4;
  optional double v6_scope_multiplier = 5;
  // The bucket every guest behind an address shares, in accounts.
  optional double guest_scope_multiplier = 6;
  // How many times as fast a signed-in account refills.
  optional double linked_multiplier = 7;
  // What a new account's bank holds when it is made; it earns the rest at per_second.
  optional double new_account_clicks = 8;
  // How long a new account refills at the signed-in pace, guest or not. 0 is off.
  google.protobuf.Duration fast_start = 9;
}

message TollRules {
  // Rising shares: from `share` of every tile on the map, a country refills `slowdown` times slower. None is no toll. A
  // set that holds `toll` holds every step.
  repeated TollStep steps = 1;
}

// The wallet's: how much of each charge a hand holds, and what each does when it is spent.
message ChargeRules {
  SpreadRules spread = 1;
  BombRules bomb = 2;
  EncloseRules enclose = 3;
  ShieldRules shield = 4;
  VirusRules virus = 5;
  MineRules mine = 6;
  RallyRules rally = 7;
  RefillRules refill = 8;
  TrapRules trap = 9;
}

message RefillRules {
  // How many refills a hand holds at most.
  optional uint32 held = 1;
}

message SpreadRules {
  // The pool a hand holds at most.
  optional uint32 clicks = 1;
  reserved 2;
  reserved "max_per_box";
  // How far a spread reaches: every tile within this many steps of the tile clicked. 1 to 3.
  optional uint32 rings = 3;
  // A click with spread on needs no charge and spends none.
  optional bool unlimited = 4;
  // No spread: a click with spread on takes its tile alone and spends nothing, and a grant keeps none, a box's, a
  // quiz's or an operator's. The spread clicks held are kept. Never with unlimited.
  optional bool off = 5;
}

message BombRules {
  // The blast's radius, in tile spacings.
  optional double rings = 1;
  // No bomb: a bomb held is not dropped (DropBomb answers a BombRefusal), and a grant keeps none, a box's, a quiz's or
  // an operator's. The bombs held are kept.
  optional bool off = 2;
  // How many bombs a hand holds at most.
  optional uint32 held = 3;
}

message EncloseRules {
  optional uint32 max_tiles = 1;
  // The stack a hand holds at most.
  optional uint32 held = 2;
  reserved 3;
  reserved "max_per_box";
  // A click with enclose on needs no charge and spends none.
  optional bool unlimited = 4;
  // No enclosure: a click with enclose on closes nothing and spends nothing, and a grant keeps none, a box's, a quiz's
  // or an operator's. The enclosures held are kept. Never with unlimited.
  optional bool off = 5;
}

message ShieldRules {
  // The stack a hand holds at most.
  optional uint32 held = 1;
  reserved 2, 3;
  reserved "min_per_box", "max_per_box";
  // At most 255.
  optional uint32 per_tile = 4;
}

message VirusRules {
  // How many infections a virus makes at most, a tile taken or a shield struck each, its first included. 1 to 1024.
  optional uint32 infections = 1;
  // How long a virus waits between two spreads. 1 s to 10 min.
  google.protobuf.Duration every = 2;
  // How many viruses a hand holds at most.
  optional uint32 held = 3;
}

message MineRules {
  // How many mines a hand holds at most.
  optional uint32 held = 1;
  // How many rings of tiles around its own a mine's blast takes. 1 to 3.
  optional uint32 rings = 2;
}

message TrapRules {
  // How many traps a hand holds at most.
  optional uint32 held = 1;
  // How many clicks a trap takes from the bank of the player whose take sprang it, to nobody. The bank goes down to minus
  // one bank at most. At least 1.
  optional uint32 clicks = 2;
}

message RallyRules {
  // How many rallies a hand holds at most.
  optional uint32 held = 1;
  // The ring's radius, in tile spacings. 1 to 50.
  optional double rings = 2;
  // How long a rally lasts. 10 s to 30 min.
  google.protobuf.Duration lasts = 3;
  // What a click inside a rally's ring of its flag takes from the bank, in clicks. 0.1 to 1.
  optional double cost = 4;
  // No rally: a call is refused (FailedPrecondition) and the rally stays held, and a grant keeps none, a box's, a quiz's,
  // a level's fill or an operator's. The rallies held are kept.
  optional bool off = 5;
}
