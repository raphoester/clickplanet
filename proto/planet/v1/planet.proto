syntax = "proto3";

package planet.v1;

service ClickService {
  rpc Click(ClickRequest) returns (ClickResponse);

  // Not NO_SIDE_EFFECTS: the answer is about this instant, and a cached one lies.
  rpc GetBudget(GetBudgetRequest) returns (GetBudgetResponse);

  rpc MapDensity(MapDensityRequest) returns (MapDensityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetMap(GetMapRequest) returns (GetMapResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListenForEvents(ListenForEventsRequest) returns (stream PlanetEvent);

  rpc ClaimBonus(ClaimBonusRequest) returns (ClaimBonusResponse);

  rpc DropBomb(DropBombRequest) returns (DropBombResponse);

  rpc UseRefill(UseRefillRequest) returns (UseRefillResponse);

  // Not NO_SIDE_EFFECTS: the answer is about one caller now, and a cached one lies.
  rpc GetCharges(GetChargesRequest) returns (GetChargesResponse);

  rpc GetBonusRules(GetBonusRulesRequest) returns (GetBonusRulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc OpenQuiz(OpenQuizRequest) returns (OpenQuizResponse);

  rpc AnswerQuiz(AnswerQuizRequest) returns (AnswerQuizResponse);
}

message ClickBudget {
  double tokens = 1;

  uint32 capacity = 2;

  double refill_per_second = 3;

  reserved 4, 7;

  double slowdown = 8;

  double share = 5;

  double next_share = 6;
  double next_slowdown = 9;

  double linked_multiplier = 10;

  SharedWith shared_with = 11;

  // The country the slowdown, the share and the next step are for: the caller's
  // main flag, the one it clicks for most, once a click for the country asked
  // about counts. So a player who painted France all day and picks Spain is
  // still priced as France. Empty from a server too old to know, which means the
  // country asked about.
  string country = 12;
}

enum SharedWith {
  SHARED_WITH_UNSPECIFIED = 0;

  SHARED_WITH_NOBODY = 1;

  SHARED_WITH_GUESTS = 2;

  SHARED_WITH_NETWORK = 3;
}

message ClickRequest {
  uint32 tile_id = 1;
  string country_id = 2;

  bool spread = 3;

  bool enclose = 4;
}

message ClickResponse {
  ClickBudget budget = 1;
}

message GetBudgetRequest {
  string country_id = 1;
}

message GetBudgetResponse {
  ClickBudget budget = 1;
}

message MapDensityRequest {}

message MapDensityResponse {
  uint32 density = 1;
}

message GetMapRequest {
  uint32 start_tile_id = 1;
  uint32 end_tile_id = 2;
}

message GetMapResponse {
  uint32 start_tile_id = 1;

  repeated string codes = 2;

  bytes tiles = 3;
}

message ListenForEventsRequest {}

message PlanetEvent {
  oneof event {
    TileUpdate tile_update = 1;
    Heartbeat heartbeat = 2;

    BonusOffered bonus_offered = 3;

    BonusTaken bonus_taken = 4;

    BombDropped bomb_dropped = 5;

    TilesEnclosed tiles_enclosed = 6;

    TilesSpread tiles_spread = 7;

    QuizOffered quiz_offered = 8;
  }
}

message ChargesHeld {
  bool refill = 4;

  bool bomb = 1;

  uint32 enclosures = 2;

  uint32 spread_clicks_left = 3;
}

message GetChargesRequest {}

message GetChargesResponse {
  ChargesHeld charges = 1;
}

message GetBonusRulesRequest {}

message GetBonusRulesResponse {
  double blast_radius = 1;

  uint32 enclosure_max_tiles = 2;

  uint32 spread_clicks = 3;

  uint32 enclosures = 4;

  bool home_soil = 5;
}

enum BonusKind {
  BONUS_KIND_UNSPECIFIED = 0;

  BONUS_KIND_REFILL = 5;

  BONUS_KIND_SPREAD_CLICKS = 2;

  BONUS_KIND_BOMB = 3;

  BONUS_KIND_ENCLOSE_CLICKS = 4;
}

message BonusOffered {
  string token = 1;

  uint32 seed = 2;

  BonusKind kind = 3;

  int64 expires_at_unix_ms = 5;
}

message BonusTaken {
  string country_id = 1;

  BonusKind kind = 2;

  string quiz_subject_country_id = 3;
}

message ClaimBonusRequest {
  string token = 1;

  string country_id = 2;
}

message ClaimBonusResponse {
  BonusKind kind = 2;

  uint32 amount = 8;

  ChargesHeld charges = 7;
}

message QuizOffered {
  string token = 1;

  int64 expires_at_unix_ms = 2;

  reserved 3;
}

message OpenQuizRequest {
  string token = 1;
}

message OpenQuizResponse {
  string question = 1;

  repeated string choices = 2;

  int64 deadline_unix_ms = 3;

  double answer_seconds = 4;
}

message AnswerQuizRequest {
  string token = 1;

  uint32 choice = 2;

  string country_id = 3;
}

message AnswerQuizResponse {
  bool correct = 1;

  uint32 correct_choice = 2;

  BonusKind kind = 3;

  uint32 amount = 4;

  ChargesHeld charges = 5;
}

message UseRefillRequest {
  string country_id = 1;
}

message UseRefillResponse {
  ClickBudget budget = 1;

  ChargesHeld charges = 2;
}

message GlobePoint {
  double x = 1;
  double y = 2;
  double z = 3;
}

message DropBombRequest {
  GlobePoint target = 1;

  string country_id = 2;
}

message DropBombResponse {}

message BombDropped {
  uint32 tile_id = 1;

  string country_id = 2;

  double radius = 3;

  repeated uint32 cleared_tile_ids = 4;

  GlobePoint point = 5;
}

message TilesEnclosed {
  string country_id = 1;

  uint32 closing_tile_id = 2;

  repeated uint32 wall_tile_ids = 3;

  repeated uint32 filled_tile_ids = 4;

  bool yours = 5;
}

message TilesSpread {
  string country_id = 1;

  uint32 tile_id = 2;

  repeated uint32 spread_tile_ids = 3;
}

message Heartbeat {}

message TileUpdate {
  uint32 tile_id = 1;
  string country_id = 2;
  string previous_country_id = 3;

  // Only the tile a click named: never a spread's neighbour, an enclosure's inside or a moderator's write.
  bool clicked = 4;
}
