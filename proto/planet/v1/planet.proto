syntax = "proto3";

package planet.v1;

service ClickService {
  rpc Click(ClickRequest) returns (ClickResponse);

  rpc MapDensity(MapDensityRequest) returns (MapDensityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetMap(GetMapRequest) returns (GetMapResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListenForEvents(ListenForEventsRequest) returns (stream PlanetEvent);
}

message ClickRequest {
  uint32 tile_id = 1;
  string country_id = 2;
}

message ClickResponse {}

message MapDensityRequest {}

message MapDensityResponse {
  uint32 density = 1;
}

message GetMapRequest {
  uint32 start_tile_id = 1;
  uint32 end_tile_id = 2;
}

message GetMapResponse {
  uint32 start_tile_id = 1;

  repeated string codes = 2;

  bytes tiles = 3;
}

message ListenForEventsRequest {}

// The one live stream this API has. Everything it pushes travels in this
// envelope, so a new kind of event is a new case below rather than a second
// stream: one connection per client, one route, and a client that does not
// know a case skips it instead of breaking.
//
// Heartbeat is what keeps a quiet stream alive — Cloudflare cuts a silent
// response at ~125s with a 524.
message PlanetEvent {
  oneof event {
    TileUpdate tile_update = 1;
    Heartbeat heartbeat = 2;
  }
}

message Heartbeat {}

message TileUpdate {
  uint32 tile_id = 1;
  string country_id = 2;
  string previous_country_id = 3;
}
