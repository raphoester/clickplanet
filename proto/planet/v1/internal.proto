syntax = "proto3";

package planet.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "planet/v1/history.proto";
import "planet/v1/ledger.proto";
import "planet/v1/planet.proto";
import "planet/v1/rules.proto";
import "planet/v1/totals.proto";

service InternalService {
  // Plays the rule set of this name. Planet keeps the latest decision by decided_at, so a call made twice, or after a
  // newer one, changes nothing. FailedPrecondition for a name planet keeps no set of, or a set it cannot play: planet
  // plays on the set it plays.
  rpc PlayRuleSet(PlayRuleSetRequest) returns (PlayRuleSetResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Wipes the map: every tile goes blank, with no holder and no shield, and every fortify lock goes. The map starts a
  // new epoch, so every client reads it again. Planet keeps each reset_id it applied, so a reset asked twice wipes
  // once. decided_at is when the reset is due: a replay never reaches before it. The wipe goes on when the caller gives
  // up. InvalidArgument for a reset with no id or no time.
  rpc ResetMap(ResetMapRequest) returns (ResetMapResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // An arena is the blank map an arena battle is fought on, kept apart from the world's map, which plays again when it
  // closes. Each call is idempotent by arena_id, and its swap of the map goes on when the caller gives up.
  //
  // Plays the arena's map, fresh, while the world's map stays as it is: a new epoch, so every client reads the map
  // again. The map starts as rule_set's seed says. Every play is refused for rule_set's arena.freeze after it opens and
  // before ends_at. An arena open already is left as it is. FailedPrecondition for an arena closed already, at or after
  // ends_at, while another is open, or with a set planet cannot seed it with; InvalidArgument for a bad id.
  rpc OpenArena(OpenArenaRequest) returns (OpenArenaResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Deletes the arena's map and plays the world's again, with a new epoch. An arena never opened closes with the map
  // left as it is, and never opens. One closed already is left as it is. InvalidArgument for a bad id.
  rpc CloseArena(CloseArenaRequest) returns (CloseArenaResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // AdminService/GetLedger, for the clips module's cast: who took which tile.
  rpc GetLedger(GetLedgerRequest) returns (GetLedgerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetTakesByCountry(GetTakesByCountryRequest) returns (GetTakesByCountryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The ledger's totals from since to until, for the gamemaster's season totals. A scan of the window: the caller
  // keeps the answer. InvalidArgument unless since is before until.
  rpc GetLedgerTotals(GetLedgerTotalsRequest) returns (GetLedgerTotalsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The map every step from since to until, replayed from the ledger's first event, for the gamemaster's season replay.
  // A read of the whole ledger: the caller keeps the answer. InvalidArgument unless since is before until, and the step
  // makes 5,000 frames at most.
  rpc GetMapHistory(GetMapHistoryRequest) returns (GetMapHistoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetTerritories(GetTerritoriesRequest) returns (GetTerritoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetCountrySizes(GetCountrySizesRequest) returns (GetCountrySizesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetAllegianceOf(GetAllegianceOfRequest) returns (GetAllegianceOfResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetRuleSetNames(GetRuleSetNamesRequest) returns (GetRuleSetNamesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The values a set plays: default's, with the set's own written over them, for the promo module's cards. NotFound for
  // a set postgres does not keep.
  rpc GetRuleSet(GetRuleSetRequest) returns (GetRuleSetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetMapHistoryRequest {
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp until = 2;
  google.protobuf.Duration step = 3;
}

message GetMapHistoryResponse {
  MapHistory history = 1;
}

message GetLedgerTotalsRequest {
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp until = 2;
}

message GetLedgerTotalsResponse {
  LedgerTotals totals = 1;
}

message GetTakesByCountryRequest {
  string account_id = 1;
}

message GetTakesByCountryResponse {
  repeated CountryTakes taken_for = 1;
  repeated CountryTakes taken_from = 2;
}

message CountryTakes {
  string country_id = 1;
  uint64 tiles = 2;
}

message GetTerritoriesRequest {}

message GetTerritoriesResponse {
  uint32 tiles = 1;
  repeated Territory territories = 2;
}

message Territory {
  string country_id = 1;
  uint32 tiles = 2;
  // Where the tiles are: how many on each country's land.
  repeated Ground grounds = 3;
}

message Ground {
  string country_id = 1;
  uint32 tiles = 2;
}

message GetCountrySizesRequest {}

// How many tiles of land each country has, all its landmasses together.
message GetCountrySizesResponse {
  repeated CountrySize country_sizes = 1;
}

message CountrySize {
  string country_id = 1;
  uint32 tiles = 2;
}

message GetAllegianceOfRequest {
  string account_id = 1;
}

// Unset for an account that never pledged a flag.
message GetAllegianceOfResponse {
  Allegiance allegiance = 1;
}


message GetRuleSetNamesRequest {}

// The name of every rule set postgres keeps.
message GetRuleSetNamesResponse {
  repeated string names = 1;
}

message GetRuleSetRequest {
  string name = 1;
}

message GetRuleSetResponse {
  // Every value, the set's own or default's.
  Rules played = 1;
}

message PlayRuleSetRequest {
  string rule_set = 1;
  google.protobuf.Timestamp decided_at = 2;
}

// Planet plays the latest decision.
message PlayRuleSetResponse {}

message ResetMapRequest {
  string reset_id = 1;
  google.protobuf.Timestamp decided_at = 2;
}

// The map is wiped, by this reset or the same one before.
message ResetMapResponse {}

message OpenArenaRequest {
  string arena_id = 1;
  google.protobuf.Timestamp ends_at = 2;
  string rule_set = 3;
}

// The arena is open.
message OpenArenaResponse {}

message CloseArenaRequest {
  string arena_id = 1;
}

// The arena is closed.
message CloseArenaResponse {}
