syntax = "proto3";

package planet.v1;

import "planet/v1/planet.proto";

service InternalService {
  rpc GetTakesByCountry(GetTakesByCountryRequest) returns (GetTakesByCountryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetTerritories(GetTerritoriesRequest) returns (GetTerritoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetGrounds(GetGroundsRequest) returns (GetGroundsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GrantCharge(GrantChargeRequest) returns (GrantChargeResponse);

  rpc GetBombsAndFortifies(GetBombsAndFortifiesRequest) returns (GetBombsAndFortifiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetTakesByCountryRequest {
  string account_id = 1;
}

message GetTakesByCountryResponse {
  repeated CountryTakes taken_for = 1;
  repeated CountryTakes taken_from = 2;
}

message CountryTakes {
  string country_id = 1;
  uint64 tiles = 2;
}

message GetTerritoriesRequest {}

message GetTerritoriesResponse {
  uint32 tiles = 1;
  repeated Territory territories = 2;
}

message Territory {
  string country_id = 1;
  uint32 tiles = 2;
}

message GetGroundsRequest {}

message GetGroundsResponse {
  repeated Ground grounds = 1;
}

message Ground {
  string country_id = 1;
  uint32 tiles = 2;
}

message GrantChargeRequest {
  string account_id = 1;
  BonusKind kind = 2;
  uint32 amount = 3;
}

// 0 when the account already holds as much of the kind as it may.
message GrantChargeResponse {
  uint32 kept = 1;
}

message GetBombsAndFortifiesRequest {
  repeated string account_ids = 1;
}

message GetBombsAndFortifiesResponse {
  repeated BombsAndFortifies accounts = 1;
}

message BombsAndFortifies {
  string account_id = 1;
  uint64 bombs_dropped = 2;
  uint64 tiles_fortified = 3;
}
