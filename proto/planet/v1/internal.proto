syntax = "proto3";

package planet.v1;

import "planet/v1/planet.proto";

service InternalService {
  rpc GetTakesByCountry(GetTakesByCountryRequest) returns (GetTakesByCountryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetTerritories(GetTerritoriesRequest) returns (GetTerritoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetGrounds(GetGroundsRequest) returns (GetGroundsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetAllegianceOf(GetAllegianceOfRequest) returns (GetAllegianceOfResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetTakesByCountryRequest {
  string account_id = 1;
}

message GetTakesByCountryResponse {
  repeated CountryTakes taken_for = 1;
  repeated CountryTakes taken_from = 2;
}

message CountryTakes {
  string country_id = 1;
  uint64 tiles = 2;
}

message GetTerritoriesRequest {}

message GetTerritoriesResponse {
  uint32 tiles = 1;
  repeated Territory territories = 2;
}

message Territory {
  string country_id = 1;
  uint32 tiles = 2;
}

message GetGroundsRequest {}

message GetGroundsResponse {
  repeated Ground grounds = 1;
}

message Ground {
  string country_id = 1;
  uint32 tiles = 2;
}

message GetAllegianceOfRequest {
  string account_id = 1;
}

// Unset for an account that never pledged a flag.
message GetAllegianceOfResponse {
  Allegiance allegiance = 1;
}

