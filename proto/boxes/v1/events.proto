syntax = "proto3";

package boxes.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// What the boxes tell the other modules, over Redis Streams. Each message reads on the wire as the bonuses.v1 one of the
// same fields, which the bonuses module told until the boxes were a module of their own.

// A box caught by a caller with an account. Its first two fields read as bonuses.v1.BonusClaimed.
message BoxClaimed {
  string account_id = 1;
  google.protobuf.Timestamp claimed_at = 2;
  // The token the box was offered under: random, used once, so it names the catch.
  string token = 3;
  // The box offered early to a new account.
  bool welcome = 4;
}

// The box facts, for whoever judges the callers. Each is told at a later time than the one before: a time names its
// fact.

// A box claimed by the scope it was offered to.
message BoxCaught {
  string scope = 1;
  // From the offer to the claim.
  google.protobuf.Duration after = 2;
  google.protobuf.Timestamp caught_at = 3;
}

// A box nobody claimed.
message BoxLapsed {
  string scope = 1;
  google.protobuf.Timestamp lapsed_at = 2;
}

// A claim of a box offered to another scope, or to nobody the boxes remember.
message ForeignBoxClaimed {
  string scope = 1;
  google.protobuf.Timestamp claimed_at = 2;
}
