syntax = "proto3";

package boxes.v1;

import "boxes/v1/rules.proto";

// The rules the boxes are offered by. No authentication of its own: served on the console listener, and on the admin
// listener behind its gate. Never the public router.
service AdminService {
  // Every rule set the boxes keep, and the one they play now: when a box comes, how long it flies, and a newcomer's
  // first box. What a box holds is the bonuses module's rules. SaveRuleSet changes one.
  rpc GetRules(GetRulesRequest) returns (GetRulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Makes a set, or replaces its values. A save of the set that plays now takes over at once. A save of default is
  // refused while another set could not play over it.
  rpc SaveRuleSet(SaveRuleSetRequest) returns (SaveRuleSetResponse);
}

message GetRulesRequest {}

message GetRulesResponse {
  // Every set postgres keeps, "default" first, as kept: one that cannot play too, so it can be mended.
  repeated RuleSet sets = 1;
  // The set the boxes play now: the one the schedule played last, or "default".
  string playing = 2;
}

message RuleSet {
  string name = 1;
  Rules rules = 2;
}

message SaveRuleSetRequest {
  RuleSet set = 1;
}

message SaveRuleSetResponse {}
