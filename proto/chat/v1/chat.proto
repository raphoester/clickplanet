syntax = "proto3";

package chat.v1;

import "player/v1/color.proto";

// A request for a flag's room is FailedPrecondition when the caller does not play for that flag.
service ChatService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);

  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListenForEvents(ListenForEventsRequest) returns (stream ChatEvent);

  rpc React(ReactRequest) returns (ReactResponse);

  rpc MarkSeen(MarkSeenRequest) returns (MarkSeenResponse);
}

enum Reaction {
  REACTION_UNSPECIFIED = 0;
  REACTION_LAUGH = 1;
  REACTION_CLOWN = 2;
  REACTION_SKULL = 3;
  REACTION_FIRE = 4;
  REACTION_THUMBS_UP = 5;
  REACTION_THUMBS_DOWN = 6;
  REACTION_HEART = 7;
  REACTION_CRY = 8;
  REACTION_SCREAM = 9;
  REACTION_COOL = 10;
  REACTION_THINK = 11;
  REACTION_POOP = 12;
  REACTION_PARTY = 13;
  REACTION_MIND_BLOWN = 14;
  REACTION_NERD = 15;
  REACTION_EARTH = 16;
}

message ReactionCount {
  Reaction reaction = 1;
  uint32 count = 2;
  bool mine = 3;
  repeated string reactors = 4;
}

message ChatMessage {
  string id = 1;
  int64 sent_at_unix_ms = 2;
  string author_name = 3;
  reserved 4;
  reserved "author_tag";
  string country_id = 5;
  // Neither once an operator removed it.
  oneof body {
    string text = 6;
    Gif gif = 16;
  }
  bool author_admin = 7;
  repeated ReactionCount reactions = 8;
  uint64 reactions_version = 9;
  player.v1.NameColor author_color = 10;
  // The author's badges are player.v1.PlayerService/GetBadges', by author_account_id.
  reserved 11, 12;
  reserved "author_streak", "author_title";
  Quote reply_to = 13;
  // Empty for a message kept before accounts, and for an account that was deleted.
  string author_account_id = 14;
  // An operator removed it: it keeps its place, with no body and no reactions.
  bool removed = 15;
}

// A GIF from KLIPY, at the address KLIPY gave for it.
message Gif {
  string url = 1;
  uint32 width = 2;
  uint32 height = 3;
}

message Quote {
  string message_id = 1;
  string author_name = 2;
  player.v1.NameColor author_color = 3;
  // Neither when the message quoted was removed.
  oneof body {
    string text = 4;
    Gif gif = 6;
  }
  bool removed = 5;
}

message SendMessageRequest {
  reserved 1;
  reserved "author_name";
  string author_id = 2;
  string country_id = 3;
  oneof body {
    string text = 4;
    // Refused, PermissionDenied, from a guest, and from an account a mute of the GIFs holds.
    Gif gif = 7;
  }
  string reply_to_message_id = 5;
  // The flag whose room it goes to: only the accounts that play for that flag read and write there. Empty for the chat
  // everyone reads.
  string flag_room = 6;
}

message SendMessageResponse {
  ChatMessage message = 1;
}

// What a mute takes away.
enum MuteKind {
  // The whole chat: every post and every reaction.
  MUTE_KIND_CHAT = 0;
  // A post with a GIF. The player still writes and reacts.
  MUTE_KIND_GIFS = 1;
}

message MuteRefusal {
  int64 muted_until_unix_ms = 1;
  MuteKind kind = 2;
}

message GetHistoryRequest {
  // As SendMessageRequest.flag_room. A flag's room has no announcements.
  string flag_room = 1;
}

message Announcement {
  string id = 1;
  int64 announced_at_unix_ms = 2;

  string kind = 3;

  string payload = 4;
}

message GetHistoryResponse {
  repeated ChatMessage messages = 1;
  repeated Announcement announcements = 2;
  int64 seen_until_unix_ms = 3;
}

message MarkSeenRequest {
  int64 seen_until_unix_ms = 1;
  // As SendMessageRequest.flag_room: each room keeps its own mark.
  string flag_room = 2;
}

message MarkSeenResponse {}

message ReactRequest {
  string message_id = 1;
  Reaction reaction = 2;
  bool on = 3;
}

message ReactResponse {
  repeated ReactionCount reactions = 1;
  uint64 version = 2;
}

message ListenForEventsRequest {
  // As SendMessageRequest.flag_room. A flag's stream ends, FailedPrecondition, once the caller pledges another flag.
  string flag_room = 1;
}

message ChatEvent {
  oneof event {
    ChatMessage message = 1;
    Heartbeat heartbeat = 2;
    ReactionsChanged reactions = 3;
    Announcement announcement = 4;
    MessageRemoved message_removed = 5;
  }
}

// An operator removed it: a client keeps it in its place with no text and no reactions, and empties every quote of it.
message MessageRemoved {
  string message_id = 1;
}

message ReactionsChanged {
  string message_id = 1;
  repeated ReactionCount reactions = 2;
  uint64 version = 3;
}

message Heartbeat {}
