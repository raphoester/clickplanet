syntax = "proto3";

package chat.v1;

import "chat/v1/chat.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// No authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the public router.
service AdminService {
  // Takes a player's chat away and leaves it the map: its account, and its network (the /64 of its latest message, or
  // the address over IPv4), are refused posts and reactions until the mute ends. The chat announces it. Of the kind
  // asked: the whole chat, or its GIFs alone. Each kind is a mute of its own, and neither ends the other.
  rpc Mute(MuteRequest) returns (MuteResponse);

  // Ends now every mute of the kind given to the account, with the network each holds. A mute given to another account on its network still holds it. NotFound when none runs.
  rpc Unmute(UnmuteRequest) returns (UnmuteResponse);

  // The mute of the kind that holds the account now, given to it or to another account on the network it last posted from; the one that ends last. Nothing set when none holds it.
  rpc GetMute(GetMuteRequest) returns (GetMuteResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Its text and reactions go for everyone, at once, and nobody reacts to it or answers it; it keeps its place, and the row is kept as evidence. NotFound past the retention.
  rpc RemoveMessage(RemoveMessageRequest) returns (RemoveMessageResponse);

  // A message as it was sent, removed or not. NotFound past the retention.
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The messages kept, as they were sent, removed or not, a page at a time. A message's id is a cursor: the page just before it, or just after it. NotFound for a cursor past the retention. With an account, that account's messages alone.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The moderation history: every mute, unmute and removal an operator made, with the reason given and who made it,
  // newest first. Kept for its own retention (90 days), past the chat's, and forgotten with the account. One account's,
  // or every account's. An operator's renames are player.v1.AdminService/ListRenames.
  rpc ListModeration(ListModerationRequest) returns (ListModerationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Starts raid mode, for a raid of guest accounts: while it runs, a guest's post is refused (PermissionDenied), and a
  // signed-in player posts as before. Everyone still reads and reacts. It ends by itself after the duration, 24 hours
  // at most. Set again while it runs, it starts again from now, with the new duration and reason. A duration of 0, or
  // none, ends it now; ending it when none runs changes nothing.
  rpc SetRaidMode(SetRaidModeRequest) returns (SetRaidModeResponse);

  // Whether raid mode runs now: since when, until when, and why. Nothing set when it does not.
  rpc GetRaidMode(GetRaidModeRequest) returns (GetRaidModeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message MuteRequest {
  string account_id = 1;
  // Unset is one hour; otherwise whole seconds.
  google.protobuf.Duration duration = 2;
  MuteKind kind = 3;
  // Why, in a few words, kept in the moderation history (ListModeration). Optional; 500 characters at most.
  string reason = 4;
}

message MuteResponse {
  string scope = 1;
  google.protobuf.Timestamp muted_until = 2;
}

message UnmuteRequest {
  string account_id = 1;
  MuteKind kind = 2;
  // Why, in a few words, kept in the moderation history (ListModeration). Optional; 500 characters at most.
  string reason = 3;
}

message UnmuteResponse {
  // The end of the mute that would have ended last.
  google.protobuf.Timestamp muted_until = 1;
}

message GetMuteRequest {
  string account_id = 1;
  MuteKind kind = 2;
}

message GetMuteResponse {
  // Unset when no mute holds the account.
  google.protobuf.Timestamp muted_until = 1;
  // The account the mute was given to: the one asked about, or another on its network, whose mute Unmute on this one leaves.
  string muted_account_id = 2;
}

message RemoveMessageRequest {
  string message_id = 1;
  // Why, in a few words, kept in the moderation history (ListModeration). Optional; 500 characters at most.
  string reason = 2;
}

message RemoveMessageResponse {
  google.protobuf.Timestamp removed_at = 1;
}

message GetMessageRequest {
  string message_id = 1;
}

message GetMessageResponse {
  string message_id = 1;
  // Empty for a message kept before accounts, or of a deleted account.
  string account_id = 2;
  oneof body {
    string text = 3;
    Gif gif = 8;
  }
  google.protobuf.Timestamp sent_at = 4;
  string country_id = 5;
  // Unset while the message is shown.
  google.protobuf.Timestamp removed_at = 6;
  // The flag whose room it was said in. Empty for the chat everyone reads.
  string flag_room = 7;
}

message ListMessagesRequest {
  // The page of the messages sent just before this one. Neither cursor is the newest page; both is InvalidArgument.
  string before_message_id = 1;
  // The page of the messages sent just after this one.
  string after_message_id = 2;
  // 50 unless asked, 200 at most.
  uint32 limit = 3;
  // Only this account's messages, the cursors included: a page is its messages sent just before or after the cursor. Empty is everyone's; not a UUID is InvalidArgument.
  string account_id = 4;
}

message ListMessagesResponse {
  // Oldest first. Fewer than the limit: nothing more is kept before it, or nothing more was sent after it.
  repeated KeptMessage messages = 1;
}

// A message as it was sent, removed or not, for an operator.
message KeptMessage {
  string message_id = 1;
  // Empty for a message kept before accounts.
  string account_id = 2;
  // Its author's name now: the name it was sent under for a message kept before accounts, [deleted] for an account nobody can name any more.
  string author_name = 3;
  oneof body {
    string text = 4;
    Gif gif = 10;
  }
  google.protobuf.Timestamp sent_at = 5;
  string country_id = 6;
  // Unset while the message is shown.
  google.protobuf.Timestamp removed_at = 7;
  // The message it answers. Unset for none, and for one past the retention.
  KeptQuote reply_to = 8;
  // The flag whose room it was said in. Empty for the chat everyone reads.
  string flag_room = 9;
}

// The message a reply answers, as it was sent, removed or not.
message KeptQuote {
  string message_id = 1;
  // As KeptMessage.author_name.
  string author_name = 2;
  oneof body {
    string text = 3;
    Gif gif = 5;
  }
  // Unset while the message is shown.
  google.protobuf.Timestamp removed_at = 4;
}

message ListModerationRequest {
  // Only the actions taken on this account. Empty is every account's; not a UUID is InvalidArgument.
  string account_id = 1;
  // Only the actions taken at this time or after. Unset is the whole history kept.
  google.protobuf.Timestamp since = 2;
  // 50 unless asked, 500 at most.
  uint32 limit = 3;
}

message ListModerationResponse {
  // Newest first. Fewer than the limit: every action kept since then.
  repeated ModerationAction actions = 1;
}

// One action an operator took on an account in the chat.
message ModerationAction {
  string action_id = 1;
  // The account it was taken on, never the network a mute also holds. Empty for a message kept before accounts.
  string account_id = 2;
  google.protobuf.Timestamp acted_at = 3;
  oneof action {
    MuteAction mute = 4;
    UnmuteAction unmute = 5;
    RemovalAction removal = 6;
  }
  // The reason given. Empty for none.
  string reason = 7;
  // The operator's account. Empty for a call on the console listener, which has no gate.
  string operator_account_id = 8;
  // The app the operator connected that made the call, as it registered: "Claude". Empty for the operator's own page.
  string client = 9;
}

message MuteAction {
  MuteKind kind = 1;
  google.protobuf.Duration duration = 2;
}

// Ended now every mute of the kind given to the account.
message UnmuteAction {
  MuteKind kind = 1;
}

message RemovalAction {
  string message_id = 1;
  // The message as it was sent, copied with the removal (never its address), so it outlives the chat's retention.
  oneof body {
    string text = 2;
    Gif gif = 3;
  }
}

message SetRaidModeRequest {
  // How long it runs from now, in whole seconds, 24 hours at most. 0, or unset, ends it now.
  google.protobuf.Duration duration = 1;
  // Why, in a few words. Optional; 500 characters at most.
  string reason = 2;
}

message SetRaidModeResponse {
  // The raid mode that runs now. Unset once it was ended.
  RaidMode raid_mode = 1;
}

message GetRaidModeRequest {}

message GetRaidModeResponse {
  // Unset when raid mode does not run.
  RaidMode raid_mode = 1;
}

// While it runs, the chat takes no guest's post.
message RaidMode {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp ends_at = 2;
  // Empty for none.
  string reason = 3;
}
