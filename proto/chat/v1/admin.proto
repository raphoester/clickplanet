syntax = "proto3";

package chat.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// No authentication of its own: served on the console listener, and on the admin listener behind its gate. Never the public router.
service AdminService {
  rpc Mute(MuteRequest) returns (MuteResponse);
}

message MuteRequest {
  string account_id = 1;
  google.protobuf.Duration duration = 2;
}

message MuteResponse {
  string scope = 1;
  google.protobuf.Timestamp muted_until = 2;
}
