syntax = "proto3";

package chat.v1;

import "chat/v1/chat.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message MessageSent {
  string message_id = 1;
  string account_id = 2;
  google.protobuf.Timestamp sent_at = 3;
}

message AccountMuted {
  string account_id = 1;
  google.protobuf.Timestamp muted_at = 2;
  google.protobuf.Duration duration = 3;
  string mute_id = 4;
  // What the mute takes away: the chat announces a mute of the GIFs as such.
  MuteKind kind = 5;
}
