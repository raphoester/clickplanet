syntax = "proto3";

package missions.v1;

import "planet/v1/planet.proto";

service MissionService {
  rpc GetMissions(GetMissionsRequest) returns (GetMissionsResponse);
}

message GetMissionsRequest {}

// The caller's own missions of the day, drawn at its first read or take for the flag it played then.
message GetMissionsResponse {
  string country_id = 1 [deprecated = true];
  bool enlisted = 2 [deprecated = true];
  int64 ends_at_unix_ms = 3;
  repeated Mission missions = 4;
}

// What every mission has. What it asks is its kind's own message: a client skips a kind it does not know.
message Mission {
  string id = 1;
  MissionReward reward = 2;
  bool done = 3;
  // A done mission is paid at once, or a guest's when it signs in that day.
  bool paid = 4;

  oneof kind {
    TakeFor take_for = 10;
    TakeFrom take_from = 11;
    TakeIn take_in = 12;
    TakeFromIn take_from_in = 13;
    CatchBoxes catch_boxes = 14;
    AnswerQuizzes answer_quizzes = 15;
    BombIn bomb_in = 16;
    ShieldTiles shield_tiles = 17;
    FortifyTiles fortify_tiles = 18;
  }
}

// Take goal tiles for country_id.
message TakeFor {
  string country_id = 1;
  uint32 goal = 2;
  uint32 taken = 3;
}

// Take goal tiles that country_id held.
message TakeFrom {
  string country_id = 1;
  uint32 goal = 2;
  uint32 taken = 3;
}

// Take goal tiles on country_id's land.
message TakeIn {
  string country_id = 1;
  uint32 goal = 2;
  uint32 taken = 3;
}

// Take goal tiles that country_id held on ground_id's land.
message TakeFromIn {
  string country_id = 1;
  string ground_id = 2;
  uint32 goal = 3;
  uint32 taken = 4;
}

// Catch goal boxes.
message CatchBoxes {
  uint32 goal = 1;
  uint32 caught = 2;
}

// Answer goal quizzes right.
message AnswerQuizzes {
  uint32 goal = 1;
  uint32 answered = 2;
}

// Drop goal bombs on country_id's land.
message BombIn {
  string country_id = 1;
  uint32 goal = 2;
  uint32 dropped = 3;
}

// Bring goal tiles to shields shields each.
message ShieldTiles {
  uint32 shields = 1;
  uint32 goal = 2;
  uint32 shielded = 3;
}

// Fortify goal tiles: each landmass made whole counts its tiles.
message FortifyTiles {
  uint32 goal = 1;
  uint32 fortified = 2;
}

// A client skips a mission whose reward it does not know.
message MissionReward {
  oneof kind {
    Charges charges = 1;
  }
}

message Charges {
  planet.v1.BonusKind kind = 1;
  uint32 amount = 2;
}
