syntax = "proto3";

package seasons.v1;

import "google/protobuf/timestamp.proto";

// The rule schedule: which rule set planet and the antibot play, and when. No authentication of its own: served on the
// console listener, and on the admin listener behind its gate. Never the public router. No call changes what plays
// now: only an entry to come is added, changed or deleted.
service AdminService {
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);

  // Adds an entry that starts later, at a priority above 0. Its set must be one planet and the antibot keep:
  // FailedPrecondition otherwise.
  rpc AddEntry(AddEntryRequest) returns (AddEntryResponse);

  // Changes an entry that has not started, by the rules of AddEntry. FailedPrecondition once it started.
  rpc EditEntry(EditEntryRequest) returns (EditEntryResponse);

  // Deletes an entry that has not started. FailedPrecondition once it started.
  rpc DeleteEntry(DeleteEntryRequest) returns (DeleteEntryResponse);
}

message GetScheduleRequest {}

message GetScheduleResponse {
  // The seasons' phases, by start, at priority 0: the config's, which no call changes.
  repeated Phase phases = 1;
  // The operators' entries, by start, the past ones too.
  repeated Entry entries = 2;
  Playing playing = 3;
}

enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_DAYS = 1;
  STAGE_FINALE = 2;
  STAGE_OVER = 3;
}

message Phase {
  uint32 season = 1;
  Stage stage = 2;
  string rule_set = 3;
  // Unset for the first season's days, which started before anything.
  google.protobuf.Timestamp starts_at = 4;
  // Unset after the last season: it never ends.
  google.protobuf.Timestamp ends_at = 5;
}

message Entry {
  string id = 1;
  string rule_set = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  // Above 0. At one priority, the entry made last plays.
  uint32 priority = 5;
  google.protobuf.Timestamp made_at = 6;
}

// What the schedule plays now: the running entry with the highest priority, else "default".
message Playing {
  string rule_set = 1;
  // Unset when it has played since before anything.
  google.protobuf.Timestamp since = 2;
  // The operator's entry that plays; empty when a phase plays, or none.
  string entry_id = 3;
}

message AddEntryRequest {
  string rule_set = 1;
  google.protobuf.Timestamp starts_at = 2;
  google.protobuf.Timestamp ends_at = 3;
  uint32 priority = 4;
}

message AddEntryResponse {
  string id = 1;
}

message EditEntryRequest {
  string id = 1;
  string rule_set = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  uint32 priority = 5;
}

message EditEntryResponse {}

message DeleteEntryRequest {
  string id = 1;
}

message DeleteEntryResponse {}
