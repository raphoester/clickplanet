syntax = "proto3";

package seasons.v1;

import "seasons/v1/rules.proto";

// The rules seasons counts points with. No authentication of its own: served on the console listener, and on the admin
// listener behind its gate. Never the public router.
service AdminService {
  rpc GetRules(GetRulesRequest) returns (GetRulesResponse);

  // Makes a set, or replaces its values. A set that plays now is FailedPrecondition: the rules in force change only
  // through the schedule.
  rpc SaveRuleSet(SaveRuleSetRequest) returns (SaveRuleSetResponse);
}

message GetRulesRequest {}

message GetRulesResponse {
  // Every set postgres keeps, "default" first.
  repeated RuleSet sets = 1;
  // The set seasons counts with now: the one the schedule played last, or "default".
  string playing = 2;
}

message RuleSet {
  string name = 1;
  Rules rules = 2;
}

message SaveRuleSetRequest {
  RuleSet set = 1;
}

message SaveRuleSetResponse {}
