syntax = "proto3";

package seasons.v1;

import "google/protobuf/timestamp.proto";

message RoundClosed {
  uint32 season = 1;
  uint32 number = 2;
  bool finale = 3;
  google.protobuf.Timestamp ended_at = 4;
  repeated RoundResult results = 5;
}

message RoundResult {
  string country = 1;
  uint32 rank = 2;
  uint32 points = 3;
}

message SeasonClosed {
  uint32 season = 1;
  google.protobuf.Timestamp ended_at = 2;
  repeated SeasonPlace table = 3;
}

message SeasonPlace {
  string country = 1;
  uint32 rank = 2;
  uint32 points = 3;
  uint32 rounds_won = 4;
  uint32 finale_points = 5;
}

message SeasonPlayed {
  uint32 season = 1;
  string account_id = 2;
  string main_flag = 3;
  uint64 tiles = 4;
  bool won = 5;
}
